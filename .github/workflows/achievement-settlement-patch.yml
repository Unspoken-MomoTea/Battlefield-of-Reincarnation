name: Apply achievement settlement patch

on:
  push:
    paths:
      - '.github/workflows/achievement-settlement-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          exec(compile(base64.b64decode(''), '<achievement-patch>', 'exec'))
          PY
          node --check 'script/辅助计算脚本.js'
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/achievement-settlement-patch.yml
          git add 'script/辅助计算脚本.js' 'script/ZOD脚本.js' 'World Book/⚙️任务与委托系统.txt' 'World Book/【结算任务】[mvu_plot].txt'
          git commit -m 'settle achievement rewards at world clear'
          git push origin HEAD:main
