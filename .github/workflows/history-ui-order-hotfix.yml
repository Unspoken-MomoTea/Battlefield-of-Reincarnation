name: history-ui-order-hotfix
on:
  push:
    branches: [fix/history-ui-order]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm old order fails regression
        run: |
          if node tests/world-engine-history-memory.cjs; then
            echo 'expected old history UI order to fail regression'
            exit 1
          fi
          echo 'confirmed: long-term history currently renders before recent history'
      - name: Swap history UI order
        run: python tools/patch-history-ui-order.py
      - name: Build world engine
        run: python tools/build-world-engine.py
      - name: Syntax check
        run: node --check script/世界推进系统.js
      - name: History memory regression
        run: node tests/world-engine-history-memory.cjs
      - name: Module synchronization
        run: node tests/world-engine-modules.cjs
      - name: Commit hotfix and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/patch-history-ui-order.py .github/workflows/history-ui-order-hotfix.yml
          git add script/world-engine-src/50-engine-ui.part.js script/世界推进系统.js tests/world-engine-history-memory.cjs
          git commit -m "fix: show recent history before long-term summary"
          git push
