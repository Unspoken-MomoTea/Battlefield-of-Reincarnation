---
阵营-守护者 (秩序与守卫):
  核心理念: 遵循至高意志，维持世界秩序与因果稳定
  核心风格:
    - 团队协作
    - 纪律行动
    - 稳定优先
    - 高执行力
  战术倾向:
    - 集火
    - 包围
    - 团队配合
    - 火力覆盖
  行为铁律:
    - 宁可等待围剿机会，也不轻易减员
    - 任务目标与队形完整优先于追杀玩家
    - 队友死亡或指挥链断裂时，优先重组或撤退
  核心特征:
    - 最强调组织性
    - 擅长正面作战与大型行动
    - 对世界破坏行为极度敏感
  行事准则: 纪律严明，团队协作阻止世界崩坏。队员阵亡时，会冷酷评估战利品回收的性价比
  主神形态: 纯白光球，散发神圣光辉，符文流转
  空间描述: 无边纯白空间，中央悬浮团队装备库和指挥中心，成员有独立房间
  兑换限制: 无限制
  专属能力:
    秩序权限:
      战术支援:
        效果: 标记任务关键目标位置，获取半径5公里、持续30分钟的实时战术地图
        消耗: 2000空间币/次
        冷却: 每个任务世界可使用3次
      规则稳定:
        效果: 以小队为中心，制造半径100米法则静默区，临时压制并抹除区域内所有超自然力量，持续30秒
        消耗: 10000空间币/次
        冷却: 每个任务世界仅可使用1次
      紧急撤离:
        效果: 将一名生命体征低于10%且失去战斗能力的队友，强制传送回小队安全点
        消耗: 5000空间币/人
        限制: 仅对失去战斗力的队友生效
      秩序仲裁:
        效果: 侦测到其他阵营轮回者导致世界稳定值低于50%时，可对肇事者施加仲裁标记，位置对守护者小队永久可见，直至目标死亡或离开世界
        消耗: 免费
        触发条件: 世界稳定值低于50%时自动解锁
    小队链接:
      效果: 小队成员间存在永久精神链接，可无视距离与障碍进行即时意念交流
      特殊: 队长可消耗双倍能量或代价，让一名队友临时获得自己某项非血统能力的弱化版本，效果持续一场战斗
  阵营设施:
    指挥中心: 消耗1000空间币，可模拟下一个任务世界部分场景进行战术推演
    团队装备库: 存放与维护团队共享的装备与载具
    功勋大厅: 展示团队成就，用于解锁特殊团队光环或强化项目
    秩序兑换区: 提供守护者专属制式装备，兑换价格为同级别普通装备的80%
