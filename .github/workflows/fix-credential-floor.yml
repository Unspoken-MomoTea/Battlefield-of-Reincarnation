name: Fix credential floor reward

on:
  push:
    paths:
      - '.github/workflows/fix-credential-floor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch reward grade
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('Regular/结算任务美化.html'); b=p.read_bytes(); old=b'const grantGrade = GRADES[targetIndex];'; new=b'const grantGrade = baseGrade;'; assert b.count(old)==1, b.count(old); p.write_bytes(b.replace(old,new,1))"
          grep -q "const grantGrade = baseGrade;" 'Regular/结算任务美化.html'
          ! grep -q "const grantGrade = GRADES\[targetIndex\];" 'Regular/结算任务美化.html'

      - name: Semantic regression cases
        shell: bash
        run: |
          python -c "import re; G=['F','E','D','C','B','A','S','SS','SSS']; floor=lambda v:min((re.findall(r'SSS|SS|S|A|B|C|D|E|F',str(v).upper()) or ['F']),key=G.index); grant=lambda h,d:(lambda b:b if G.index(b)>G.index(h) else None)(floor(d)); cases=[('F','E~SSS','E'),('F','C~SSS','C'),('F','S级','S'),('C','C~SSS',None),('B','C~SSS',None),('C','S~SSS','S'),('S','S~SSS',None),('S','SS~SSS','SS')]; bad=[x for x in cases if grant(x[0],x[1])!=x[2]]; assert not bad,bad; print('semantic cases OK')"

      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-credential-floor.yml
          git add 'Regular/结算任务美化.html'
          git add -u .github/workflows/fix-credential-floor.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix credential rewards to dungeon minimum grade"
          git push
