name: settlement-refactor-once

on:
  push:
    branches:
      - codex/move-settlement-finalization
    paths:
      - .github/workflows/settlement-refactor-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/move-settlement-finalization
          fetch-depth: 0

      - name: Apply patch
        run: |
          python3 .github/tmp/settlement_refactor.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script/辅助计算脚本.js')
          s = p.read_bytes().decode('utf-8')
          lines = s.splitlines(keepends=True)
          found = 0
          for i, line in enumerate(lines):
              if '试炼完成标记由结算任务美化器写回' not in line:
                  continue
              found += 1
              ending = '\r\n' if line.endswith('\r\n') else ('\n' if line.endswith('\n') else '')
              body = line[:-len(ending)] if ending else line
              lines[i] = body.rstrip() + ending
          if found != 1:
              raise SystemExit(f'expected one migrated comment line, got {found}')
          p.write_bytes(''.join(lines).encode('utf-8'))
          PY

      - name: Static checks
        run: |
          node --check script/辅助计算脚本.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('Regular/结算任务美化.html').read_bytes().decode('utf-8')
          m = re.search(r'<script>([\s\S]*?)</script>', src)
          if not m:
              raise SystemExit('embedded settlement script not found')
          Path('/tmp/settlement.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/settlement.js
          git diff --check
          git diff --stat

      - name: Commit patched sources
        run: |
          test -n "$(git status --porcelain -- script/辅助计算脚本.js Regular/结算任务美化.html)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/辅助计算脚本.js Regular/结算任务美化.html
          git commit -m "refactor: move settlement finalization into beautifier"
          git push origin HEAD:codex/move-settlement-finalization
