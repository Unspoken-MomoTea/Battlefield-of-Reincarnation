name: Merge achievement settlement module

on:
  push:
    paths:
      - '.github/workflows/merge-achievement-settlement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and run guarded patch
        shell: bash
        run: |
          git show c0afda3b5d0200cff8b71d999fb482950aeebbdb:.github/workflows/merge-achievement-settlement.yml > /tmp/previous-workflow.yml
          python - <<'PY'
          from pathlib import Path
          s = Path('/tmp/previous-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          python - <<'PY'\n"
          start = s.index(start_marker) + len(start_marker)
          end = s.index(end_marker, start)
          block = s[start:end]
          lines = [(line[10:] if line.startswith('          ') else line) for line in block.splitlines()]
          source = '\n'.join(lines) + '\n'
          bad_call = "once(old_tail, new_tail, 'insert achievement module into settlement renderer')"
          if source.count(bad_call) != 1:
              raise SystemExit('cannot neutralize old strict insertion')
          source = source.replace(bad_call, "pass  # insertion handled by stable single-line anchor below", 1)
          Path('/tmp/merge-achievement.py').write_text(source, encoding='utf-8')
          PY
          python /tmp/merge-achievement.py

          python - <<'PY'
          from pathlib import Path
          p = Path('Regular/结算任务美化.html')
          text = p.read_text(encoding='utf-8')
          anchor = "              html += '<div class=\"st-stage t-' + st.type + '\"><div class=\"st-stage-head\"><span class=\"st-stage-no\">' + (idx + 1) + '</span><span class=\"st-stage-name\">' + escapeHtml(st.name || '结算阶段') + '</span><span class=\"st-stage-line\"></span></div>' + inner + '</div>';\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'stable stage anchor expected once, got {text.count(anchor)}')
          insert = (
              "              // 与晋升试炼一样，副本成就是结算任务美化内部模块，不创建第二个正则窗口。\n"
              "              if (!achievementInserted && st.type === 'income' && achievementSnapshot.rows.length) {\n"
              "                inner += '<div class=\"st-achievement-host\">' + renderAchievementPanel() + '</div>';\n"
              "                achievementInserted = true;\n"
              "              }\n\n"
          )
          text = text.replace(anchor, insert + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('Regular/结算任务美化.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if len(scripts) != 1:
              raise SystemExit(f'expected one script block, found {len(scripts)}')
          Path('/tmp/settlement.js').write_text(scripts[0], encoding='utf-8')
          world = Path('World Book/【结算任务】[mvu_plot].txt').read_text(encoding='utf-8')
          snapshot_pos = world.rindex('<achievement settlement>')
          close_pos = world.rindex('</settlement tasks>')
          if snapshot_pos > close_pos:
              raise SystemExit('achievement snapshot is outside settlement tasks')
          if Path('Regular/成就结算美化.html').exists():
              raise SystemExit('standalone achievement beautifier still exists')
          PY
          node --check /tmp/settlement.js
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit merged module
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/merge-achievement-settlement.yml
          git add -A
          git commit -m 'merge achievement module into settlement beautifier'
          git push origin HEAD:main
