name: cleanup-obsolete-branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches already merged into main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0
          while IFS= read -r remote; do
            remote="${remote#origin/}"
            case "$remote" in
              HEAD|main|workshop-stable|'') continue ;;
            esac
            echo "Deleting merged branch: $remote"
            git push origin --delete "$remote"
            deleted=$((deleted + 1))
          done < <(git for-each-ref --format='%(refname:short)' --merged=origin/main refs/remotes/origin)
          echo "Deleted merged branches: $deleted" >> "$GITHUB_STEP_SUMMARY"

      - name: Report remaining branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          {
            echo '## Remaining remote branches'
            echo '```text'
            git for-each-ref --format='%(refname:short)' refs/remotes/origin | sed 's#^origin/##' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
