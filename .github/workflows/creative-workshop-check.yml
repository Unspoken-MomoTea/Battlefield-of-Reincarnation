name: creative-workshop-check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/CreativeWorkshop/**'
      - 'src/StatusBar/**'
      - 'src/Calculator/**'
      - 'src/opening/**'
      - 'Regular/开局.html'
      - 'dist/opening/**'
      - 'tools/build-opening.py'
      - 'tests/opening-page.cjs'
      - 'cloudflare/**'
      - '.github/workflows/creative-workshop-check.yml'
      - '.github/workflows/creative-workshop-promote-stable.yml'
      - '.github/workflows/world-engine-promote-stable.yml'
      - '.github/workflows/status-bar-promote-stable.yml'
      - '.github/workflows/calculator-promote-stable.yml'
      - '.github/workflows/opening-preview-deploy.yml'
      - '.github/workflows/deploy-workshop-staging.yml'
      - '.github/workflows/deploy-workshop-production.yml'
      - '创意工坊更新工具.bat'
  push:
    branches: [main]
    paths:
      - 'src/CreativeWorkshop/**'
      - 'src/StatusBar/**'
      - 'src/Calculator/**'
      - 'src/opening/**'
      - 'Regular/开局.html'
      - 'dist/opening/**'
      - 'tools/build-opening.py'
      - 'tests/opening-page.cjs'
      - 'cloudflare/**'
      - '.github/workflows/creative-workshop-check.yml'
      - '.github/workflows/creative-workshop-promote-stable.yml'
      - '.github/workflows/deploy-workshop-staging.yml'
      - '.github/workflows/deploy-workshop-production.yml'
      - '创意工坊更新工具.bat'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Client syntax
        run: find src/CreativeWorkshop -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Client contract tests
        run: node --test src/CreativeWorkshop/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Statusbar delivery synchronized
        run: python tools/build-status-bar.py --check
      - name: Statusbar source contracts
        run: node --test src/StatusBar/tests/*.test.mjs
      - name: Statusbar delivery syntax
        run: node --check script/悬浮球状态栏.js
      - name: Calculator delivery synchronized
        run: python tools/build-calculator.py --check
      - name: Calculator source contracts
        run: node --test src/Calculator/tests/*.test.mjs
      - name: Calculator delivery syntax
        run: node --check script/辅助计算脚本.js
      - name: Opening delivery synchronized
        run: python tools/build-opening.py --check
      - name: Opening syntax
        run: find src/opening -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Opening contract tests
        run: |
          node --test src/opening/tests/*.test.mjs
          node tests/opening-page.cjs
      - name: Worker syntax
        run: |
          find cloudflare/src -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find cloudflare/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
      - name: Worker contract tests
        working-directory: cloudflare
        run: npm test
      - name: Worker bundle dry-run
        working-directory: cloudflare
        run: |
          npm ci --no-audit --no-fund
          npx wrangler deploy --env production --dry-run
