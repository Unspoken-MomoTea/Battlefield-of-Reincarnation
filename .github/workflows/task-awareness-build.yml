name: task-awareness-build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply dungeon asset cleanup patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          dec = lambda s: base64.b64decode(s).decode('utf-8')
          p = Path('Regular/结算任务美化.html'); s = p.read_text(encoding='utf-8')
          old = dec('ICAgICAgICAgICAgICBzZXRWYWx1ZSh0YXNrcywgJ+WIl+ihqCcsIHt9KTsKICAgICAgICAgICAgICBzZXRWYWx1ZSh0YXNrcywgJ+WJr+acrOaIkOWwsScsIHt9KTsKCiAgICAgICAgICAgICAgY29uc3QgcnVtb3JzID0gZW5zdXJlT2JqZWN0KHN0YXQsICfkvKDpl7snKTsK')
          new = dec('')
          if old not in s: raise SystemExit('settlement cleanup anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          p = Path('script/辅助计算脚本.js'); s = p.read_text(encoding='utf-8')
          old = dec('')
          new = dec('')
          if old not in s: raise SystemExit('asset tombstone guard anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          p = Path('tests/task-settlement-simplified.cjs'); s = p.read_text(encoding='utf-8')
          anchor = dec('Zm9yIChjb25zdCBbbmFtZSwgaHRtbF0gb2YgW1sn5Li756We5Lu75Yqh576O5YyWJywgbWFpblVpXSwgWyfor5Xngrzku7vliqHnvo7ljJYnLCB0cmlhbFVpXSwgWyfnu5Pnrpfku7vliqHnvo7ljJYnLCBzZXR0bGVVaV1dKSB7Cg==')
          block = dec('')
          if anchor not in s: raise SystemExit('task settlement test anchor not found')
          p.write_text(s.replace(anchor, block + anchor, 1), encoding='utf-8')
          p = Path('tests/world-engine-asset-multi-owner.cjs'); s = p.read_text(encoding='utf-8')
          anchor = dec('YXNzZXJ0LmVxdWFsKGFmdGVyTWFudWFsRGVsZXRlLuS4lueVjC7lkI7lj7Au6LWE5Lqn5aKT56KRLuaXp+WhlCwgdW5kZWZpbmVkLCAn5piO56Gu6YeN5bu65ZCM5ZCN6LWE5Lqn5ZCO5b+F6aG76Kej6Zmk5Yig6Zmk5L+d5oqkJyk7Cg==')
          block = dec('')
          if anchor not in s: raise SystemExit('asset lifecycle test anchor not found')
          p.write_text(s.replace(anchor, anchor + block, 1), encoding='utf-8')
          PY
      - name: Regression tests
        run: |
          node tests/task-settlement-simplified.cjs
          node tests/world-engine-asset-multi-owner.cjs
      - name: Commit patch and restore workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path('.github/workflows/task-awareness-build.yml').write_text(base64.b64decode('').decode('utf-8'), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Regular/结算任务美化.html' 'script/辅助计算脚本.js' tests/task-settlement-simplified.cjs tests/world-engine-asset-multi-owner.cjs .github/workflows/task-awareness-build.yml
          git commit -m "fix: clean non-player assets after dungeon settlement"
          git push origin HEAD:main
