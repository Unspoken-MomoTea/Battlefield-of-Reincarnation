name: tmp-settlement-coin-standalone
on:
  push:
    branches: [fix/settlement-coin-standalone]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply task-independent coin patch
        run: python tools/patch-settlement-coin-task-independence.py
      - name: Apply standalone coin patch
        run: python tools/patch-settlement-snapshot-followup.py
      - name: Coin identity independence regression
        run: node tests/settlement-coin-task-independence.cjs
      - name: Standalone coin data regression
        run: node tests/settlement-snapshot-followup.cjs
      - name: Settlement persistence regression
        run: node tests/settlement-shop-coin-persistence.cjs
      - name: Simplified settlement regression
        run: node tests/task-settlement-simplified.cjs
