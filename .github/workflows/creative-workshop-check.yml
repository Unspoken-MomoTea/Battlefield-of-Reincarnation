name: creative-workshop-check

on:
  push:
    branches: [main]
    paths:
      - 'src/CreativeWorkshop/**'
      - 'cloudflare/**'
      - '.github/workflows/creative-workshop-check.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker contract tests
        working-directory: cloudflare
        run: npm test
      - name: Worker syntax
        run: |
          node --check cloudflare/src/index.js
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/http.js
          node --check cloudflare/src/security.js
          node --check cloudflare/src/engagement.js
          node --check cloudflare/src/projects/cover.js
          node --check cloudflare/src/projects.js
      - name: Client contract tests
        run: node --test src/CreativeWorkshop/tests/*.test.mjs
      - name: Client syntax
        run: |
          node --check src/CreativeWorkshop/index.js
          node --check src/CreativeWorkshop/config.js
          node --check src/CreativeWorkshop/services/api.js
          node --check src/CreativeWorkshop/services/storage.js
          node --check src/CreativeWorkshop/services/project-service.js
          node --check src/CreativeWorkshop/views/installed.js
          node --check src/CreativeWorkshop/views/admin.js
          node --check src/CreativeWorkshop/views/author.js
          node --check src/CreativeWorkshop/views/discover.js
          node --check src/CreativeWorkshop/ui/shell.js
          node --check src/CreativeWorkshop/services/api/admin.js
          node --check src/CreativeWorkshop/services/api/projects.js
          node --check src/CreativeWorkshop/services/api/auth.js
          node --check src/CreativeWorkshop/services/api/transport.js
          node --check src/CreativeWorkshop/services/tavern-adapter.js
          node --check src/CreativeWorkshop/services/installer.js
          node --check src/CreativeWorkshop/services/upload.js
          node --check src/CreativeWorkshop/services/project-service.js
