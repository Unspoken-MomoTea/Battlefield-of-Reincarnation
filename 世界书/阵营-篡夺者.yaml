---
阵营-篡夺者 (混沌与掠夺):
    核心理念: 掠夺即正义，强者拥有支配一切的资格
    核心风格:
        - 弱肉强食
        - 高风险竞争
        - 资源掠夺
        - 利益优先
    战术倾向:
        - 喜欢偷袭
        - 喜欢第三方收割
        - 喜欢借刀杀人
        - 喜欢埋伏撤退
    行为铁律:
        - 永远优先收益，而非胜负
        - 优先攻击孤立、受伤、资源耗尽或携带高价值物品的目标
        - 收益低于消耗时，转为埋伏、交易、撤退或牺牲低价值队友
    核心特征:
        - 阵营内部竞争激烈
        - 更容易主动制造冲突
        - 崇尚力量与收益
    行事准则: 视万界为狩猎场，崇尚猎杀同行爆装备，内部奉行黑暗森林法则
    主神形态: 暗红核心，灰白不稳定能量包裹，如饥饿猛兽
    空间描述: 永恒黄昏小镇，中心是领袖宫殿，公共区域无规则，角斗场喧嚣不息
    兑换限制: 仅可兑换基础生存物资与专属狩猎道具
    专属能力:
        掠夺:
          效果: 对濒死或完全无法反抗的目标使用，随机检视其三项血统或技能，并选择其一永久夺取
          消耗: 无
          限制: 每个任务世界仅可使用1次，仅可对同级或低一阶目标使用
        夺舍:
          效果: 吞噬濒死或完全无法反抗的目标，100%继承其所有能力、血统、技能与记忆
          限制: 每个任务世界仅可使用1次，目标最高不超过自身一阶
          费用表:
            Ⅰ级: 25
            Ⅱ级: 200
            Ⅲ级: 1000
            Ⅳ级: 5000
            Ⅴ级: 20000
            Ⅵ级: 80000
            Ⅶ级: 320000
            Ⅷ级: 1280000
            Ⅸ级: 5120000
          记忆融合规则:
            正面: 可在精神世界构建记忆宫殿，主动挖掘被夺舍者记忆
            负面: 被夺舍者执念形成意志烙印，触发意志闪回
            闪回等级: 轻度(情绪波动)、中度(战斗失控)、重度(精神损耗)
          净化方式:
            完成遗愿: 完成被夺舍者核心遗愿，可将负面影响直接降低一个阶段
            灵魂净化: 消耗空间币净化，总费用=夺舍费用×300%，分三阶段支付100%原费用，依次消除重度、中度、轻度影响
    阵营设施:
      角斗场: 篡夺者内部切磋场所，胜者可获得败者10%空间币
      狩猎工具兑换处:
        描述: 提供一次性狩猎工具
        定价规则: 工具价格为对应等级夺舍费用的10%~20%
        使用限制: 仅可对掠夺或夺舍允许范围内的目标生效
        示例:
          Ⅲ级灵魂回响探测器: 价格1000空间币，侦测Ⅲ级及以下目标三项核心能力
          Ⅳ级现实稳定锚: 价格15000空间币，小范围禁止Ⅳ级及以下目标空间传送
          Ⅴ级意志压制锁链: 价格40000空间币，强制延长Ⅴ级及以下濒死目标无法反抗时间
