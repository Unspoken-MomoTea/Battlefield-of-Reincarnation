name: statusbar-settlement-topbar
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat: surface settlement in statusbar topbar') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply statusbar settlement topbar patch
        run: python tools/patch-statusbar-settlement-topbar.py
      - name: Syntax check statusbar
        run: node --check script/悬浮球状态栏.js
      - name: Statusbar settlement topbar regression
        run: node tests/statusbar-settlement-topbar.cjs
      - name: Commit patch and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/patch-statusbar-settlement-topbar.py .github/workflows/statusbar-settlement-topbar.yml
          git add script/悬浮球状态栏.js tests/statusbar-settlement-topbar.cjs .github/workflows/task-awareness-build.yml .github/workflows/task-awareness-check.yml
          git commit -m "feat: surface settlement in statusbar topbar"
          git push
