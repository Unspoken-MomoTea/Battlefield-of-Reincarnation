name: programmatic-space-coin-settlement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply programmatic settlement patch
        run: python tools/patch-programmatic-space-coin-settlement.py
      - name: Settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: World-engine regressions
        run: |
          node tests/world-engine-superstable-prompt.cjs
          node tests/world-engine-task-awareness.cjs
          node tests/world-engine-chronology-guard.cjs
          node tests/world-engine-npc-audit-toggle.cjs
          node tests/world-engine-modules.cjs
      - name: Commit settlement renderer
        run: |
          if git diff --quiet -- Regular/结算任务美化.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Regular/结算任务美化.html
          git commit -m "refactor: programmatic space-coin settlement"
          git push
