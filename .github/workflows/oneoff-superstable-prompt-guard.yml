name: oneoff-superstable-prompt-guard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-superstable-prompt-guard.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python tools/superstable-prompt-guard.py
      - name: Build delivery
        run: python tools/build-world-engine.py
      - name: Syntax check
        run: node --check script/世界推进系统.js
      - name: Super-stable prompt regression
        run: node tests/world-engine-superstable-prompt.cjs
      - name: Task awareness regression
        run: node tests/world-engine-task-awareness.cjs
      - name: NPC audit regression
        run: node tests/world-engine-npc-audit-toggle.cjs
      - name: Module synchronization
        run: node tests/world-engine-modules.cjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/world-engine-src/00-foundation-prompt.part.js script/world-engine-src/40-engine-runtime.part.js script/辅助计算脚本.js script/世界推进系统.js tests/world-engine-superstable-prompt.cjs
          git commit -m "fix: shield super-stable worlds from defense prompts [task-awareness-built]"
          git push
