name: Apply settlement snapshot consistency fix

on:
  push:
    paths:
      - '.github/workflows/apply-settlement-snapshot-fix.yml'
      - 'tools/patch-settlement-snapshot-consistency-v2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply settlement snapshot patch
        run: |
          python tools/patch-settlement-snapshot-consistency-v2.py
          python - <<'PY'
          from pathlib import Path
          p=Path('Regular/结算任务美化.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              "          let credentialDecision = resolveCredentialDecision(settlementBaselineData);\n          let credentialGrant = credentialDecision && credentialDecision.granted ? credentialDecision : null;\n",
              "          const credentialDecision = resolveCredentialDecision(settlementBaselineData);\n          const credentialGrant = credentialDecision && credentialDecision.granted ? credentialDecision : null;\n"
          )
          s=s.replace("            credentialDecision=resolveCredentialDecision(settlementBaselineData);\n            credentialGrant=credentialDecision && credentialDecision.granted ? credentialDecision : null;\n","")
          s=s.replace(
              "              if (isLatestPanelMessage(win, currentId)) consider(ctx && ctx.data, false);",
              "              const currentIsLatest = typeof isLatestPanelMessage === 'function' && isLatestPanelMessage(win, currentId);\n              if (currentIsLatest) consider(ctx && ctx.data, false);"
          )
          s=s.replace(
              "              if (isLatestPanelMessage(win,currentId)) consider(ctx && ctx.data);",
              "              const currentIsLatest = typeof isLatestPanelMessage === 'function' && isLatestPanelMessage(win,currentId);\n              if (currentIsLatest) consider(ctx && ctx.data);"
          )
          s=s.replace(
              "              if (isSettlementTaskTerminal(task.状态)) score+=100;\n              else if (settlementTaskStatus(task.状态)) score+=10;",
              "              const status=String(task.状态 || '').trim();\n              const terminal=(typeof isSettlementTaskTerminal === 'function')\n                ? isSettlementTaskTerminal(status)\n                : ['可结算','可交付','待结算','结算','已结算','完成','已完成','结算完成','失败','已失败','任务失败'].indexOf(status)>=0;\n              if (terminal) score+=100;\n              else if (status) score+=10;"
          )
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check settlement script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('Regular/结算任务美化.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>',html)
          if len(scripts)!=1:
              raise SystemExit(f'expected one script, got {len(scripts)}')
          Path('/tmp/settlement.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/settlement.js
      - name: Settlement current panel regression
        run: node tests/settlement-current-panel-regression.cjs
      - name: Existing settlement regressions
        run: |
          node tests/task-settlement-simplified.cjs
          node tests/settlement-shop-coin-persistence.cjs
          node tests/settlement-message-marker.cjs
          node tests/settlement-status-aliases.cjs
          node tests/settlement-character-lifecycle.cjs
      - name: Commit fix and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-settlement-snapshot-fix.yml tools/patch-settlement-snapshot-consistency.py tools/patch-settlement-snapshot-consistency-v2.py
          git add 'Regular/结算任务美化.html' tests/settlement-current-panel-regression.cjs
          git commit -m 'fix: restore authoritative settlement task snapshots'
          git push origin HEAD:main
