name: one-shot-player-asset-owner-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, '[player-asset-owner-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Red - add player-name ownership regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          task_test = Path('tests/task-settlement-simplified.cjs')
          text = task_test.read_text(encoding='utf-8')
          old = """      资产: {
        玩家庄园: { 所属对象: ['<user>'], 类型: '固定地产' },
        共管基地: { 所属对象: ['盟友', '<user>'], 类型: '要塞' },
        敌军据点: { 所属对象: ['敌军'], 类型: '要塞' },
        无主遗迹: { 所属对象: [], 类型: '固定地产' },
        旧版玩家资产: { 类型: '固定地产' },
      },"""
          new = """      资产: {
        玩家庄园: { 所属对象: ['测试玩家'], 类型: '固定地产' },
        共管基地: { 所属对象: ['盟友', '测试玩家'], 类型: '要塞' },
        宏标记旧资产: { 所属对象: ['<user>'], 类型: '固定地产' },
        模板标记旧资产: { 所属对象: ['{{user}}'], 类型: '固定地产' },
        玩家别名旧资产: { 所属对象: ['玩家'], 类型: '固定地产' },
        敌军据点: { 所属对象: ['敌军'], 类型: '要塞' },
        无主遗迹: { 所属对象: [], 类型: '固定地产' },
        旧版玩家资产: { 类型: '固定地产' },
      },"""
          text = replace_once(text, old, new, 'settlement fixture assets')
          old = """const ordinaryFinalize = makeSettlementFinalizeData(false);
assert.equal(applySettlementFinalization(ordinaryFinalize, true), true);
assert.deepEqual(
  Object.keys(ordinaryFinalize.stat_data.资产).sort(),
  ['玩家庄园', '共管基地', '旧版玩家资产'].sort(),
  'ordinary dungeon settlement must remove assets whose owners do not include <user>'
);
assert.equal(ordinaryFinalize.stat_data.系统状态.是否在主神空间, true);"""
          new = """const previousWindow = global.window;
global.window = { parent: { SillyTavern: { name1: '测试玩家' } } };
const ordinaryFinalize = makeSettlementFinalizeData(false);
assert.equal(applySettlementFinalization(ordinaryFinalize, true), true);
assert.deepEqual(
  Object.keys(ordinaryFinalize.stat_data.资产).sort(),
  ['玩家庄园', '共管基地', '宏标记旧资产', '模板标记旧资产', '玩家别名旧资产', '旧版玩家资产'].sort(),
  'ordinary dungeon settlement must preserve assets owned by the actual Tavern player name and legacy player aliases'
);
assert.equal(ordinaryFinalize.stat_data.系统状态.是否在主神空间, true);
if (previousWindow === undefined) delete global.window;
else global.window = previousWindow;"""
          text = replace_once(text, old, new, 'settlement player-name assertion')
          task_test.write_text(text, encoding='utf-8')

          multi = Path('tests/world-engine-asset-multi-owner.cjs')
          text = multi.read_text(encoding='utf-8')
          old = """// 直接执行辅助脚本中的两个纯函数，锁定“只有字面 <user> 才收菜”与删除墓碑行为。
const ownerStart = helper.indexOf('function isPlayerOwnedAsset(');
const ownerEnd = helper.indexOf('/** 记录资产显式删除', ownerStart);
assert.ok(ownerStart >= 0 && ownerEnd > ownerStart, '必须能提取资产归属判定函数');
const isPlayerOwnedAsset = new Function(helper.slice(ownerStart, ownerEnd) + ';return isPlayerOwnedAsset;')();
assert.equal(isPlayerOwnedAsset({所属对象:['<user>','白银之手']}), true);
assert.equal(isPlayerOwnedAsset({所属对象:['玩家']}), false);
assert.equal(isPlayerOwnedAsset({所属对象:['{{user}}']}), false);
assert.equal(isPlayerOwnedAsset({所属对象:[]}), false);
assert.equal(isPlayerOwnedAsset({}), false, '新语义下缺失归属不能直接触发自动收菜；旧数据由 ZOD 迁移为 [<user>]');"""
          new = """// 直接执行辅助脚本中的资产归属判定：运行时玩家名与旧标记都必须识别为玩家资产。
const ownerStart = helper.indexOf('function isPlayerOwnedAsset(');
const ownerEnd = helper.indexOf('/** 记录资产显式删除', ownerStart);
assert.ok(ownerStart >= 0 && ownerEnd > ownerStart, '必须能提取资产归属判定函数');
const isPlayerOwnedAsset = new Function(helper.slice(ownerStart, ownerEnd) + ';return isPlayerOwnedAsset;')();
const previousOwnerWindow = global.window;
global.window = { parent: { SillyTavern: { name1: '测试玩家' } } };
assert.equal(isPlayerOwnedAsset({所属对象:['测试玩家','白银之手']}), true, '酒馆实际玩家名必须视为玩家资产');
assert.equal(isPlayerOwnedAsset({所属对象:['<user>','白银之手']}), true, '旧字面 <user> 仍需兼容');
assert.equal(isPlayerOwnedAsset({所属对象:['玩家']}), true, '旧“玩家”别名仍需兼容');
assert.equal(isPlayerOwnedAsset({所属对象:['{{user}}']}), true, '旧模板标记仍需兼容');
assert.equal(isPlayerOwnedAsset({所属对象:['其他人']}), false);
assert.equal(isPlayerOwnedAsset({所属对象:[]}), false);
assert.equal(isPlayerOwnedAsset({}), false, '缺失归属不能直接触发自动收菜；旧数据由 ZOD 迁移');
if (previousOwnerWindow === undefined) delete global.window;
else global.window = previousOwnerWindow;"""
          text = replace_once(text, old, new, 'harvest owner behavior test')
          old = """assert.match(helper, /function isPlayerOwnedAsset[\\s\\S]{0,420}Array\\.isArray\\(asset\\?\\.所属对象\\)[\\s\\S]{0,420}=== '<user>'/, '自动收菜必须只认所属对象数组里的 <user>');
const harvestHelper = helper.slice(helper.indexOf('function isPlayerOwnedAsset'), helper.indexOf('/** 资产全自动收菜系统'));
assert.doesNotMatch(harvestHelper, /playerName|SillyTavern|\\{\\{user\\}\\}|玩家/, '自动收菜不得再把玩家名或别名当成收菜权限');"""
          new = """assert.match(helper, /function isPlayerOwnedAsset[\\s\\S]{0,1600}SillyTavern[\\s\\S]{0,1600}<user>/, '自动收菜必须解析酒馆实际玩家名并兼容旧玩家标记');
const harvestHelper = helper.slice(helper.indexOf('function isPlayerOwnedAsset'), helper.indexOf('/** 资产全自动收菜系统'));
assert.match(harvestHelper, /\\{\\{user\\}\\}|玩家/, '自动收菜需兼容旧模板/玩家别名');"""
          text = replace_once(text, old, new, 'harvest static ownership contract')
          old = """assert.match(vars, /Array\\.isArray\\(asset\\?\\.所属对象\\)[\\s\\S]{0,260}=== '<user>'/, '正文玩家资产投影必须支持所属对象数组并只认 <user>');"""
          new = """assert.match(vars, /playerIdentityKeys[\\s\\S]{0,1200}SillyTavern[\\s\\S]{0,1200}isPlayerOwnedAsset/, '正文玩家资产投影必须解析酒馆实际玩家名并复用统一身份集合');"""
          text = replace_once(text, old, new, 'projection ownership contract')
          multi.write_text(text, encoding='utf-8')
          PY

          if node tests/task-settlement-simplified.cjs; then
            echo 'expected settlement regression to fail before implementation'
            exit 1
          else
            echo 'red confirmed: settlement does not recognize actual Tavern player name yet'
          fi
          if node tests/world-engine-asset-multi-owner.cjs; then
            echo 'expected asset-owner regression to fail before implementation'
            exit 1
          else
            echo 'red confirmed: auto-harvest/projection ownership still depend on literal <user>'
          fi

      - name: Green - edit ownership handling directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          # 1) 结算美化：直接读取酒馆当前玩家名，不依赖代码中的 <user> 宏展开。
          settle = Path('Regular/结算任务美化.html')
          text = settle.read_text(encoding='utf-8')
          old = """              // 普通副本结束时只保留玩家拥有/共管的资产；纯NPC、势力或无主资产随副本清理。
              const assets = ensureObject(stat, '资产');
              Object.keys(assets).forEach(function(assetName) {
                const asset = assets[assetName];
                const rawOwners = asset && typeof asset === 'object' ? asset.所属对象 : null;
                // 兼容旧存档：缺失所属对象的历史资产仍按既有迁移语义视为玩家资产，避免误删。
                const owners = Array.isArray(rawOwners)
                  ? rawOwners
                  : (rawOwners == null ? ['<user>'] : [String(rawOwners)]);
                if (owners.indexOf('<user>') >= 0) return;
                delete assets[assetName];
                changed = true;
              });"""
          new = """              // 普通副本结束时只保留玩家拥有/共管的资产；纯NPC、势力或无主资产随副本清理。
              // <user> 在提示词中可能被酒馆展开成真实玩家名；这里直接解析运行时 name1，不能只比较字面 '<user>'。
              const assets = ensureObject(stat, '资产');
              const playerOwnerName = (() => {
                const dataName = String(stat && stat.角色 && stat.角色.名称 || '').trim();
                if (dataName) return dataName;
                try {
                  const ctx = typeof getMvuContext === 'function' ? getMvuContext() : null;
                  const win = ctx && ctx.win ? ctx.win : null;
                  const host = win || ((typeof window !== 'undefined' && window.parent && window.parent !== window)
                    ? window.parent
                    : (typeof window !== 'undefined' ? window : null));
                  return String(
                    host?.SillyTavern?.name1
                    || host?.SillyTavern?.getContext?.()?.name1
                    || host?.name1
                    || ''
                  ).trim();
                } catch (e) { return ''; }
              })();
              const ownerKey = value => String(value || '').trim().toLowerCase();
              const playerOwnerKeys = new Set(
                [playerOwnerName, '<user>', '{{user}}', '玩家'].filter(Boolean).map(ownerKey)
              );
              Object.keys(assets).forEach(function(assetName) {
                const asset = assets[assetName];
                const rawOwners = asset && typeof asset === 'object' ? asset.所属对象 : null;
                // 兼容旧存档：缺失所属对象的历史资产仍按既有迁移语义视为玩家资产，避免误删。
                if (rawOwners == null) return;
                const owners = Array.isArray(rawOwners) ? rawOwners : [rawOwners];
                if (owners.some(owner => playerOwnerKeys.has(ownerKey(owner)))) return;
                delete assets[assetName];
                changed = true;
              });"""
          text = replace_once(text, old, new, 'settlement asset cleanup')
          settle.write_text(text, encoding='utf-8')

          # 2) 辅助脚本：自动收菜使用同一身份语义；之后复制到发行版，避免两份脚本漂移。
          aux = Path('script/辅助计算脚本.js')
          text = aux.read_text(encoding='utf-8')
          old = """    function isPlayerOwnedAsset(asset) {
        const owners = Array.isArray(asset?.所属对象)
            ? asset.所属对象
            : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
        return owners.some(owner => String(owner || '').trim() === '<user>');
    }"""
          new = """    function isPlayerOwnedAsset(asset, statData) {
        const owners = Array.isArray(asset?.所属对象)
            ? asset.所属对象
            : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
        if (!owners.length) return false;

        let playerName = String(statData?.角色?.名称 || '').trim();
        if (!playerName) {
            try {
                let host = null;
                try { if (typeof GS_PARENT !== 'undefined' && GS_PARENT) host = GS_PARENT; } catch (e) {}
                if (!host && typeof window !== 'undefined') {
                    try { if (window.parent && window.parent !== window) host = window.parent; } catch (e) {}
                    if (!host) host = window;
                }
                playerName = String(
                    host?.SillyTavern?.name1
                    || host?.SillyTavern?.getContext?.()?.name1
                    || host?.name1
                    || ''
                ).trim();
            } catch (e) {}
        }

        const ownerKey = value => String(value || '').trim().toLowerCase();
        const playerOwnerKeys = new Set(
            [playerName, '<user>', '{{user}}', '玩家'].filter(Boolean).map(ownerKey)
        );
        return owners.some(owner => playerOwnerKeys.has(ownerKey(owner)));
    }"""
          text = replace_once(text, old, new, 'aux player owner resolver')
          text = replace_once(
              text,
              "if (!asset || typeof asset !== 'object' || !isPlayerOwnedAsset(asset)) return;",
              "if (!asset || typeof asset !== 'object' || !isPlayerOwnedAsset(asset, statData)) return;",
              'aux harvest owner call'
          )
          aux.write_text(text, encoding='utf-8')
          shutil.copyfile(aux, Path('dist/V20260916/辅助计算脚本.js'))

          # 3) 正文变量投影：和场外人物过滤共用一套“当前玩家身份”集合。
          vars_path = Path('World Book/[variables]当前变量.txt')
          text = vars_path.read_text(encoding='utf-8')
          old = """const projectionNameKey = value => String(value || '').toLowerCase().replace(/[\\\\/／·・._\\-\\s]+/g, '');
const isPlayerOwnedAsset = asset => {
  const owners = Array.isArray(asset?.所属对象)
    ? asset.所属对象
    : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
  return owners.some(owner => String(owner || '').trim() === '<user>');
};"""
          new = """const projectionNameKey = value => String(value || '').toLowerCase().replace(/[\\\\/／·・._\\-\\s]+/g, '');
const playerName = (() => {
  const dataName = String(_.get(data, '角色.名称', '') || '').trim();
  if (dataName) return dataName;
  try {
    const host = (typeof window !== 'undefined' && window.parent && window.parent !== window)
      ? window.parent
      : (typeof window !== 'undefined' ? window : null);
    return String(host?.SillyTavern?.name1 || host?.SillyTavern?.getContext?.()?.name1 || host?.name1 || '').trim();
  } catch (_) { return ''; }
})();
const playerIdentityKeys = new Set(
  [playerName, '{{user}}', '<user>', '玩家'].filter(Boolean).map(projectionNameKey)
);
const isPlayerOwnedAsset = asset => {
  const owners = Array.isArray(asset?.所属对象)
    ? asset.所属对象
    : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
  return owners.some(owner => playerIdentityKeys.has(projectionNameKey(owner)));
};"""
          text = replace_once(text, old, new, 'variable projection player identity')
          old = """    const playerName = (() => {
      const dataName = String(_.get(data, '角色.名称', '') || '').trim();
      if (dataName) return dataName;
      try {
        const host = (typeof window !== 'undefined' && window.parent && window.parent !== window) ? window.parent : (typeof window !== 'undefined' ? window : null);
        return String(host?.SillyTavern?.name1 || host?.SillyTavern?.getContext?.()?.name1 || host?.name1 || '').trim();
      } catch (_) { return ''; }
    })();
    const playerKeys = new Set([playerName, '{{user}}', '<user>', '玩家'].filter(Boolean).map(personNameKey));"""
          new = """    const playerKeys = playerIdentityKeys;"""
          text = replace_once(text, old, new, 'reuse player identity for offstage people')
          vars_path.write_text(text, encoding='utf-8')

          # 4) 规则/说明同步：不再宣称程序只能靠字面 <user> 判断玩家。
          rules = Path('World Book/⚙️资产与载具规则.txt')
          text = rules.read_text(encoding='utf-8')
          old = "- 所属对象为字符串数组，记录当前实际持有或控制该资产的个人/势力；可多方共管，数组包含<user>表示玩家拥有/共管，空数组[]表示无主；旧资产缺失时兼容迁移为[<user>]"
          new = "- 所属对象为字符串数组，记录当前实际持有或控制该资产的个人/势力；可多方共管。玩家归属以当前酒馆玩家名为准（提示中的<user>可能在送模前展开为该名称）；程序同时兼容旧存档中的字面<user>/{{user}}/玩家标记。空数组[]表示无主；旧资产缺失时按玩家资产兼容迁移"
          text = replace_once(text, old, new, 'asset ownership rule')
          rules.write_text(text, encoding='utf-8')

          guide = Path('script/世界引擎接入说明.md')
          text = guide.read_text(encoding='utf-8')
          old = "玩家统一写 `<user>`，旧存档缺失时按 `<user>` 兼容"
          new = "玩家归属以当前酒馆玩家名为准；程序同时兼容字面 `<user>` / `{{user}}` / `玩家` 旧标记，旧存档缺失归属时仍按玩家资产兼容"
          if old in text:
              text = text.replace(old, new, 1)
          guide.write_text(text, encoding='utf-8')
          PY

      - name: Green - verify ownership behavior
        shell: bash
        run: |
          node --check script/辅助计算脚本.js
          node --check dist/V20260916/辅助计算脚本.js
          node tests/task-settlement-simplified.cjs
          node tests/world-engine-asset-multi-owner.cjs
          node tests/asset-harvest-lifecycle.cjs
          cmp -s script/辅助计算脚本.js dist/V20260916/辅助计算脚本.js
          ! grep -R "owners.indexOf('<user>')" "Regular/结算任务美化.html"

      - name: Commit direct source edits
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-player-asset-owner-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/one-shot-player-asset-owner-fix.yml \
            "Regular/结算任务美化.html" \
            script/辅助计算脚本.js \
            "dist/V20260916/辅助计算脚本.js" \
            "World Book/[variables]当前变量.txt" \
            "World Book/⚙️资产与载具规则.txt" \
            script/世界引擎接入说明.md \
            tests/task-settlement-simplified.cjs \
            tests/world-engine-asset-multi-owner.cjs
          git commit -m "fix: resolve player asset ownership by Tavern user name [task-awareness-built]"
          git push
