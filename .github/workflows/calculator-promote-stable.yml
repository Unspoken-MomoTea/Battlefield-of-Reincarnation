name: calculator-promote-stable

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: '辅助计算正式版本号，必须与 CALCULATOR_VERSION 一致，例如 1.0.0'
        required: true
        type: string
      target_sha:
        description: '要发布辅助计算的 main 提交 SHA；留空则使用触发工作流时的提交'
        required: false
        type: string

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish calculator]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve release target
        id: target
        shell: bash
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --tags origin main
          TARGET_SHA="$TARGET_SHA_INPUT"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="$GITHUB_SHA"
          fi
          TARGET_SHA="$(git rev-parse "$TARGET_SHA^{commit}")"

          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Refusing release: $TARGET_SHA is not on main."
            exit 1
          fi

          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout release target
        shell: bash
        run: git checkout --detach "${{ steps.target.outputs.sha }}"

      - name: Validate calculator release version
        id: release
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: node cloudflare/scripts/validate-release-version.mjs calculator "$RELEASE_VERSION_INPUT"

      - name: Reject an existing immutable tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Refusing release: tag $TAG already exists and is immutable."
            exit 1
          fi

      - name: Generated delivery synchronized
        run: python tools/build-calculator.py --check

      - name: Calculator source contracts
        run: node --test src/Calculator/tests/*.test.mjs

      - name: Generated calculator syntax
        run: node --check script/辅助计算脚本.js

      - name: Calculator regression suite
        run: node tests/trial-promotion-flow.cjs

      - name: Workshop calculator updater contracts
        run: node --test src/CreativeWorkshop/tests/calculator-update.test.mjs

      - name: Create immutable calculator tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" "${{ steps.target.outputs.sha }}" \
            -m "Reincarnation Calculator v${{ steps.release.outputs.version }}"

      - name: Publish calculator tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          git push origin "refs/tags/$TAG:refs/tags/$TAG"

          echo "### Reincarnation Calculator release promoted" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Calculator version: `v${{ steps.release.outputs.version }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: `$TAG`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: `${{ steps.target.outputs.sha }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workshop, world engine and status bar releases are unchanged." >> "$GITHUB_STEP_SUMMARY"
