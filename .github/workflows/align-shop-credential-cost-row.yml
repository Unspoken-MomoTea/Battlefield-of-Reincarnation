name: align-shop-credential-cost-row
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: ${{ contains(github.event.head_commit.message, '[align-shop-credential-row]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align credential cost with coin cost
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script/悬浮球状态栏.js')
          s = p.read_bytes().decode('utf-8')
          old = '<div style="display:flex;flex-direction:column;gap:2px;min-width:0">'
          new = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0">'
          if s.count(old) != 1:
              raise SystemExit(f'expected one cost-row anchor, got {s.count(old)}')
          p.write_bytes(s.replace(old, new, 1).encode('utf-8'))
          PY
      - name: Validate
        run: |
          node --check script/悬浮球状态栏.js
          node tests/shop-permission-guard.cjs
          node tests/credential-ledger-integration.cjs
          node tests/shop-credential-spend.cjs
          git -c core.whitespace=cr-at-eol diff --check -- script/悬浮球状态栏.js
      - name: Commit and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/align-shop-credential-cost-row.yml
          git add script/悬浮球状态栏.js
          git commit -m "style: align shop credential cost with coin cost"
          git push
