name: World Engine P1-C Final Review

on:
  push:
    branches: [refactor/world-engine-p1-observability]
    paths:
      - '.github/workflows/world-engine-p1-observability-review.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/world-engine-p1-observability
          fetch-depth: 1
      - name: Apply review fixes and reconcile plans
        run: python tools/review-world-engine-p1-observability.py
      - name: Syntax and permanent acceptance
        run: |
          node --check 'script/世界推进系统.js'
          node tests/world-engine-observability.cjs
          node tests/world-engine-ui-theme.cjs
          node tests/world-engine-person-scene-ui.cjs
          node tests/world-engine-temporary-people.cjs
          node tests/world-engine-scene-context.cjs
          node tests/world-engine-prompt-pipeline.cjs
      - name: Plan and display consistency
        shell: bash
        run: |
          grep -q 'P1-C：Prompt 可观测性（已完成）' 'docs/世界引擎V2审计.md'
          grep -q 'P1-C Prompt 可观测性（已完成） → P2 单文件拆分' 'docs/世界引擎V2审计.md'
          grep -q '带 `≈` 的 `tk` 是本地估算' 'script/世界引擎接入说明.md'
          ! grep -q '请求字符数:' 'script/世界推进系统.js'
          ! grep -q '字符数:' 'script/世界推进系统.js'
          ! grep -q "part.body.length+' 字" 'script/世界推进系统.js'
          ! grep -q '公开摘要、货币字段' 'script/世界引擎接入说明.md'
          grep -q 'system.length+input.length>240000' 'script/世界推进系统.js'
      - name: Existing regression parity with main
        shell: bash
        run: |
          cp 'script/世界推进系统.js' /tmp/branch-world-engine.js
          git fetch origin main --depth=1
          for test_file in tests/world-engine-lifecycle-audit.cjs tests/world-engine-prose.cjs tests/world-engine.cjs; do
            cp /tmp/branch-world-engine.js 'script/世界推进系统.js'
            set +e
            node "$test_file" >/tmp/branch-test.log 2>&1
            branch_status=$?
            set -e
            git checkout FETCH_HEAD -- 'script/世界推进系统.js'
            set +e
            node "$test_file" >/tmp/main-test.log 2>&1
            main_status=$?
            set -e
            echo "$test_file: branch=$branch_status main=$main_status"
            if [ "$branch_status" -ne "$main_status" ]; then
              echo 'Regression parity failed'; cat /tmp/branch-test.log; cat /tmp/main-test.log; exit 1
            fi
          done
          cp /tmp/branch-world-engine.js 'script/世界推进系统.js'
      - name: Verify scope
        shell: bash
        run: |
          test -z "$(git status --porcelain | awk '{print $2}' | grep -E '(^|/)regex-|\.json$' || true)"
      - name: Commit reviewed P1-C changes
        shell: bash
        run: |
          if git diff --quiet -- 'script/世界推进系统.js' 'docs/世界引擎V2审计.md' 'script/世界引擎接入说明.md'; then
            echo 'No review changes to commit'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'script/世界推进系统.js' 'docs/世界引擎V2审计.md' 'script/世界引擎接入说明.md'
          git commit -m 'docs: finalize P1-C token observability'
          git push origin HEAD:refactor/world-engine-p1-observability
