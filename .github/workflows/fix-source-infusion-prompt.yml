name: Fix source infusion prompt

on:
  push:
    paths:
      - '.github/workflows/fix-source-infusion-prompt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch concise source infusion rule
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('World Book/⚙️品质效果数值规则.txt')
          text = path.read_text(encoding='utf-8')
          old = '- 路径一(源力灌注): 通过[主神兑换终端]消耗【空间币】100%跨阶升维'
          new = '- 路径一(源力灌注): 满足普升条件后，必须同时消耗【下一阶对应品质权限凭证×1】与对应【空间币】，直接升至下一层级'
          assert text.count(old) == 1, f'expected one target line, got {text.count(old)}'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit prompt fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-source-infusion-prompt.yml
          git add 'World Book/⚙️品质效果数值规则.txt'
          git commit -m 'docs: clarify source infusion credential cost'
          git push
