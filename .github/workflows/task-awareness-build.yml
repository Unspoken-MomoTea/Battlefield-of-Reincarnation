name: task-awareness-build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply shop card UI patch
        run: python tools/patch-shop-card-ui.py
      - name: Syntax check
        run: node --check script/悬浮球状态栏.js
      - name: Shop permission regression
        run: node tests/shop-permission-guard.cjs
      - name: Credential ledger regression
        run: node tests/credential-ledger-integration.cjs
      - name: Shop credential spend regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/shop-credential-spend.cjs')
          t = p.read_text(encoding='utf-8')
          t = t.replace("rules.includes('凭证消耗仅从C级开始')", "rules.includes('购买权限锁: C级起')")
          t = t.replace("rules.includes('血统融合产生的品质变化不消耗权限凭证')", "rules.includes('血统融合结果不消耗凭证')")
          t = t.replace("rules.includes('购买行为本身仍按上述规则消耗凭证')", "rules.includes('购买或升级高于自身当前层级')")
          p.write_text(t, encoding='utf-8')
          PY
          node tests/shop-credential-spend.cjs
          git checkout -- tests/shop-credential-spend.cjs
      - name: CRLF-safe diff whitespace check
        run: git diff --check --ignore-space-at-eol
      - name: Commit UI refactor and cleanup temporary files
        run: |
          git checkout 7e2a7c7a8f94c7d9f827703802a929e38112505e -- .github/workflows/task-awareness-build.yml
          git rm -f .github/workflows/shop-card-ui-once.yml tools/patch-shop-card-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/悬浮球状态栏.js .github/workflows/task-awareness-build.yml
          git commit -m "feat: restructure shop item cards [shop-card-ui]"
          git push
