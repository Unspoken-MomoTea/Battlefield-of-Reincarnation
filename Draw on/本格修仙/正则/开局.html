乾元圣朝执法武力，镇邪魔、剿净世军、护律法；总司设于胜天城。',tags:['执法','乾元下辖']}]},{id:'eco-zy-wusuo',name:'雾锁泽林',description:'西北·湖泽+温带森林。悬河上游散为千流百泽，古木立于水泽之间；终年灵雾不散，小型渔隐林泽部族散居。',tags:['湖泽','雾林','部族'],kingdoms:[],sects:[]},{id:'eco-zy-linghua',name:'灵花平畴',description:'北·花海平原。四时不谢的灵花海与商邑相杂；通济城为中原对北境互市之门户，悬河商道往来不绝。',tags:['花海','商贸','通北境'],kingdoms:[{name:'通济城',brief:'富甲天下的商贸大城，中原对北境（南风国）互市门户；灵花产业繁盛。',tags:['商贸大城']}],sects:[]},{id:'eco-zy-zhuohua',name:'灼华山',description:'最南·山峦屏障。雄峻山脉横亘中原最南、屏障南疆；地脉直通地火，多温泉熔岩；萝武门依此而立。',tags:['山脉屏障','玄盟','地火温泉'],kingdoms:[],sects:[{name:'萝武门',brief:'全女童颜锻体宗门，以灼华池药浴定形；玄盟成员，体修翘楚。',tags:['玄盟','体修','全女']}]},{id:'eco-zy-qiyao',name:'七曜连峰',description:'西·群山·最凶险边陲。七座云雾灵峰以北斗七曜命名；星蚀宗据璇玑台被天魔渗透，净世军占铸鼎城为患，定边城前哨抗西域。',tags:['群山边陲','天魔之爪','凶险'],kingdoms:[{name:'铸鼎城',brief:'七曜山麓之炼器修仙城，今被凡人叛军净世军占据，炼器铸甲为乱。',tags:['净世军占据','炼器']},{name:'定边城',brief:'中原西陲边塞军镇，近天门关、可驰援；抗西域羲皇古朝、防净世军。',tags:['边塞军镇','乾元下辖']},{name:'净世军',brief:'被天魔操纵之凡人叛军，据七曜铸鼎城，受星蚀宗号令，与一切生灵为敌。',tags:['叛军','天魔之爪']}],sects:[{name:'星蚀宗',brief:'原玄盟璇玑阁，因穷究星空被星彼端之物反向凝视而堕落；今为天魔之爪首要敌。',tags:['天魔之爪','堕落']}]},{id:'eco-zy-wmgl',name:'万木悟道古林',description:'最东·温带森林。问道山为林海中央拔起的圣峰，问道仙宗坐镇；天江下游穿林，东缘巨蕈林通东土。',tags:['古林','玄盟盟主','通东土'],kingdoms:[],sects:[{name:'问道仙宗',brief:'玄盟盟主，兼容诸道、万法可修；依古盟世代护持乾元圣朝；主镇天魔。',tags:['玄盟盟主','正道','万法']}]}]},{id:'reg-dongtu',name:'东土',description:'海上孤悬之自由海疆。西陲巨蕈菌海封死通往中原之陆路，唯余海路；东溟万岛千礁星罗，临渊城为跨域门户。境内宗门尽皆中立，世称“日出之地”。',children:[{id:'eco-dt-jujun',name:'巨蕈菌海',description:'西陲·孢雾屏障。擎天巨蕈连绵成海，孢雾终年弥漫、夜放幽光；封死东土通往中原之陆路，琉璃丹宗于此设采药营。',tags:['孢雾屏障','巨蕈','险地'],kingdoms:[],sects:[]},{id:'eco-dt-linyuan',name:'临渊水乡',description:'中部·河口水乡。悬河、天江于此交汇入海，泽国千回；临渊城建于水上，为各域跨海登陆之门户，青龙信仰中心。',tags:['河口水乡','自由港','跨域门户'],kingdoms:[{name:'临渊城',brief:'建于水上的超大型修仙城市·自由港，跨域门户，青龙信仰中心。',tags:['自由港','跨域门户']}],sects:[{name:'天衍楼',brief:'中立·情报枢纽，以阵法、符箓、卜算闻名，办“天衍大比”；居临渊城。',tags:['中立','术修','情报']},{name:'合欢宗',brief:'中立宗门，信阴阳交合、七情六欲乃通大道之根本；居临渊城（醉月楼）。',tags:['中立','双修']}]},{id:'eco-dt-liufang',name:'流芳岛',description:'东部·灵药仙岛。灵雾缭绕、四时如春，奇花异草仙植遍生；琉璃丹宗坐镇，凡间誉为“药王岛”。',tags:['灵药仙岛','丹道','中立'],kingdoms:[],sects:[{name:'琉璃丹宗',brief:'中立炼丹大宗，神陆最大丹药供应商；以药济世、以丹证道。',tags:['中立','丹道']}]},{id:'eco-dt-penglai',name:'蓬莱三仙岛',description:'东部远岛·隐世圣地。蓬莱、方丈、瀛洲三岛以虹桥相连，随灵潮时隐时现、凡舟难近；东土修真之巅。',tags:['隐世仙岛','剑修','上古仙宗'],kingdoms:[],sects:[{name:'蓬莱仙宗',brief:'隐世上古仙宗，清修问道、御剑参玄；东土修真之天花板。',tags:['中立','剑修','隐世']}]},{id:'eco-dt-shuanghua',name:'霜花岛',description:'东部·月华冰霜。海面薄冰铺展、霜花成簇如玉，月华灵蕴最盛；全女宗广寒宫隐于此。',tags:['冰霜月华','全女宗','中立'],kingdoms:[],sects:[{name:'广寒宫',brief:'中立全女宗，主修冰霜、太阴、月华，养女子元阴之力；与合欢宗为死敌。',tags:['中立','全女','冰霜']}]},{id:'eco-dt-biluo',name:'碧落珊瑚海',description:'东南·蔚蓝珊瑚海。珊瑚礁星罗、海岛百数，水下有鱼人珊瑚聚落；珠崖城与鱼人通商而富。',tags:['珊瑚海','鱼人通商','海珍'],kingdoms:[{name:'珠崖城',brief:'碧落珊瑚海缘之海珍贸易港城，与鱼人通商而富。',tags:['海珍港城']}],sects:[]},{id:'eco-dt-liexing',name:'列星海',description:'东溟中央·散修海疆。千岛万礁星罗，海商、海寇行舟其间；聚仙城散修坊市与扶桑城东瀛海邦并立。',tags:['散修海疆','万岛千礁','法外坊市'],kingdoms:[{name:'聚仙城',brief:'列星海中散修坊市大城，鱼龙混杂、法外自由，黑市情报之渊薮。',tags:['散修坊市','法外']},{name:'扶桑城',brief:'东瀛风海岛城邦，信“诸天百神”，神社鸟居遍布、剑士民风。',tags:['东瀛海邦','神道']}],sects:[]}]},{id:'reg-beijing',name:'北境',description:'草原、苔原、冰川峡湾与极北沙漠并存；愈北愈寒，凡国凡修各踞一隅。',children:[{id:'eco-bj-xuesong',name:'雪松峡湾',description:'东北沿海·冰川峡湾。鲸语者公孙氏世代立国，崇北方玄武；龙首楼船游弋峡湾。',tags:['冰川峡湾','海族','玄武信仰'],kingdoms:[{name:'沧澜王朝',brief:'海上世袭王朝，公孙氏以鲸语者血脉立国；都鲸髓城。',tags:['王朝','鲛人血脉']}],sects:[]},{id:'eco-bj-yongshuang',name:'永霜松涛',description:'北部内陆·黑松针叶林。猎户结熊罴会盟自治，黑松王座与雾魇巢穴深藏林心。',tags:['针叶林','萨满','猎户'],kingdoms:[{name:'熊罴会盟',brief:'松林行猎人之松散联盟，无统一王朝，白袍长老议政。',tags:['长老会盟']}],sects:[{name:'冻骨观',brief:'永霜松涛深处依孤坟岭尸气而立之鬼修小宗。',tags:['中立','鬼修']}]},{id:'eco-bj-yinsha',name:'银沙落星漠',description:'西部沙漠。银白沙海与陨铁巨石错落；五大绿洲城邦共结商邦，掌北境西部商道。',tags:['沙漠','商道','绿洲'],kingdoms:[{name:'沙裔商邦',brief:'五大绿洲城邦联盟，星议会共治，议会驻星陨堡。',tags:['城邦联盟']}],sects:[]},{id:'eco-bj-buzhou',name:'不周残脊',description:'中央·南北纵贯山脉。玄铁山骨刺破云层；东麓千机门，西麓血莲密教，主脊上为雪鬃高地部。',tags:['山脉','玄铁','魔道'],kingdoms:[{name:'雪鬃高地部',brief:'高山神权王国，血莲密教附属；都天梯堡，雪冠世袭。',tags:['神权附属国']}],sects:[{name:'千机门',brief:'正道机关炼器宗门，居东麓千机峰，神陆最大法宝制造商。',tags:['正道','炼器']},{name:'血莲密教',brief:'以人 :'砺心问道 / 逆天改命',类型:'散修',constraints:{灵根禁止:['无']},settings:{时间:{年:7188,月:7,日:22,时辰:'寅时'},宗门:'散修（前 · 雾隐山门）',初始境界:{大境界:'炼气',小境界:'后期'}},body:'山门毁于一夜之间。\n你伏在血泥里装死，听着师姐的最后一声怒吼，听着那道沉重的拐杖从身边经过。\n直到一切归于死寂。\n你紧紧攥着那枚被血浸透的玉牌，在黎明前从断壁残垣中爬出来——',tags:['仇怨']},{id:'story-dadao',name:'已悟大道',subtitle:'前世今生',desc:'你似乎记得前世种种。一切尚未开始，便仿佛已是结局。',cost:0,glyph:'道',recommend:'小道悠游',类型:'特殊',settings:{时间:{年:7301,月:3,日:3,时辰:'卯时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'你在朝霞中睁开眼。\n窗外是再熟悉不过的灵溪，远处晨钟敲响——\n这一切，你似乎在某个梦里见过千百次。\n你抬手轻抚胸口的玉牌，那里仿佛还残留着上一世火焚之后的余温——',tags:['传说']},{id:'story-tianxuan-zayou',name:'万剑坪 · 剑师赠石',subtitle:'风雪中的萍水之缘',desc:'天玄剑宗杂役弟子，于万剑坪扫雪时偶遇剑脉传人墨诗行奉命下山历练；临行前她留下一枚下品灵石。',cost:0,glyph:'剑',recommend:'砺心问道',类型:'宗门',constraints:{locationIds:['eco-xy-wuyan'],灵根禁止:['无']},settings:{时间:{年:7204,月:12,日:18,时辰:'辰时'},宗门:'天玄剑宗（外门杂役）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'天玄剑宗宗门广场，万剑坪上积了一层新霜，几名杂役弟子正低头清扫，你就在其中。\n宗主莫决云立在大殿前的石阶上，负手而立，灰白长衫随风飘荡；剑脉传人墨诗行一袭玄青剑袍，独立于万剑坪中央，长剑斜引残雪，凝立不动，仿佛已在这风雪里站了整整一夜。\n"一夜未收势，那一剪，可有「诗」了？"莫决云的声音不大，却清晰传遍整个万剑坪，隐隐压过呼啸的风声。\n墨诗行缓缓收剑入鞘，墨眸清冷，望着漫天风雪，声音很淡。\n"回师尊，还差一分。这一剪弟子练了三年，招已至极，剑里却始终少一口气——不是不够利，是没有诗。"\n莫决云眉头微不可察地一动，袖袍轻拂，将她身旁三尺积雪荡开，她却连眼也未眨。\n"闭死在山上，剑意反被磨钝了。今日起，你下山历练去——去人间寻你那一口「诗」，寻不到，便不必回宗。"\n墨诗行怔了一瞬，随即端正行了一礼，声音依旧清冷，却比方才多了一分郑重，"弟子……领命。"\n她转身向山门走去，长发束得极高，背上长剑映着雪光，玄青剑袍掠过一地素白。行至你身边，脚步无端顿了一顿。\n她垂眸看了看你冻得发红的手，又看了看你脚下那一小片被扫得干干净净的雪地，墨眸里掠过一丝极淡的东西。\n"一处一处，扫得不厌，这也是剑意。"墨诗行说着，从袖中取出一枚下品灵石，轻轻搁进你掌心，"心沉得下来，扫帚也能通道。这枚，权当谢你让我看了这一片干净的雪地。"\n语尽，她不再多言，足尖轻点，掐诀御剑而起，一道青光没入风雪，转瞬不见。'},{id:'story-lingfeng-yueye',name:'回音谷 · 月下合奏',subtitle:'初入聆风斋的雅会',desc:'入聆风斋不久，月夜独抚琴于回音谷，恰遇手持玉笛的夏未央，二人合奏一曲。',cost:0,glyph:'琴',recommend:'小道悠游 / 寻常修行',类型:'宗门',constraints:{locationIds:['eco-bj-nanfeng'],灵根禁止:['无']},settings:{时间:{年:7212,月:8,日:16,时辰:'亥时'},宗门:'聆风斋',初始境界:{大境界:'炼气',小境界:'初期'}},body:'夜色稍沉，一弯新月挂在回音谷的夜空；水汽氤氲，濡湿了岸边的青苔。\n你坐于河边石上，膝上横着古琴，指尖勾挑，并无定谱，只随风势起落。泠泠七弦，偶尔惊起栖息在芦苇荡中的几只水鸟，水鸟振翅掠过水面，摇散月光点点。\n忽有笛声自林梢落下，那笛音清越，不争不抢，只轻轻填补琴音将歇的空隙，留住了那将要散去的余韵。\n你按住琴弦，抬眼望去，林间小径转角处，一袭淡藕色纱裙随风微动。来人手持一支玉笛，笛身通体洁白，惟有末端坠着明黄流苏。\n"扰了道友雅兴，方才听这琴音，似有江流宛转绕芳甸之意，却又多了几分随性。道友是新入斋的？"\n你起身，向女子拱手一礼，"在下你，初入聆风斋，见此地月色正好，情难自禁，不想惊动了师姐。"\n那女子行至水边，并未站在高处受礼，而是在一旁的青石上坐下，将玉笛横在膝头。\n"万物有声，这水浪拍岸是声，虫鸣鸟叫是声，道友的琴音自然也是声，既然都在这天地间，那便算不得惊扰。"\n"我方才在林中，听道友琴中似有未尽之意，恰好我有支曲子也缺了些许意境，不知道友可愿合奏一曲？"\n你重新落座，双手抚上琴弦，无需言语确认调式，指尖落下，便是回应。\n琴音起时如山涧滴泉，清冽透亮；笛声随之而入，绵长悠远，似风过松林。\n曲终，余音散入风中，水面复归平静。\n"今夜的风，倒是比往日柔和了些。"夏未央轻抚笛身，站起身来，理了理被风吹乱的鬓发。\n"若是道友喜欢此地，往后也可常来。聆风斋夏未央，记下了道友今夜的琴。"'},{id:'story-liuli-baicao',name:'百草峰 · 药园新邻',subtitle:'与赵芳萤同顷锄药',desc:'琉璃丹宗外门弟子，于百草峰偏角药园锄药；隔壁新搬来一位怯生生的小师妹赵芳萤。',cost:0,glyph:'丹',recommend:'寻常修行',类型:'宗门',constraints:{locationIds:['eco-dt-liufang'],灵根禁止:['无']},settings:{时间:{年:7197,月:4,日:9,时辰:'辰时'},宗门:'琉璃丹宗（外门杂役）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'流芳山脉绵延几百里，晨辉破云，金光洒落百草峰，峰顶云蒸霞蔚，隐约可见有内门弟子御物在天，或坐于葫芦、或立于飞剑，但那都是与杂役无缘的风景。\n琉璃丹宗，百草峰，集中种植低阶灵草灵药的区域，其中一片小药园。\n你提起锄头歇息片刻，直起腰，炼气初期的灵气在经脉里转了小半周天，消解了些许疲乏。这块药田便是其在琉璃丹宗的一亩三分地，种的皆是炼气期丹药的基础辅材。\n隔壁那荒废了大半个月的小药园，今日有了动静。\n竹篱那边，一名看上去豆蔻年华的少女，身上的杂役布袍宽大了些许，袖口挽了几道，露出细瘦的手腕。她半蹲在土地上，对着刚栽下去有些蔫头耷脑的草药比划。\n"绿高高，这里的土很软和，你要争气，把根扎深点。"\n声音顺着晨风飘过竹篱，落入你耳中。那少女并未察觉旁人目光，只是从沟渠舀起少许泉水，淋给草药。\n"喝了水就不许枯了，等你长出新叶子，我就喊你绿壮壮。"\n你手中锄头轻顿，碰上一块硬土，发出了响声，少女转头，眸子里映出你提着锄头的身影。\n她连忙站起身来，双手在身前交叠，朝着你深深行了一礼，因为动作太急，头顶那条用来束发的粗布条歪了一些，几缕碎发散在额前。\n"前、前辈好。"她头垂得很低，露出白净纤细的后颈，声音有些发怯，"我是新来这块药田的赵芳萤，若是吵到前辈修行，还请前辈恕罪。"'},{id:'story-liuli-shennong',name:'试药谷 · 尝百草',subtitle:'神农遗脉，以百草为食',desc:'流芳岛试药谷中长大的凡人，以采食山间药草为生；毒堂长老林蘅芷偶遇后心生莫名亲近，竟发现此人毒免疫——原是神农氏之后，识海深处还沉着一册无字玉简。',cost:0,glyph:'药',recommend:'寻常修行 / 砺心问道',类型:'特殊',剧情:!0,flags:['神农遗脉·无字玉简'],constraints:{locationIds:['eco-dt-liufang'],门派归属:['','散修','琉璃丹宗'],灵根禁止:['无']},settings:{时间:{年:7218,月:3,日:16,时辰:'酉时'},宗门:'琉璃丹宗（林蘅芷引荐入谷）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'流芳岛深处有一道少人踏足的幽谷，唤作试药谷。谷中草木疯长，奇花异草自生自灭，几百年来也没人打理。你便是在谷里长大的凡人——没有名姓，没有来处，像山涧边一块没人捡的石头。每日吃什么，全看你认不认得那些草：哪株能果腹、哪株能解饿出来的病、哪株咬一口要躺上三天……你心里自有一本账，账是拿命记的，从没错过。\n这日黄昏，你正蹲在谷坡上，把一株开紫花的藤连根拔起，掐了片茎叶放进嘴里尝。身后忽然传来一声极轻的叹息，像风穿过药圃。\n"你不怕我。"\n你回头。一个紫黑长发的女人立在十步外的山石边，毒紫的眼眸正一眨不眨地望着你。她生得极美，可那美像开在毒潭边的花，美得让人不敢靠近。流芳岛上没人不知道毒堂长老林蘅芷，更没人敢离她太近。\n她自己也想不明白为何停下来。这满谷的草木在她眼中皆是寻常，偏你这个凡人，竟让她心底莫名地生出一丝亲近，像看见一株淋了许久的雨、终于遇上晴天的草。她指尖凝出一缕幽紫的毒气，轻轻弹在你手背上——那毒能化金蚀铁，你却只觉得手背微微一麻，眨眼便散了，连个红印都没留下。\n林蘅芷的指尖，在另一个人面前第一次微微发抖。\n"你是神农氏之后。"她轻声说，像在说给自己听，"天生便认得天下草木之性。毒，自然也伤不了你。"\n她以神识探入你的识海，本欲寻个究竟，却在那片无波的识海深处，看见一册静静沉浮的玉简。简上无字，她的神识方一触及，玉简便泛起温润的光，像是在说——认得。都认得。\n"识海？"你茫然地看着她，"那是什么？我从小到大只认得谷里的草，从没学过什么修行，更不知道自己的识海里……有什么。"\n林蘅芷收回神识，望着你沉默了很久。\n"这玉简是上古大能的遗留之物，应是与你的血脉一同降生，早已沉在你识海深处。你天生能辨百草之性，靠的正是它。"她顿了顿，"只是你从未修行，它便只作无字。待你踏上修行之路，它自会显出字来——那时，天下单方于你，都不再是秘密。"\n她从不与人接触，递东西都用长柄药夹，可这一回，她朝你伸出了赤裸的手，掌心的毒香不知何时已收束得干干净净。\n"跟我回琉璃丹宗吧。"她说，"这谷里的草喂得饱你的肚子，喂不饱你的命。我活了几百年，头一回碰上碰不坏的人——你愿意的话，让我也有个能放心把手伸出去的地方。"',tags:['琉璃丹宗','神农遗脉','无字玉简']},{id:'story-nanjiang-fox',name:'十万大山 · 邂逅狐妖',subtitle:'采药途中偶入仙芝幽谷',desc:'为寻"灵山仙芝"在十万大山边缘盘桓数日，误入幽谷，遇见正对木桩独自练习答词的青丘狐族少女苏凝香。',cost:0,glyph:'狐',recommend:'寻常修行 / 砺心问道',类型:'散修',constraints:{regionIds:['reg-nanjiang'],灵根禁止:['无']},settings:{时间:{年:7220,月:6,日:1,时辰:'辰时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'中期'}},body:'晨曦微露，南疆特有的湿热水汽尚未完全散去，在林间凝成轻纱般的薄雾。\n你身负竹篓，脚穿皮靴，踏入幽深的小径，这里人迹罕至，寻常采药人不敢涉足，但你为了寻找那传闻中的"灵山仙芝"，已在十万大山边缘盘桓了数日。\n你拨开眼前遮蔽视线的阔叶，视野豁然开朗，前方是一处静谧的幽谷，谷中溪水潺潺，两岸开满了不知名的野花，随风摇曳，落英缤纷。花丛中央，坐着一位身着浅粉襦裙的少女，她背对着你，正对着一根木桩念念有词。\n"公子大恩，小女子无以为报，惟有……"少女声音稍顿，歪了歪头，似在回忆什么，随后换了一种语调，略带娇羞，"惟有以身相许，愿随君走遍天涯海角。"\n你不慎踩断了一截枯枝，咔嚓轻响，在这静谧幽谷中显得尤为突兀。\n少女身形微颤，蓦然回首，面容娇憨，双颊晕红，溪水般清澈的眼眸中带着些许惊慌。\n"你是谁？你是......来这里赏风景的吗？"\n你拱手一礼，"在下你，乃山中采药之人，误闯姑娘……清修之地，多有得罪，还望见谅。"\n少女闻言，眼中警惕稍退，取而代之的是好奇，似在确认对方的善意。\n"采药人……"她低声重复，随即起身，笨拙地回了一礼，"小女子苏凝香，这厢有礼了。"'},{id:'story-wudu-init',name:'走出瘴林 · 万毒祖窟',subtitle:'入门测验中的一场豪赌',desc:'于雨瘴林中参加五毒教入门测验，饥寒交迫、四下皆毒；走投无路吞下一枚《百毒经》未载的五彩怪果，醒来识海凭空多了一门神识蛊法，与一句唤你前往"万毒祖窟"的低语。',cost:0,glyph:'蛊',recommend:'砺心问道 / 逆天改命',类型:'特殊',剧情:!0,constraints:{locationIds:['eco-nj-yuzhang'],灵根禁止:['无'],门派归属:['','散修','五毒教']},settings:{时间:{年:7231,月:4,日:9,时辰:'巳时'},宗门:'五毒教（入门试炼）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'雨瘴林深处，湿热的瘴气黏在皮肤上，久久不散。\n这是五毒教入门测验的最后一关——独自走出这片吃人的林子。已是第三日，你炼气初期那点微薄的灵气早被瘴毒磨得所剩无几，饥火与寒意一齐啃着五脏六腑。\n偏偏这林中"食物"并不算少：紫红的浆果、肥厚的菌伞、爬满藤蔓的甜藕……你翻开随身那卷《百毒经》一一比对，翻到最后，指尖发凉——无一例外，全是剧毒。原来这一关考的从不是"能不能找到吃的"，而是"明知有毒，你敢不敢碰"。\n就在你几乎要倒下去的时候，一丛腐叶间露出一枚拳头大的果子，五彩斑斓、流转着近乎妖异的光泽。你翻遍《百毒经》，从头到尾——竟没有半个字提到它。\n未载于经，便是未知；未知，便是不知死活。可你也确实，再没有别的路了。\n你盯着那枚怪果看了很久，终于闭上眼，一口咬了下去——赌这一把。\n意识坠入无边的黑。\n……\n再睁眼时，天光已亮。饥寒尽退，那点被磨尽的灵气竟也悄然复原，四肢百骸说不出的通泰，仿佛什么东西在体内被彻底洗过一遍。\n只是——你的识海里，凭空多了一门功法。它的名字自己浮上心头：《噬心蛊经》。神识为针，种蛊噬心，诡异得与《百毒经》里任何一页都不相干。\n而在识海深处，一段沙哑而遥远的低语，正贴着神魂反复回响，挥之不去——\n"来……万毒祖窟……找我……"\n你摸了摸怀里那块入门时宗门发下的司南之石——它一如往常，只认得南北，却半点指不出那"万毒祖窟"在何方。',tags:['五毒教','奇遇']},{id:'story-luowu-mirror',name:'遗镜归宗 · 溯光寻亲',subtitle:'母亲遗物中沉睡的萝武传承',desc:'云游切磋的白蕊弦偶然发现，你体内竟运转着萝武门心法；母亲留下的溯光鉴封存着功法、技艺与四段记忆，唯有突破大境界才能逐次解锁。为追查母亲之死，她决定带你返回萝武门。',cost:0,glyph:'镜',recommend:'寻常修行 / 砺心问道 / 逆天改命',类型:'特殊',剧情:!0,constraints:{locationIds:['eco-zy-zhuohua'],性别禁止:['女'],灵根禁止:['无'],门派归属:['','散修','萝武门']},settings:{时间:{年:7232,月:8,日:17,时辰:'申时'},宗门:'萝武门（归宗途中）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'白蕊弦离开萝武门后，一路寻访各地体修切磋论技。途经你居住的城镇时，她原本只打算停留一夜，却在人群中察觉到一缕极熟悉的吐纳节律——那股气息正从你的经脉间循环，分明是萝武门锻骨一脉的内功路数。\n她当即拦下你，细问这门心法从何而来，又反复追问你的母亲姓甚名谁、是否曾为萝武门弟子。你却答不上来：母亲去世时，你尚不知道她的过往，只记得她临终前将一面旧镜交给你；父亲也只肯说，她是被仇人所杀。\n你取出母亲留下的镜子。镜面不映寻常人影，灵力触及时反而浮出一层层封存的经脉图与技艺手札。白蕊弦检查许久，确认其中藏着完整的萝武门传承，却被四重禁制分隔；只有你亲自突破一个大境界，镜中封印才会解开一层，显露一段母亲留下的记忆线索。未到突破之时，纵使她强行灌注灵力也只会照见一片雾光。\n更令她意外的是，这份传承早已依照你的经脉重新调整。即使你并非女性，也能安全修行本应只传门中女弟子的功法，绝非偶然得来的抄本所能做到。\n白蕊弦沉默片刻，将镜子郑重交还你，随即以萝武门战技脉脉主之名立誓：无论你的母亲是谁，又死于何人之手，她都会陪你查明真相，为故人讨回公道。\n城门外，她已备好回返萝武门的行装。你带着《锻骨吐纳诀》与溯光鉴随她上路；下一段镜中记忆，要等你亲手跨过第一个大境界后才会醒来。',tags:['萝武门','奇遇','身世']},{id:'story-luowu-nuwa',name:'陨星换心 · 女娲遗石',subtitle:'本应死去的人，胸中响起石心',desc:'中原忽降陨星，你被正面砸中却没有死去；赶来查看的萝武门修士发现，你原本的心脏已被陨石替代，石中还残留着疑似源自九天玄女的力量。',cost:0,glyph:'陨',recommend:'砺心问道 / 逆天改命',类型:'特殊',剧情:!0,constraints:{locationIds:['eco-zy-zhuohua'],性别:'女',灵根禁止:['无'],门派归属:['','散修','萝武门']},settings:{时间:{年:7233,月:3,日:21,时辰:'戌时'},宗门:'萝武门（陨星救治）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'那一夜，中原天幕忽然裂开一道炽白长痕。陨星拖着焰尾越过群山，最终直坠你所在之地；你甚至来不及躲闪，天地便在震响与强光中一同沉没。\n附近的萝武门修士循着巨响赶来，只见地面陷成仍冒着热气的深坑。照理说，坑心不该留下任何活物，你却完整地躺在碎石之间，胸口没有致命创伤，四肢也仍有温度。\n她们将你带离坑底，检查伤势时才发现更加不可思议之事：你的胸腔里已听不见血肉心脏的跳动，取而代之的是一枚与陨星同质的五色奇石。每一次石心震动，都有温润而古老的力量沿血脉流遍全身，维持着本应断绝的生机。\n门中修士尝试以灵力探查，五色辉光却自行拼合伤处、排开外力，隐约显出补天造化的道韵。她们无法断定石头真正的来历，只能确认其中似乎残留着与九天玄女有关的力量。\n你从昏迷中醒来时，第一声听见的并非寻常心跳，而是胸腔深处沉稳的石鸣。萝武门修士守在一旁，告诉你陨石已经与你的性命融为一体，并准备带你返回宗门详查这颗“女娲石”究竟为何选择了你。',tags:['萝武门','奇遇','女娲石']},{id:'story-guanghan-twin-fish',name:'双鱼佩引 · 月下重逢',subtitle:'她终于等到故人的转世',desc:'月圆之夜，伴生玉佩忽然发热，引来广寒宫主慕璇玑。她认出你是昔日故人的转世，并决定不再错过，破例带你前往广寒宫。',cost:0,glyph:'佩',recommend:'小道悠游 / 寻常修行',类型:'特殊',剧情:!0,flags:['慕璇玑·旧缘转世'],constraints:{locationIds:['eco-dt-shuanghua'],性别禁止:['女'],灵根禁止:['无'],门派归属:['','散修','广寒宫']},settings:{时间:{年:7234,月:8,日:15,时辰:'子时'},宗门:'广寒宫（破例入宫）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'月圆之夜，你从睡梦中醒来，披衣到屋外小解。回屋时需要穿过家乡的花海，万顷花枝正伏在夜风里，清亮月光一路铺到你的脚边。\n走到花海深处，你忽然察觉胸前一阵温热。那枚玉佩本该在睡前摘下，今夜却罕见地被你忘在身上。父母曾告诉你，你出生时口中便含着它；除此之外，无人说得清它从何而来。\n玉佩越来越烫，却不灼伤肌肤。两尾相衔的鱼纹浮起柔和月辉，像在回应一个跨越漫长岁月的呼唤。你蓦然回首，只见花海外立着一道绝美的仙子身影，月白宫装曳过花梢，清冷眉眼间却有几乎压不住的惊喜与惶然。\n来人正是广寒宫主慕璇玑。她感应到另一枚双鱼佩苏醒后立即循迹而来，只一眼便认出你神魂中那道令她等待至今的气息。前世，你与她相识相知，却在她来得及表露真情之前陨落；她只能把那枚始终未能送出的同心佩与你一同埋葬。\n如今，那枚本应长眠墓中的玉佩随你转世而生。慕璇玑取出自己珍藏多年的另一半，两枚玉佩隔着月色同时轻鸣，再没有比这更确切的证明。\n她向来克制的神情终于失守，越过花丛紧紧抱住你，像是稍一松手便会再失去一次。待最初的激动平复，她才告诉你前世之事，也坦言这一世绝不会再把心意留到来不及说出口的时候。\n广寒宫从未收过非女性弟子，但慕璇玑决定亲自承担这次破例。天亮之前，她会给你时间告别家乡；待月轮西沉，你将带着双鱼同心佩随她启程，前往霜花岛上的广寒宫。',tags:['广寒宫','转世','慕璇玑','双鱼同心佩']},{id:'story-guanghan-frozen-qilin',name:'湖心冰棺 · 劫前遗民',subtitle:'与麒麟幼崽一同苏醒',desc:'月华湖地动开裂，一块古老冰晶浮出湖面；你与怀中的麒麟幼崽被封存其中，衣饰与口音皆似大劫前的古修士，却只记得守护幼崽的使命。',cost:0,glyph:'麟',recommend:'寻常修行 / 砺心问道 / 逆天改命',类型:'特殊',剧情:!0,constraints:{locationIds:['eco-dt-shuanghua'],性别:'女',灵根禁止:['无'],门派归属:['','散修','广寒宫']},settings:{时间:{年:7235,月:11,日:6,时辰:'卯时'},宗门:'广寒宫（湖底获救）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'霜花岛地脉忽然震动，月华湖随之发生地龙翻身。湖岸冰层寸寸开裂，湖底传来沉闷轰响，像有一座被岁月掩埋的旧殿正在水下崩塌。\n广寒宫修士赶到湖边封锁裂隙时，一块丈许高的澄澈冰晶从湖底缓缓浮上水面。冰中并非矿石或古器，而是一名双臂紧抱幼兽的女子——正是沉睡其中的你。\n众人将冰晶牵引上岸，以月华之力逐层化开封印。你怀中那只不明幼兽始终被护在胸前，头生柔软麟角，细小鳞片间流转着五色混沌光；即使冰封解除，你的手臂仍本能地不肯松开。\n苏醒后的你没有明显伤势，衣袍裁制、发饰形制乃至说话口音却都与当世不同，更接近典籍中记载的大劫前古修士。宗门高层接连询问你的姓名、师承与被封入湖底的缘由，你却只从破碎记忆里捞出零星画面，无法给出完整答案。\n她们因此推测，你或许是大劫之前被封存至今的幸存者；月华湖底的地动只是偶然打开了那座沉睡多年的冰棺。真相尚无定论，宫中也不会在你神智未复时强迫逼问。\n你唯一记得清楚的是自己的使命：保护怀中的麒麟幼崽，让这点从旧时代保存下来的希望活到未来。幼崽体内封着四道沉睡的四象印记，青龙、白虎、朱雀、玄武之力皆未取得，四项天赋仍全部锁定。\n在找回记忆与查清冰封来历之前，广寒宫暂时接纳你与麒麟幼崽留在霜花岛。你醒来的这一日，也成为这段跨越大劫的守护使命重新开始的第一天。',tags:['广寒宫','大劫前','麒麟幼崽','失忆']},{id:'story-wanderer-artifact-spirit',name:'精血养灵 · 法宝初醒',subtitle:'长年温养，器中生我',desc:'你原是一位修仙者随身使用的法宝，在主人长年以精血祭炼温养后，终于于器身深处诞生了真正的智识。',cost:0,glyph:'器',recommend:'小道悠游 / 寻常修行',类型:'散修',constraints:{种族:['物化生灵']},settings:{时间:{年:7246,月:1,日:12,时辰:'卯时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'你曾只是一件被修仙者握在掌中、收入丹田、又在斗法时反复祭出的寻常法宝。\n主人性情谨慎，每逢月圆都会割破指尖，以自身精血沿器身纹路细细涂抹，再用灵气温养整夜。年复一年，那些温热血气在你体内沉积，原本死寂的禁制之间渐渐多出一点会观察、会记忆的微光。\n这一日清晨，主人照例将你置于膝前运功。精血滑过最后一道禁纹时，你第一次听懂了窗外的鸟鸣，也第一次意识到握住你的那只手属于另一个生命。\n你试着回应，一缕不属于任何既有禁制的灵光从器身深处亮起。主人猛然睁眼，呼吸停了片刻，低声问道："这些年……一直是你在看着我？"',tags:['散修','物化生灵','法宝成灵']},{id:'story-wanderer-wild-beast',name:'灵山初醒 · 仙子诱宠',subtitle:'山野自在，忽闻灵食香',desc:'灵山中自在生活的妖兽因灵气充裕而开启智识；一位仙子循迹而来，放下灵食试图将你收作灵宠。',cost:0,glyph:'兽',recommend:'小道悠游 / 寻常修行',类型:'散修',constraints:{种族:['妖族']},settings:{时间:{年:7246,月:4,日:23,时辰:'辰时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'群山深处灵泉遍布，草叶终年挂着淡淡灵光。你从幼时起便在林海与溪谷间自在穿行，渴饮灵泉，饿食灵果，从未见过山外的人烟。\n经年累月的灵气冲刷终于在某个清晨越过界限。你仍是原本的妖兽，却忽然听懂了鸟群的示警，也明白水中倒影正是自己——智识便这样毫无征兆地醒了。\n数日后，一名白衣仙子循着你留下的灵力痕迹来到林间。她没有立刻出手，只在空地上放下一碟香气浓郁的灵食，自己退到树后，手中却悄悄扣着一枚灵宠契。\n那股香味顺风飘来。她自以为藏得很好，而刚刚学会思考的你，早已看见了树影后那双满怀期待的眼睛。',tags:['散修','妖族','灵宠契约']},{id:'story-wanderer-cave-relic',name:'洞府遗珍 · 滴血认主',subtitle:'尘封千年，忽逢来客',desc:'失落大能洞府中的遗物在漫长岁月里生出智识；探索者发现你后，试图以滴血认主与你缔结契约。',cost:0,glyph:'遗',recommend:'寻常修行 / 砺心问道',类型:'散修',constraints:{种族:['物化生灵']},settings:{时间:{年:7246,月:7,日:9,时辰:'午时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'这座洞府已经沉寂太久。昔日主人留下的阵纹一层层熄灭，丹炉蒙尘，书架腐朽，只有你仍在最深处的石台上守着无人归来的岁月。\n灵脉余息缓慢渗入本体，让你从懵懂感知中生出清晰智识。你学会分辨落石、流水与禁制崩裂的声音，却从未真正见过活人。\n直到今日，洞府外层传来连续破阵的震响。一名满身尘土的年轻修士闯进密室，先是惊喜地望着你，随后谨慎地划破指尖。\n一滴鲜血悬在他指前，缓缓向你落下。他低声念起认主法诀，想让这件失落千年的遗物从此归于自己——却不知道石台上的你，正清醒地审视着他的每一个动作。',tags:['散修','物化生灵','大能洞府']},{id:'story-wanderer-auction',name:'笼中奇货 · 神秘买家',subtitle:'落槌之后，命途易主',desc:'你遭人捕获并被送上地下拍卖会，最终由一位身份不明的买家高价购得；主角可以是人族或妖族。',cost:0,glyph:'笼',recommend:'砺心问道 / 逆天改命',类型:'散修',constraints:{种族:['人族','妖族']},settings:{时间:{年:7246,月:10,日:3,时辰:'戌时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'醒来时，你的灵力已被禁制压入经脉深处，腕足或本体上扣着专为修士与妖兽准备的锁灵环。\n帷幕后人声嘈杂。拍卖师将你称作今夜最后一件奇货，台下的目光隔着阵法不断扫来，价码也在一次次举牌中被推高。\n最终，角落里一位始终隐在兜帽下的人报出无人再敢跟进的数字。木槌落下，你被侍者连同契书送入一间没有窗的贵宾室。\n门扉合拢，那位神秘买家并未立刻催动契约，只把解除第一层禁制的钥匙放在你面前："别急着把我当主人。先让我听听，你打算如何换回自己的自由。"',tags:['散修','拍卖会','人族或妖族']},{id:'story-wanderer-spirit-plant',name:'日月凝灵 · 守兽相候',subtitle:'灵植开智，故人守望',desc:'与世隔绝的秘境中，一株灵植吸收日月精华开启智识，醒来时发现一直守护自己的高阶妖兽已化作人形相候。',cost:0,glyph:'芽',recommend:'小道悠游 / 寻常修行',类型:'散修',constraints:{种族:['灵族']},settings:{时间:{年:7247,月:3,日:14,时辰:'卯时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'秘境与外界隔绝，春秋在阵法之外流逝，谷中却始终温暖如初。你扎根于灵泉旁，迎晨曦舒叶，随月华吐纳，在无人知晓的岁月里一点点积蓄灵性。\n今夜月轮正圆，积攒多年的日月精华终于汇成一线灵光，贯穿根茎。你第一次不只感到风与水，而是清楚地意识到自己正在呼吸、正在思考。\n视野初开，你便察觉身旁一直伏着一头气息深不可测的妖兽。它似乎早已在这里守了许多年，此刻缓缓起身，在柔光中化作一位眉目温和的人。\n对方蹲下身，指尖轻轻抚过你的新叶，笑意里带着久候成真的释然："你终于进阶了。"',tags:['散修','灵族','灵植开智','守护妖兽']},{id:'story-bloodpool-demon-sword',name:'血池魔剑 · 煞中初醒',subtitle:'祭仪已散，唯剑有灵',desc:'祭仪结束后的血池中，一把曾由祭品佩戴的灵剑吸收精血与煞气，机缘巧合诞生智识。',cost:0,glyph:'魔',recommend:'逆天改命',类型:'特殊',剧情:!0,flags:['血池魔剑·初醒'],constraints:{种族:['物化生灵'],种族细分必须为空:!0,剧本指定种类:'魔剑'},settings:{时间:{年:7247,月:7,日:15,时辰:'子时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'意识最先感到的是冷。随后才是血池里黏稠的煞气、倾倒在石阶旁的尸体，以及早已无人维持却仍残留暗红微光的献祭阵纹。\n这场仪式原本另有用途，与你无关。你记得自己从前只是一名祭品腰间佩着的灵剑，在主人被投入血池时一同坠落，随后便被精血、怨念与煞气彻底淹没。\n漫长浸泡扭曲了剑中禁制，也意外点燃一缕本不该存在的灵性。如今仪式已经结束，主持者与观礼者尽数离去，只留下凝固的血、无人收敛的尸首，以及第一次真正看见世界的你。\n剑身在血池底部轻轻震鸣。那些渗入本体的煞气自行汇成两篇法诀：一篇教持剑者燃血换力，一篇教你在持剑者死去时夺其残灵。空旷地宫里，再没有人能告诉你这份新生究竟是机缘，还是诅咒。',tags:['特殊','物化生灵','魔剑','血池']},{id:'story-hehuan-baiyan',name:'百艳录 · 风流入宗',subtitle:'一夜欢场，醒入合欢',desc:'一位成年风流公子在青楼留宿后被合欢宗女修迷晕带回宗门，随身记事册也显露出记录双修对象、增益修行的宝物本相。',cost:0,glyph:'艳',recommend:'小道悠游 / 寻常修行',类型:'特殊',剧情:!0,flags:['合欢宗·百艳录'],constraints:{locationIds:['eco-dt-linyuan'],门派归属:['','散修','合欢宗'],种族:['人族'],性别:'男',元阳元阴状态:!1,必须人形:!0,灵根禁止:['无']},settings:{时间:{年:7248,月:2,日:18,时辰:'巳时'},宗门:'合欢宗（新入门）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'你是城中出了名的成年风流公子，平生志向便是踏遍天下花丛。昨夜你照例留宿青楼，与一名格外大胆的女子缠绵许久；她几度告饶，你却仍兴致高涨，直到一缕甜香贴近鼻端，意识骤然沉入黑暗。\n再醒来时，雕花床帐已换成合欢宗客舍的绯色轻纱。昨夜的女子换上宗门衣袍，倚门笑着告诉你：她奉命在外寻觅适合双修的人才，而你肉身强健、技巧纯熟，恰好被宗门看中。\n你正想问这算绑架还是招贤，腰间那本旧记事册忽然自行浮起。它是十二位旧日知己的画像与品鉴记录，也是一位老友临终前相赠之物；此刻十二页画像同时亮起，纸间流出的灵气竟开始反哺你的修行。\n女修盯着封面上的《百艳录》三字，笑意更深："看来把你带回来，不止捡到一个人才，还替宗门捡到了一件会随风流债一起成长的宝物。"',tags:['合欢宗','男性人族','非处男','百艳录']},{id:'story-hehuan-healer',name:'医心问诊 · 慕怜心',subtitle:'医病亦医欲，先闻心中隐秘',desc:'合欢宗医术弟子负责防治性病并疏导同门心理；慕怜心因只恋慕女性、无法适应常规双修而前来求助。',cost:0,glyph:'心',recommend:'小道悠游 / 寻常修行',类型:'特殊',剧情:!0,flags:['合欢宗·医心问诊'],constraints:{locationIds:['eco-dt-linyuan'],门派归属:['','散修','合欢宗'],必须人形:!0,灵根禁止:['无']},settings:{时间:{年:7248,月:5,日:6,时辰:'申时'},宗门:'合欢宗（医堂弟子）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'合欢宗医堂不只治外伤与走火入魔，也负责替弟子防治性病、调解双修后的心结。你在这里坐诊许久，听过的欲望与秘密往往比伤势本身更离奇。\n今日闭门前，慕怜心却独自走进诊室。她反复确认隔音阵法已经开启，才低声承认自己只会被女性吸引，面对宗门安排的常规双修始终无法运功，因此把这份倾向视作妨碍修行的心病。\n她希望你替她矫正，你却没有立刻许诺改变她喜欢谁，只决定先找出真正阻塞功法的恐惧、羞耻与错误运功方式，再为她制定能够顺应本心的修行方案。\n就在你观察她语气与细微动作时，识海中一篇天品神识法悄然展开。无须调动灵气，你已从那些被刻意藏起的细节里读出了远比她主动倾诉更多的东西。',tags:['合欢宗','医术','心理疏导','慕怜心']},{id:'story-hehuan-double-dragon',name:'双头龙 · 阴华生灵',subtitle:'双女同修，法器初醒',desc:'合欢宗主沈沐漪常用的双头龙法器，因长年承受双修阴气浇灌而诞生智识。',cost:0,glyph:'双',recommend:'小道悠游 / 寻常修行',类型:'特殊',剧情:!0,flags:['合欢宗·双头龙成灵'],constraints:{locationIds:['eco-dt-linyuan'],门派归属:['','散修','合欢宗'],种族:['物化生灵'],种族细分必须为空:!0,剧本指定种类:'双头龙法器'},settings:{时间:{年:7248,月:8,日:22,时辰:'亥时'},宗门:'合欢宗（宗主私藏法器）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'你原是合欢宗主沈沐漪私藏的一件双头龙法器，专为两名女修之间运转双修功法而炼。宗主与同门使用你时，彼此阴气会沿器身阵纹往复交汇。\n无数个日夜里，浓郁阴气不断浸润材质与禁制。起初你只能被动传导，后来却渐渐记住每一种功法的节律，也能分辨握住自己的不同气息。\n今夜双修结束后，沈沐漪正准备将你收入匣中，器身上的灵识却产生了回应。你第一次主动牵引残留阴气，让本已停下的功法自行完成最后一个周天。\n沈沐漪的指尖猛地僵在半空。想到你或许早已能够感知这些年来发生的一切，她脸上惯常的从容顿时裂开，耳根也不受控制地泛起薄红。她下意识想把你塞回匣中，动作做到一半却又停住，既不敢与你对视，又忍不住偷偷观察器身上那流动的纹路。沉默许久，她才略显生硬地问道："你……究竟是从什么时候开始有意识的？"',tags:['合欢宗','物化生灵','双头龙','宗主法器']},{id:'story-hehuan-ancient-plug',name:'古府秘塞 · 众目成欢',subtitle:'大劫遗器，重见今人',desc:'合欢宗探索队在上古修士府邸中发现一件大劫前遗留的肛塞法器，而沉睡其中的主角也随之苏醒。',cost:0,glyph:'古',recommend:'小道悠游 / 逆天改命',类型:'特殊',剧情:!0,flags:['合欢宗·古府秘塞'],constraints:{locationIds:['eco-dt-linyuan'],门派归属:['','散修','合欢宗'],种族:['物化生灵'],种族细分必须为空:!0,剧本指定种类:'上古肛塞法器'},settings:{时间:{年:7249,月:1,日:9,时辰:'午时'},宗门:'合欢宗（古府探索所得）',初始境界:{大境界:'炼气',小境界:'初期'}},body:'大劫前的修士府邸深埋地下，合欢宗探索队破开最后一道石门时，只见密室中央悬着一只被层层封禁的玉匣。\n匣中并非经书或丹药，而是一件形制古怪却灵纹密布的肛塞法器——正是沉睡至今的你。岁月磨去了旧主留下的气息，却没有彻底熄灭器内灵性。\n一名弟子试着注入灵气，密室墙上的古阵随之亮起。阵纹把佩戴、双修与旁观者的目光连成完整回路，尘封记忆也在你意识中逐一复苏。\n你终于明白自身用途：佩戴者会与你建立双修回路，而现场注视这一过程的人越多，阵法汇聚的双修速度便越快。探索队面面相觑，尚未决定如何处置，你已先一步从匣中发出了清醒后的第一缕灵识。',tags:['合欢宗','物化生灵','上古遗物','肛塞法器']},{id:'story-fan-zhigen',name:'巷尾灯火 · 后天植根',subtitle:'凡夫之身偶遇仙缘',desc:'凡人之身，偶遇一位流落街巷的老叟。彼此有缘之下，老叟以一门近乎失传的秘法为你接续灵根，自此踏上修真路。',cost:0,glyph:'续',recommend:'寻常修行 / 砺心问道',类型:'特殊',constraints:{physiqueTier:['凡体']},settings:{时间:{年:7268,月:10,日:7,时辰:'亥时'},宗门:'散修',初始境界:{大境界:'炼气',小境界:'初期'}},body:'夜雨敲檐，巷尾的旧屋灯火微弱。\n你替母亲煎完了药，正欲熄灯，门口忽地传来轻而沙哑的咳声——一名衣衫褴褛的老叟扶着门框，似乎已撑不住身子。\n"小友……一碗清水……一处避风之所，可乎？"\n你让出门来，老叟入屋，跌坐在炕沿，借着灯光，他抬起一双竟未浑浊的眸子，仔细打量了你半晌。\n"你命中无根，本不可修。然——老朽身怀一门接续灵根的秘法，已无来日施展。今夜你引我入屋，便是因缘。"\n他从怀中摸出一截枯瘦如柴的指头，指尖结着一缕灰白的灵气，伸至你眉心。\n"忍住灼意，七寸气海若开，从此凡尘不复你归处。"\n一道温热自眉心直贯丹田。窗外的雨声渐远，屋内的烛火忽然明亮起来——\n凡夫之躯，自此续上仙缘。',tags:['特殊']},{id:'story-fan-renjian',name:'粟米人间 · 纯凡之路',subtitle:'不入修真路',desc:'不入修真之列，安守凡人本分；于市井间度日，于沙场上历劫。凡躯亦能见识修真世道。',cost:0,glyph:'俗',recommend:'砺心问道 / 逆天改命',类型:'特殊',constraints:{physiqueTier:['凡体']},settings:{时间:{年:7222,月:5,日:18,时辰:'巳时'},宗门:'散修',初始境界:{大境界:'凡人',小境界:'初期'}},body:'熹微之光透过窗纸落在你的桌案上，照亮一份未抄完的契书。\n隔壁的粥摊已摆出了第一锅热粥，蒸气混着柴香缓缓浮起。\n你是凡夫，不通修真，不识灵气；这世间的修士御剑入云，于你而言不过是天上传闻。\n但市井烟火，自有你的去处——账册要算，柴米要买，旁边卖花的少女今晨还托你带一壶酒。\n你整了整布袍，揣好沉甸甸的几枚铜钱，跨过门槛，迎着晨光踏入这熙攘的街市。\n凡人有凡人的活法。修真世界的风浪与你似远还近，但只要心里有秤，凡途亦能不亏己心。',tags:['特殊','纯凡']}];function c(e,t){const n=e.constraints;if(!n)return!0;if(n.locationIds?.length&&(!t.locationId||!n.locationIds.includes(t.locationId)))return!1;if(n.regionIds?.length){if(!t.locationId)return!1;const e=(0,a.Wb)(t.locationId);if(!e.region||!n.regionIds.includes(e.region.id))return!1}if(n.性别&&t.性别!==n.性别)return!1;if(n.性别禁止?.includes(t.性别))return!1;if(n.元阳元阴必须&&!t.元阳元阴)return!1;if('boolean'==typeof n.元阳元阴状态&&t.元阳元阴!==n.元阳元阴状态)return!1;if(n.种族?.length&&!n.种族.includes(t.种族))return!1;if(n.必须人形&&(0,o.xf)(t.种族)?.canChooseTransformation&&!t.种族可化形)return!1;if(n.种族细分必须为空&&t.种族细分.trim())return!1;
