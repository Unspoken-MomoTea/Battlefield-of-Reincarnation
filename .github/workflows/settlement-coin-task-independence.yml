name: settlement-coin-task-independence
on:
  push:
    branches: [fix/settlement-coin-task-independence]
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply task-independent coin settlement
        run: python tools/patch-settlement-coin-task-independence.py
      - name: Update legacy settlement regression contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/task-settlement-simplified.cjs')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "assert.equal(ordinary.taskReward, 5000, 'only successful main/trial task coin rewards count');": "assert.equal(ordinary.taskReward, 93888, 'all successful tasks with explicit coin rewards count regardless of commissioner identity');",
              "assert.equal(ordinary.totalReward, 183000);": "assert.equal(ordinary.totalReward, 271888);",
              "assert.equal(ordinary.balanceAfter, 184000);": "assert.equal(ordinary.balanceAfter, 272888);",
              "assert.equal(single.taskReward, 5000);": "assert.equal(single.taskReward, 93888);",
              "assert.equal(single.totalReward, 123000);": "assert.equal(single.totalReward, 211888);",
              "assert.equal(single.balanceAfter, 124000);": "assert.equal(single.balanceAfter, 212888);",
          }
          for old, new in replacements.items():
              if new in s:
                  continue
              if old not in s:
                  raise SystemExit(f'missing assertion anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Settlement coin task-independence regression
        run: node tests/settlement-coin-task-independence.cjs
      - name: Simplified task settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: Settlement shop coin persistence regression
        run: node tests/settlement-shop-coin-persistence.cjs
      - name: Settlement current panel regression
        run: node tests/settlement-current-panel-regression.cjs
      - name: Commit patched settlement delivery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Regular/结算任务美化.html" tests/task-settlement-simplified.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: decouple coin settlement from task identity [coin-task-independence-built]"
          git push
