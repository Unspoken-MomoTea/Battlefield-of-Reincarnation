name: Apply achievement settlement frontend patch

on:
  push:
    paths:
      - '.github/workflows/apply-achievement-settlement-frontend.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch with original line endings
        shell: bash
        run: |
          git show 4d19283a11ebddfa0a688a081be12856a5b8aa87:.github/workflows/apply-achievement-settlement-frontend.yml > /tmp/old-workflow.yml
          python - <<'PY'
          from pathlib import Path
          import base64, re

          targets = [
              Path('World Book/[variables]当前变量.txt'),
              Path('script/辅助计算脚本.js'),
              Path('Regular/结算任务美化.html'),
          ]
          had_crlf = {str(p): b'\r\n' in p.read_bytes() for p in targets}

          source = Path('/tmp/old-workflow.yml').read_text(encoding='utf-8')
          m = re.search(r"base64\.b64decode\('([^']+)'\)", source)
          if not m:
              raise SystemExit('old guarded patch payload not found')
          exec(base64.b64decode(m.group(1)), {})

          for p in targets:
              if not had_crlf[str(p)]:
                  continue
              raw = p.read_bytes().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
              p.write_bytes(raw)
          PY

      - name: Validate patched scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('Regular/结算任务美化.html').read_bytes().decode('utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if len(scripts) != 1:
              raise SystemExit(f'expected one script block, found {len(scripts)}')
          Path('/tmp/settlement.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/settlement.js
          git diff --check

      - name: Commit business changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-achievement-settlement-frontend.yml
          git add -A
          git commit -m 'move achievement rewards into settlement beautifier'
          git push origin HEAD:main
