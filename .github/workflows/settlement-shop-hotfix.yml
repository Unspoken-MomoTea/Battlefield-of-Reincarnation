name: settlement-shop-hotfix
on:
  push:
    branches: [fix/settlement-shop-coin-refund]
permissions:
  contents: write
jobs:
  red-green:
    if: ${{ !contains(github.event.head_commit.message, '[settlement-shop-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm regression is red
        run: |
          if node tests/settlement-shop-coin-persistence.cjs; then
            echo 'Regression unexpectedly passed before implementation.'
            exit 1
          fi
          echo 'RED confirmed: current settlement can still overwrite post-purchase balance.'
      - name: Apply minimal settlement hotfix
        run: python tools/apply-settlement-shop-coin-hotfix.py
      - name: Settlement shop coin persistence regression
        run: node tests/settlement-shop-coin-persistence.cjs
      - name: Simplified task settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: Settlement status alias regression
        run: node tests/settlement-status-aliases.cjs
      - name: Commit verified hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Regular/结算任务美化.html script/ZOD脚本.js 'World Book/[InitVar]世界初始设定.yaml' 'World Book/[variables]当前变量.txt'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep shop spending after settlement [settlement-shop-fixed]'
          git push
