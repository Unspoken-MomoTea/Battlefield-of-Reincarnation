name: statusbar-sd-reference-hotfix
on:
  push:
    branches: [fix/statusbar-settlement-sd-reference]
permissions:
  contents: write
jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: pass statData to statusbar topbar') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm regression reproduces
        run: |
          if node tests/statusbar-settlement-topbar.cjs; then
            echo 'expected regression test to fail before patch'
            exit 1
          fi
          echo 'confirmed: undefined sd regression is reproduced'
      - name: Apply minimal statusbar patch
        run: python tools/patch-statusbar-settlement-sd-reference.py
      - name: Syntax check statusbar
        run: node --check script/悬浮球状态栏.js
      - name: Statusbar settlement topbar regression
        run: node tests/statusbar-settlement-topbar.cjs
      - name: Commit hotfix and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/patch-statusbar-settlement-sd-reference.py .github/workflows/statusbar-sd-reference-hotfix.yml
          git add script/悬浮球状态栏.js tests/statusbar-settlement-topbar.cjs
          git commit -m "fix: pass statData to statusbar topbar"
          git push
