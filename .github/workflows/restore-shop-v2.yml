name: Restore shop v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-shop-v2.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply rollback patch
        run: python3 .github/scripts/restore_shop_pre_reinforcement.py

      - name: Check statusbar syntax
        run: node --check 'script/悬浮球状态栏.js'

      - name: Check calculation syntax
        run: node --check 'script/ZOD脚本.js'

      - name: Check semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          status = Path('script/悬浮球状态栏.js').read_text(encoding='utf-8')
          rules = Path('World Book/⚙️实体生成规则.txt').read_text(encoding='utf-8')
          calc = Path('script/ZOD脚本.js').read_text(encoding='utf-8')
          for token in ['shopReinforcementValue','shopInspectUpgrade','shopFilterRawUpgrades','samReinforcementLabel','_source_reinforcement','_result_reinforcement','.强化']:
              assert token not in status, token
          assert '3. 升级重铸机制:' in status
          assert '商城可以提前展示未解锁的跨阶方案，但不得在未满足前置时购买或结算。' in status
          assert '不得解释为“实体内部每项原始属性的品质标记不得高于实体品质”' in rules
          assert 'cleanupLegacyReinforcementFields(statData);' in calc
          print('semantic checks passed')
          PY
          git diff --stat
          git diff --check || echo 'warning: baseline contains pre-existing whitespace issues; syntax/semantic checks passed'

      - name: Commit rollback
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/restore-shop-pre-reinforcement.yml' '.github/workflows/restore-shop-v2.yml' '.github/scripts/restore_shop_pre_reinforcement.py'
          git add 'script/悬浮球状态栏.js' 'script/ZOD脚本.js' 'World Book/⚙️实体生成规则.txt' 'World Book/[variables]当前变量.txt'
          git commit -m 'restore mall before reinforcement lock'
          git push
