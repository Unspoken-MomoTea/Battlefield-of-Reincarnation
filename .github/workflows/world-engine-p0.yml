name: World Engine P0 Refactor

on:
  push:
    branches:
      - refactor/world-engine-p0
    paths:
      - .github/workflows/world-engine-p0.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/world-engine-p0
      - name: Refactor prompt layers
        run: python tools/refactor-world-engine-p0.py
      - name: Syntax check
        run: node --check 'script/世界推进系统.js'
      - name: Commit refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'script/世界推进系统.js'
          git commit -m 'refactor: streamline world engine prompt pipeline'
          git push origin HEAD:refactor/world-engine-p0
