name: tmp-trial-history-fallback

on:
  push:
    branches:
      - codex/trial-task-history-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/trial-task-history-fallback
          fetch-depth: 0

      - name: Apply focused patch
        run: node .github/tmp/patch-trial-history-fallback.js

      - name: Remove temporary patch files
        run: |
          rm .github/tmp/patch-trial-history-fallback.js
          rm .github/workflows/tmp-trial-history-fallback.yml

      - name: Validate diff
        run: git diff --check

      - name: Validate embedded JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('Regular/结算任务美化.html', 'utf8');
          const match = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!match) throw new Error('Embedded script not found');
          fs.writeFileSync('/tmp/settlement-script.js', match[1]);
          NODE
          node --check /tmp/settlement-script.js

      - name: Validate focused file set and behavior markers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const names = cp.execSync('git diff --name-only', {encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean).sort();
          const expected = ['.github/tmp/patch-trial-history-fallback.js', '.github/workflows/tmp-trial-history-fallback.yml', 'Regular/结算任务美化.html'].sort();
          if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error('Unexpected changed files: ' + names.join(', '));
          const s = fs.readFileSync('Regular/结算任务美化.html', 'utf8');
          const must = ['function extractTrialTasks(data)', "String(task.委托方 || '').trim() === '晋升试炼'", 'currentTasks = extractTrialTasks', 'for (let step = 1; step <= 3; step++)', 'if (previousHit) return previousHit;'];
          for (const x of must) if (!s.includes(x)) throw new Error('Missing: ' + x);
          const banned = ['inferTrialTasksFromSettlement', '晋升试炼[·\\.]', "'晋升试炼·'"];
          for (const x of banned) if (s.includes(x)) throw new Error('Legacy logic remains: ' + x);
          const gates = (s.match(/&& trialTasks\.length\)/g) || []).length;
          if (gates < 2) throw new Error('Expected trial panel gates to depend on trialTasks only');
          NODE

      - name: Commit focused change
        run: |
          git config user.name "Unspoken-MomoTea"
          git config user.email "bayuexue.us@gmail.com"
          git add -A
          git commit -m "fix: recover trial tasks from settlement history"
          git push origin HEAD:codex/trial-task-history-fallback
