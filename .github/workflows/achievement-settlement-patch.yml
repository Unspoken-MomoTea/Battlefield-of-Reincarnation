        var lines=raw.replace(/\r/g,'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
        var world=''; var done=0; var total=0; var rows=[];
        lines.forEach(function(line){
          var m;
          if((m=line.match(/^副本[：:]\s*(.*)$/))){world=m[1].trim();return;}
          if((m=line.match(/^达成[：:]\s*(\d+)\s*\/\s*(\d+)/))){done=parseInt(m[1],10)||0;total=parseInt(m[2],10)||0;return;}
          var p=line.split('|');
          if(p.length>=6){rows.push({no:p[0],diff:p[1],name:p[2],desc:p[3],reward:p[4],status:p.slice(5).join('|')});}
        });
        if(!total) total=rows.length;
        if(!done) done=rows.filter(function(r){return r.status==='已达成';}).length;
        if(label) label.textContent='成就结算'+(world?' · '+world:'');
        var pct=total?Math.round(done/total*100):0;
