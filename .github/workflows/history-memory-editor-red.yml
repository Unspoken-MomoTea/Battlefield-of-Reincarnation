name: history-memory-editor-red
on:
  push:
    branches: [fix/history-memory-editor]
permissions:
  contents: read
jobs:
  regression:
    if: ${{ !contains(github.event.head_commit.message, 'impl: editable history memory') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm missing history editor fails regression
        run: |
          if node tests/world-engine-history-memory-editor.cjs; then
            echo 'expected history memory editor regression to fail before implementation'
            exit 1
          fi
          echo 'confirmed: history memory editing is not implemented yet'
