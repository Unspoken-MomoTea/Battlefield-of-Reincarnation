name: World engine rumor check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/world-engine-rumor-check.yml'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build world engine
        run: python tools/build-world-engine.py
      - name: Syntax check
        run: node --check script/世界推进系统.js
      - name: Rumor liveliness regression
        run: node tests/world-engine-rumor-liveliness.cjs
      - name: NPC audit regression
        run: node tests/world-engine-npc-audit-toggle.cjs
      - name: Request transparency
        run: node tests/world-engine-request-transparency.cjs
      - name: Module synchronization
        run: node tests/world-engine-modules.cjs
      - name: Commit generated delivery
        run: |
          if git diff --quiet -- script/世界推进系统.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/世界推进系统.js
          git commit -m "build: sync rumor liveliness delivery"
          git push
