name: Fix variable mode mapping once

on:
  push:
    branches:
      - fix/variable-mode-only-output-format
    paths:
      - .github/workflows/fix-variable-mode-mapping-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/variable-mode-only-output-format

      - name: Remove update/output rules from mode switch
        shell: python
        run: |
          from pathlib import Path

          files = [Path('Regular/开局.html'), Path('script/悬浮球状态栏.js')]
          remove_lines = [
              "        '[mvu_update]变量更新规则': { '随主API': false, '额外API': true },",
              "        '[mvu_update]变量输出规则': { '随主API': false, '额外API': true },",
          ]

          for path in files:
              raw = path.read_bytes()
              text = raw.decode('utf-8')
              nl = '\r\n' if '\r\n' in text else '\n'
              for line in remove_lines:
                  count = text.count(line)
                  if count != 1:
                      raise RuntimeError(f'{path}: expected exactly one mapping line {line!r}, got {count}')
                  text = text.replace(line + nl, '', 1)
              path.write_bytes(text.encode('utf-8'))

      - name: Validate exact two-entry mapping
        shell: bash
        run: |
          node --check 'script/悬浮球状态栏.js'
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path

          opening = Path('Regular/开局.html').read_text(encoding='utf-8')
          scripts = [s for s in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', opening, flags=re.S|re.I) if s.strip()]
          if not scripts:
              raise SystemExit('no inline scripts found')
          for i, js in enumerate(scripts):
              p = Path(tempfile.gettempdir()) / f'opening-mode-fix-{i}.js'
              p.write_text(js, encoding='utf-8')
              subprocess.run(['node', '--check', str(p)], check=True)

          for filename in ['Regular/开局.html', 'script/悬浮球状态栏.js']:
              text = Path(filename).read_text(encoding='utf-8')
              m = re.search(r"VARIABLE_API_WORLD_BOOK_RULES\s*=\s*\{(.*?)\n\s*\};", text, flags=re.S)
              if not m:
                  raise SystemExit(f'{filename}: mapping object not found')
              body = m.group(1)
              if '[mvu_update]变量更新规则' in body or '[mvu_update]变量输出规则' in body:
                  raise SystemExit(f'{filename}: forbidden rules still controlled by switch')
              required = [
                  "output_format_(随AI输出开，主API)",
                  "[mvu_update]output_format_(使用额外模型更新变量开)",
              ]
              for name in required:
                  if body.count(name) != 1:
                      raise SystemExit(f'{filename}: expected one {name}')
              entries = re.findall(r"^\s*'[^']+'\s*:\s*\{", body, flags=re.M)
              if len(entries) != 2:
                  raise SystemExit(f'{filename}: expected exactly 2 switch-controlled worldbook entries, got {len(entries)}')
              if "return mode === '随主API' ? '随主API' : '额外API'" not in text:
                  raise SystemExit(f'{filename}: default mode is no longer extra API')
          PY
          git config core.whitespace cr-at-eol
          git config core.quotepath false
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'Regular/开局.html'
          printf '%s\n' "${changed[@]}" | grep -Fx 'script/悬浮球状态栏.js'
          test "$(git diff --numstat | awk '{a+=$1; d+=$2} END {print a+0, d+0}')" = '0 4'

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/fix-variable-mode-mapping-once.yml'
          git add 'Regular/开局.html' 'script/悬浮球状态栏.js'
          git config core.whitespace cr-at-eol
          git diff --cached --check
          git commit -m 'fix: only toggle variable output format entries [skip ci]'
          git push origin HEAD:fix/variable-mode-only-output-format
