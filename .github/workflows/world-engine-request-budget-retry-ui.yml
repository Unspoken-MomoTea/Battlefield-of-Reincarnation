name: World Engine Request Budget Retry UI Acceptance

on:
  push:
    branches: [fix/world-engine-token-retry-timeout-ui]
    paths:
      - '.github/workflows/world-engine-request-budget-retry-ui.yml'

permissions:
  contents: write

jobs:
  request-budget-retry-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-engine-token-retry-timeout-ui
          fetch-depth: 0
      - name: Red - reproduce retry count and inspection ambiguity
        shell: bash
        run: |
          if node tests/world-engine-request-budget-retry-ui.cjs; then
            echo 'Expected focused acceptance to fail before implementation.' >&2
            exit 1
          fi
          echo 'Regression reproduced.'
      - name: Green - apply focused patch
        run: |
          python tools/refactor-world-engine-request-budget-retry-ui.py
          python tools/fix-world-engine-observability-test.py
          python tools/build-world-engine.py
          python tools/build-world-engine.py --check
          node --check 'script/世界推进系统.js'
      - name: Green - request budget and retry UI
        run: node tests/world-engine-request-budget-retry-ui.cjs
      - name: Green - schema retry diagnostics
        run: node tests/world-engine-schema-retry-diagnostics.cjs
      - name: Green - macro backbone
        run: node tests/world-engine-macro-open-backbone.cjs
      - name: Green - observability
        run: node tests/world-engine-observability.cjs
      - name: Green - request transparency
        run: node tests/world-engine-request-transparency.cjs
      - name: Green - prompt pipeline
        run: node tests/world-engine-prompt-pipeline.cjs
      - name: Green - scene context
        run: node tests/world-engine-scene-context.cjs
      - name: Green - modules
        run: node tests/world-engine-modules.cjs
      - name: Verify scope and semantics
        shell: bash
        run: |
          git diff --check
          grep -q '300000' script/world-engine-src/40-engine-runtime.part.js
          grep -q '请求超时（300秒）' script/world-engine-src/40-engine-runtime.part.js
          grep -q '最大尝试次数 <input data-retries type="number" min="1" max="5"' script/world-engine-src/50-engine-ui.part.js
          ! grep -q '失败后额外重试' script/world-engine-src/50-engine-ui.part.js
          ! grep -q '每次尝试观测（点击展开）' script/world-engine-src/50-engine-ui.part.js
          ! grep -q 'User:tokenLabel(obs.User估算Tokens' script/world-engine-src/50-engine-ui.part.js
          ! grep -q 'Schema子项:tokenLabel' script/world-engine-src/50-engine-ui.part.js
          grep -q 'userTokenFields=Object.fromEntries((obs.User分段||\[\])' script/world-engine-src/50-engine-ui.part.js
          test -z "$(git status --porcelain | awk '{print $2}' | grep -E '(^|/)regex-|World Book/.*regex' || true)"
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            script/world-engine-src/10-world-state.part.js \
            script/world-engine-src/40-engine-runtime.part.js \
            script/world-engine-src/50-engine-ui.part.js \
            script/世界推进系统.js \
            script/世界引擎接入说明.md \
            docs/世界引擎V2审计.md \
            tests/world-engine-request-budget-retry-ui.cjs \
            tests/world-engine-schema-retry-diagnostics.cjs \
            tests/world-engine-observability.cjs \
            tests/world-engine-prose.cjs \
            tests/world-engine-macro-open-backbone.cjs \
            tests/world-engine.cjs
          git diff --cached --check
          git commit -m 'fix: make request budget and retries unambiguous'
          git push origin HEAD:fix/world-engine-token-retry-timeout-ui
