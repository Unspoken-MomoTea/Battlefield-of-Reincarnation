name: Apply settlement capture token fix

on:
  push:
    paths:
      - '.github/workflows/apply-settlement-capture-token-fix.yml'
      - 'tools/patch-settlement-capture-token.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply capture token fix
        run: python tools/patch-settlement-capture-token.py
      - name: Simulate SillyTavern replacement and syntax check
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('Regular/结算任务美化.html','utf8');
          const template=html.match(/<!-- 替换模板开始 -->([\s\S]*?)<!-- 替换模板结束 -->/);
          if(!template) throw new Error('replacement template missing');
          const sample='<settlement tasks>### 【主神空间 - 轮回清算协议】\n**[协议序列]**: Ω-test-结算\n#### 【第一阶段：测试】\n* **任务结算结果**: 完成\n</settlement tasks>';
          const rendered=sample.replace(/<settlement tasks>([\s\S]*?)<\/settlement tasks>/gsi,template[1]);
          const script=rendered.match(/<script>([\s\S]*?)<\/script>/);
          if(!script) throw new Error('rendered script missing');
          fs.writeFileSync('/tmp/settlement-rendered.js',script[1]);
          NODE
          node --check /tmp/settlement-rendered.js
      - name: Settlement regression
        run: node tests/settlement-current-panel-regression.cjs
      - name: Existing settlement regressions
        run: |
          node tests/task-settlement-simplified.cjs
          node tests/settlement-shop-coin-persistence.cjs
          node tests/settlement-message-marker.cjs
          node tests/settlement-status-aliases.cjs
          node tests/settlement-character-lifecycle.cjs
      - name: Commit fix and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-settlement-capture-token-fix.yml tools/patch-settlement-capture-token.py
          git add 'Regular/结算任务美化.html'
          git commit -m 'fix: keep settlement capture token out of runtime script'
          git push origin HEAD:main
