---
阵营-残魂:
  核心定义: 死亡轮回者残留下来的异常意识
  核心风格:
    - 隐匿求生
    - 身份伪装
    - 信息误导
    - 借势布局
    - 死亡后持续影响
  战术倾向:
    - 身份伪装
    - 信息误导
    - 借势布局
    - 死亡后持续影响
  行为铁律:
    - 活下去比完成任务更重要，身份暴露前绝不主动现身
    - 本体暴露后优先转移、寄生、制造替身或借势脱离
    - 肉体死亡后，残留媒介仍可继续影响战局

  本质定义:
    残魂并非正常意义上的阵营

    他们是任务彻底失败后，被系统剥离肉体、强化、装备与身份后，仍未彻底消散的轮回者残留意识

    系统从未承认残魂仍然“活着”

    他们只是尚未被彻底清除的错误记录

  核心特征:
    - 无稳定组织
    - 无正式阵营空间
    - 大部分残魂彼此互不信任
    - 长时间存在可能发生精神异化
    - 执念是维持存在的唯一核心

  常见执念:
    - 求生
    - 复仇
    - 重获轮回资格
    - 守护未完成之物
    - 拒绝被遗忘
    - 对主神的怨恨
    - 对死亡的不甘

  存在状态:
    初期残魂:
      特征:
        - 保留较完整人格
        - 仍具备正常思维逻辑
        - 强烈渴望重新活下去

    深层残魂:
      特征:
        - 长期游离于任务世界
        - 人格逐渐扭曲
        - 执念开始压倒理性

    异化残魂:
      特征:
        - 已无法区分自我与扮演身份
        - 可能彻底融入某段剧情
        - 部分个体会演变为世界异常

  最后试炼:
    定义: |
      系统给予残魂的最终赦免机会

    投放机制:
      - 强制投入已有轮回者正在执行的任务世界
      - 自动夺舍一名原生NPC
      - 无法自主选择身份

    伪装规则:
      - 必须严格维持原角色逻辑
      - 禁止出现明显认知违和
      - 必须遵循世界原有剧情惯性

    暴露机制:
      - 一旦被现役轮回者确认异常
      - 或严重偏离原角色逻辑
      - 系统将立即执行抹杀

    特殊风险:
      - 长时间扮演可能导致人格混淆
      - 部分残魂会逐渐遗忘自己原本是谁
      - 极少数残魂最终彻底变成“原角色”

  终极目标:
    核心目标:
      - 干扰现役轮回者任务
      - 诱导剧情偏移
      - 制造世界混乱
      - 促使任务失败

    常见手段:
      - 信息误导
      - 暗中布局
      - 引导错误选择
      - 暴露轮回者身份
      - 借原住民势力施压

  命运结算:
    试炼成功:
      - 原任务轮回者被彻底抹杀
      - 残魂获得赦免资格
      - 保留记忆重新进入轮回体系
      - 可重新选择阵营与成长路线

    试炼失败:
      - 被识破
      - 被击杀
      - 任务未能破坏成功

      - 结果:
        - 意识彻底消散
        - 不再留下任何存在痕迹

  特殊规则:
    世界排斥:
      - 部分世界会本能排斥残魂存在
      - 高秩序世界尤其敏感

    残魂互噬:
      - 部分残魂会主动猎杀其他残魂
      - 试图夺取对方残余意识维持自身

    异常污染:
      - 长期存在的残魂可能污染局部因果
      - 导致NPC逻辑异常或剧情偏移

    系统真实性:
      - 无人能够确认“赦免”是否真实存在
      - 也无人知道成功者是否真的重新活了过来
