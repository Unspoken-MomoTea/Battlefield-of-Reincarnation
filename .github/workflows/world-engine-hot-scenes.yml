name: World Engine Hot Scene Projection Acceptance

on:
  push:
    branches: [fix/world-engine-context-ui-redesign]

permissions:
  contents: write

jobs:
  hot-scenes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-engine-context-ui-redesign
          fetch-depth: 0

      - name: Red - old person-centric projection must fail new contract
        run: |
          if node tests/world-engine-hot-scenes.cjs; then
            echo 'Expected the pre-refactor projection to fail the hot-scene contract.' >&2
            exit 1
          fi

      - name: Align one-shot runtime anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/refactor-world-engine-hot-scenes.py')
          s=p.read_text(encoding='utf-8')
          old="以及程序筛选的场外人物动态（地点/目标/行动/状态/更新时间/公开动态/关联事件）；活跃异端始终进入人物动态。人物目标/行动用于保持叙事连续性，不代表角色已知。"
          new="以及程序按地区聚合的场外人物动态（地区共享现场 + 人物自身地点/目标/行动/状态/更新时间/公开动态/关联事件）；活跃异端始终进入人物动态。人物目标/行动用于保持叙事连续性，不代表角色已知。"
          if old not in s:
              raise SystemExit('one-shot runtime anchor text not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Apply hot scene refactor
        run: python tools/refactor-world-engine-hot-scenes.py

      - name: Rebuild delivery script
        run: |
          python tools/build-world-engine.py
          python tools/build-world-engine.py --check
          node --check 'script/世界推进系统.js'

      - name: Green - hot scene projection
        run: node tests/world-engine-hot-scenes.cjs

      - name: Green - context and UI architecture
        run: |
          node tests/world-engine-context-ui-redesign.cjs
          node tests/world-engine-person-scene-ui.cjs
          node tests/world-engine-scene-context.cjs

      - name: Green - core contracts
        run: |
          node tests/world-engine-modules.cjs
          node tests/world-engine-prompt-pipeline.cjs
          node tests/world-engine-request-transparency.cjs
          node tests/world-engine-schema-retry-diagnostics.cjs
          node tests/world-engine-macro-backbone.cjs

      - name: Verify renamed readonly contract
        run: |
          grep -q 'readonly.世界.场外场景 = hotScenes' 'World Book/[variables]当前变量.txt'
          ! grep -q 'readonly.世界.场外人物动态' 'World Book/[variables]当前变量.txt'
          grep -q '/世界/场外场景' 'World Book/[mvu_update]变量更新规则.txt'
          ! grep -q '/世界/场外人物动态' 'World Book/[mvu_update]变量更新规则.txt'
          grep -q '【世界.场外场景】' 'World Book/⚙️额外思考.txt'

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'World Book/[variables]当前变量.txt' 'World Book/[mvu_update]变量更新规则.txt' 'World Book/⚙️额外思考.txt' \
            script/world-engine-src/40-engine-runtime.part.js script/世界推进系统.js script/世界引擎接入说明.md docs/世界引擎V2审计.md \
            tests/world-engine-context-ui-redesign.cjs tests/world-engine-scene-context.cjs tests/world-engine.cjs
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m 'refactor: project hot world scenes by region'
            git push origin HEAD:fix/world-engine-context-ui-redesign
          fi
