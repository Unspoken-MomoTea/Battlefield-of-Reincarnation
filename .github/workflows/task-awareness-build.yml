name: task-awareness-build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[task-awareness-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync variable prompt world time ownership
        run: python tools/patch-world-time-ownership.py
      - name: Sync settlement character lifecycle
        run: python tools/patch-settlement-character-lifecycle.py
      - name: Build delivery
        run: python tools/build-world-engine.py
      - name: Syntax check
        run: node --check script/世界推进系统.js
      - name: Simplified task settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: Settlement shop coin persistence regression
        run: node tests/settlement-shop-coin-persistence.cjs
      - name: Settlement message marker regression
        run: node tests/settlement-message-marker.cjs
      - name: Settlement current panel regression
        run: node tests/settlement-current-panel-regression.cjs
      - name: Settlement status alias regression
        run: node tests/settlement-status-aliases.cjs
      - name: Settlement character lifecycle regression
        run: node tests/settlement-character-lifecycle.cjs
      - name: Super-stable prompt regression
        run: node tests/world-engine-superstable-prompt.cjs
      - name: Task awareness regression
        run: node tests/world-engine-task-awareness.cjs
      - name: Rumor rolling regression
        run: node tests/world-engine-rumor-capacity.cjs
      - name: Editable system prompts regression
        run: node tests/world-engine-editable-system-prompts.cjs
      - name: Offstage NPC knowledge boundary regression
        run: node tests/offstage-knowledge-boundary.cjs
      - name: Causal overview regression
        run: node tests/world-engine-causal-summary.cjs
      - name: Soft maintenance regression
        run: node tests/world-engine-soft-maintenance.cjs
      - name: Active alien activity normalization
        run: node tests/world-engine-alien-activity-normalization.cjs
      - name: Auto progress regression
        run: node tests/world-engine-auto-progress.cjs
      - name: Auto progress after variable reprocessing
        run: node tests/world-engine-auto-reprocess.cjs
      - name: World engine event bootstrap
        run: node tests/world-engine-event-bootstrap.cjs
      - name: Chronology guard regression
        run: node tests/world-engine-chronology-guard.cjs
      - name: World integrity regression
        run: node tests/world-engine-integrity-guard.cjs
      - name: Commit generated delivery
        run: |
          if git diff --quiet -- script/world-engine-src/00-foundation-prompt.part.js script/世界推进系统.js "World Book/[mvu_update]变量更新规则.txt" "World Book/[variables]当前变量.txt" "Regular/结算任务美化.html" tests/world-engine.cjs tests/world-engine-superstable-prompt.cjs tests/world-engine-prompt-pipeline.cjs tests/world-engine-scene-context.cjs tests/world-engine-asset-multi-owner.cjs tests/world-engine-asset-writeback.cjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/world-engine-src/00-foundation-prompt.part.js script/世界推进系统.js "World Book/[mvu_update]变量更新规则.txt" "World Book/[variables]当前变量.txt" "Regular/结算任务美化.html" tests/world-engine.cjs tests/world-engine-superstable-prompt.cjs tests/world-engine-prompt-pipeline.cjs tests/world-engine-scene-context.cjs tests/world-engine-asset-multi-owner.cjs tests/world-engine-asset-writeback.cjs
          git commit -m "build: sync world engine delivery [task-awareness-built]"
          git push
      - name: NPC audit regression
        run: node tests/world-engine-npc-audit-toggle.cjs
      - name: Asset scope regression
        run: node tests/world-engine-asset-writeback.cjs
      - name: Module synchronization
        run: node tests/world-engine-modules.cjs
