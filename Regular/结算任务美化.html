<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>轮回清算渲染器</title>
<!--
  SillyTavern 正则:
  findRegex: /<settlement tasks>([\s\S]*?)<\/settlement tasks>/gsi
  replaceString: 使用“替换模板开始~结束”的全部内容

  晋升试炼规则：
  1. AI 只负责正常输出“任务专属奖励”，不再负责晋升资格面板。
  2. 本美化器在消息渲染时直接读取 MVU 的 stat_data.任务.列表。
  3. 发现 委托方===晋升试炼 时，在任务专属奖励下方插入数据库核验面板。
  4. 仅当全部晋升试炼任务状态===可结算时，写入 系统状态.试炼已完成=true。
-->
<style>
*{box-sizing:border-box}body{margin:0;padding:10px;background:transparent;color:#dbe4ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.65}
.st-wrapper{--cyan:#2ee6ff;--gold:#f5d76e;--green:#86efac;--orange:#fb923c;--red:#f87171;--purple:#c084fc;--dim:#8fa0b3;--line:rgba(46,230,255,.16)}
.st-btn{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border:1px solid rgba(46,230,255,.48);border-radius:4px;background:linear-gradient(135deg,rgba(14,32,42,.96),rgba(9,18,28,.96));color:var(--cyan);cursor:pointer;user-select:none;box-shadow:0 2px 10px rgba(0,0,0,.35);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.st-btn:hover,.st-btn.active{border-color:var(--cyan);box-shadow:0 0 16px rgba(46,230,255,.18)}.st-icon{width:18px;height:18px;fill:var(--cyan)}.st-label{font-size:.88em;font-weight:700;letter-spacing:1px}
.st-panel{display:none;margin:10px 0 18px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:linear-gradient(135deg,rgba(13,17,26,.98),rgba(8,11,18,.98));box-shadow:0 10px 38px rgba(0,0,0,.48)}.st-panel.show{display:block}
.st-banner{padding:15px 17px 13px;background:radial-gradient(ellipse at 20% 0,rgba(46,230,255,.12),transparent 55%),linear-gradient(180deg,rgba(46,230,255,.05),transparent);border-bottom:1px solid var(--line)}
.st-title{font-size:1.06em;font-weight:900;color:var(--cyan);letter-spacing:2px;text-shadow:0 0 12px rgba(46,230,255,.35)}.st-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.st-tag{padding:1px 9px;border:1px solid rgba(46,230,255,.28);border-radius:3px;background:rgba(46,230,255,.05);font-size:.76em;color:#9be8f5}.st-tag b{color:var(--cyan)}
.st-stage{padding:13px 17px 9px;border-bottom:1px dashed rgba(255,255,255,.06)}.st-stage:last-child{border-bottom:0}.st-stage-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}.st-stage-no{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--cyan);font-size:.72em;font-weight:900;border:1px solid rgba(46,230,255,.35);background:rgba(46,230,255,.06);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}.st-stage-name{font-size:.94em;font-weight:800;letter-spacing:1px;color:#bfeef8}.st-stage-line{height:1px;flex:1;background:linear-gradient(90deg,rgba(46,230,255,.3),transparent)}
.st-sub{display:flex;align-items:center;gap:7px;margin:10px 0 5px;color:#a8e8f5;font-size:.8em;font-weight:800;letter-spacing:1px}.st-sub:before{content:'◆';font-size:.75em;color:rgba(46,230,255,.7)}.st-sub:after{content:'';height:1px;flex:1;background:linear-gradient(90deg,rgba(46,230,255,.18),transparent)}
.st-kv{display:flex;gap:8px;padding:3px 0;font-size:.84em;align-items:baseline}.st-kv .k{min-width:7em;flex:none;font-weight:800;color:#9be8f5}.st-kv .v{color:#c7d2df;word-break:break-word}.st-kv.gold .v{color:var(--gold);font-weight:700}.st-kv.good .v{color:var(--green)}.st-kv.bad .v{color:var(--red)}
.st-comment{margin:7px 0;padding:9px 12px;border-left:2px solid rgba(46,230,255,.45);border-radius:0 6px 6px 0;background:linear-gradient(90deg,rgba(46,230,255,.055),transparent);font-size:.82em;color:#afc1d2}.st-para{padding:3px 0;font-size:.83em;color:#b9c8d6}.st-list{margin:4px 0;padding:6px 10px 6px 20px;border-radius:6px;background:rgba(255,255,255,.025);font-size:.82em;color:#bbc7d5}.st-list:before{content:'•';margin-right:8px;color:var(--cyan)}
.st-brand{margin:7px 0 11px;padding:11px;text-align:center;border:1px solid rgba(192,132,252,.25);border-radius:7px;background:radial-gradient(ellipse at 50% 0,rgba(192,132,252,.13),transparent 70%)}.st-brand small{display:block;color:#a78bfa;letter-spacing:4px}.st-brand strong{display:block;color:#e9d5ff;font-size:1.22em;letter-spacing:5px;text-shadow:0 0 14px rgba(192,132,252,.5)}
.st-rate{display:inline-flex;min-width:35px;justify-content:center;padding:1px 8px;border:1px solid currentColor;border-radius:4px;margin:0 3px;font-weight:900}.g-F{color:#94a3b8}.g-E{color:#f8fafc}.g-D{color:#22c55e}.g-C{color:#3b82f6}.g-B{color:#a855f7}.g-A{color:#f97316}.g-S{color:#eab308}.g-SS{color:#ef4444}.g-SSS{color:#ec4899}
.st-sum{margin:5px 0;padding:7px 11px;border:1px dashed rgba(212,175,55,.25);border-radius:6px;background:rgba(212,175,55,.045)}.st-sum .st-kv .k{color:#b8a36b}.st-sum .st-kv .v{color:var(--gold);font-weight:800}
.st-punish{margin:5px 0;padding:8px 11px;border:1px solid rgba(248,113,113,.3);border-radius:6px;background:linear-gradient(90deg,rgba(239,68,68,.1),rgba(239,68,68,.025));font-size:.82em;color:#fda4af}.st-empty{margin:4px 0;padding:6px 11px;border:1px dashed rgba(255,255,255,.11);border-radius:6px;color:#8192a5;font-size:.79em}
.st-total{margin:12px 0 6px;padding:14px;text-align:center;border:1px solid rgba(212,175,55,.42);border-radius:9px;background:radial-gradient(ellipse at 50% 0,rgba(212,175,55,.15),transparent 65%),rgba(212,175,55,.025)}.st-total small{display:block;color:#bfa65d;letter-spacing:5px}.st-total strong{display:block;margin-top:4px;color:var(--gold);font-size:1.8em;letter-spacing:1px;text-shadow:0 0 18px rgba(245,215,110,.4)}
.st-card{margin:9px 0;padding:13px 14px;border:1px solid rgba(212,175,55,.35);border-radius:8px;background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(212,175,55,.02))}.st-card-title{font-weight:900;letter-spacing:1px;color:var(--gold);margin-bottom:6px}.st-relic{border-color:rgba(236,72,153,.32);background:radial-gradient(ellipse at 30% 0,rgba(236,72,153,.1),transparent 62%)}.st-relic .st-card-title{color:#f9a8d4}.st-relic.gold{border-color:rgba(212,175,55,.38)}.st-relic.gold .st-card-title{color:var(--gold)}
/* 数据库晋升试炼核验面板 */
.st-trial{margin:12px 0 8px;padding:13px 14px;border:1px solid rgba(134,239,172,.32);border-radius:8px;background:linear-gradient(135deg,rgba(16,185,129,.08),rgba(8,17,24,.5))}.st-trial.fail{border-color:rgba(251,146,60,.35);background:linear-gradient(135deg,rgba(251,146,60,.07),rgba(8,17,24,.5))}.st-trial-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.st-trial-title{font-weight:900;color:#b9f6cf;letter-spacing:1px}.st-trial.fail .st-trial-title{color:#fed7aa}.st-trial-count{font:800 .78em Consolas,monospace;color:#d6e8de}.st-trial-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 9px;margin:4px 0;border:1px solid rgba(255,255,255,.07);border-radius:6px;background:rgba(255,255,255,.025)}.st-trial-name{font-size:.81em;color:#cbd8e4;overflow:hidden;text-overflow:ellipsis}.st-state{padding:1px 8px;border-radius:999px;font-size:.73em;font-weight:900;border:1px solid}.st-state.ok{color:var(--green);border-color:rgba(134,239,172,.4);background:rgba(134,239,172,.07)}.st-state.wait{color:var(--orange);border-color:rgba(251,146,60,.4);background:rgba(251,146,60,.07)}.st-state.bad{color:var(--red);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.07)}.st-trial-bar{height:6px;margin:9px 0 8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.st-trial-fill{height:100%;background:linear-gradient(90deg,#22c55e,#86efac)}.st-trial-verdict{padding-top:6px;border-top:1px dashed rgba(255,255,255,.1);font-size:.82em;font-weight:800}.st-trial-verdict.ok{color:var(--green)}.st-trial-verdict.no{color:#fdba74}.st-trial-source{margin-top:3px;font-size:.7em;color:#75879a}
.st-notice{margin:9px 0;padding:8px 12px;border:1px dashed rgba(46,230,255,.28);border-radius:6px;background:rgba(46,230,255,.035);color:#9be8f5;font-size:.78em}.st-close{margin:11px 0 4px;padding:10px;text-align:center;border-top:1px solid rgba(134,239,172,.18);border-bottom:1px solid rgba(134,239,172,.18);color:var(--green);font-size:.83em;font-weight:800;letter-spacing:1px}
@media(max-width:600px){body{padding:7px}.st-stage{padding:11px 12px 7px}.st-kv{display:block}.st-kv .k{display:block;min-width:0}.st-trial-row{grid-template-columns:minmax(0,1fr) auto}.st-total strong{font-size:1.5em}}
</style>
</head>
<body>
<!-- 替换模板开始 -->
<div class="st-wrapper">
  <div class="st-btn">
    <svg class="st-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 16.93A7 7 0 1 1 18.93 13H17a5 5 0 1 0-4 3.9v2.03Z"/></svg>
    <span class="st-label">轮回清算协议</span>
  </div>
  <div class="st-panel"></div>
  <div class="st-raw" style="display:none">$1</div>
<script>
(function(){
'use strict';
const script=document.currentScript,wrap=script&&script.closest('.st-wrapper');if(!wrap)return;
const raw=wrap.querySelector('.st-raw').textContent||'';
const panel=wrap.querySelector('.st-panel'),btn=wrap.querySelector('.st-btn'),label=wrap.querySelector('.st-label');
const GRADES=['F','E','D','C','B','A','S','SS','SSS'];
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function clean(v){return String(v||'').replace(/\*\*/g,'').replace(/^[*_\s]+|[*_\s]+$/g,'').trim()}
function grade(v){const m=String(v||'').toUpperCase().match(/SSS|SS|S|A|B|C|D|E|F/);return m?m[0]:''}
function gradeBadge(v){const all=String(v||'').toUpperCase().match(/SSS|SS|S|A|B|C|D|E|F/g)||[];return all.length?all.map(x=>'<span class="st-rate g-'+x+'">'+x+'</span>').join('<span style="color:#728195">~</span>'):esc(v)}
function deepClone(o){try{return (typeof _!=='undefined'&&_&&_.cloneDeep)?_.cloneDeep(o):JSON.parse(JSON.stringify(o))}catch(e){return o}}
function mvuContext(){
  try{
    const wins=[];try{if(typeof GS_PARENT!=='undefined'&&GS_PARENT)wins.push(GS_PARENT)}catch(e){}try{if(window.parent)wins.push(window.parent)}catch(e){}wins.push(window);
    for(const w of wins){if(w&&w.Mvu&&typeof w.Mvu.getMvuData==='function'){const d=w.Mvu.getMvuData({type:'message',message_id:'latest'});if(d){return{win:w,data:d,stat:d.stat_data||d}}}}
  }catch(e){}
  return null;
}
// 必须在结算清理脚本处理 CHARACTER_MESSAGE_RENDERED 之前尽早拍下数据库任务快照。
const bootCtx=mvuContext();
function trialSnapshot(ctx){
  const stat=ctx&&ctx.stat||{};const list=stat&&stat.任务&&stat.任务.列表&&typeof stat.任务.列表==='object'?stat.任务.列表:{};
  return Object.entries(list).filter(([,t])=>t&&String(t.委托方||'').trim()==='晋升试炼').map(([key,t],idx)=>({
    key:key,name:String(t.名称||t.任务名||t.标题||key||('晋升试炼·'+(idx+1))),status:String(t.状态||'').trim(),reward:t.奖励,penalty:t.惩罚
  }));
}
const trials=trialSnapshot(bootCtx);
const trialPass=trials.length>0&&trials.every(t=>t.status==='可结算');
function commitTrialQualification(){
  if(!trialPass||!bootCtx||!bootCtx.win||!bootCtx.win.Mvu)return false;
  try{
    const c=deepClone(bootCtx.data);const sd=c.stat_data||c;sd.系统状态=sd.系统状态||{};
    if(sd.系统状态.试炼已完成===true)return true;
    sd.系统状态.试炼已完成=true;
    bootCtx.win.Mvu.replaceMvuData(c,{type:'message',message_id:'latest'});
    try{bootCtx.win.Mvu.replaceMvuData(c,{type:'chat'})}catch(e){}
    return true;
  }catch(e){console.warn('[结算美化] 晋升资格写入失败:',e);return false}
}
const trialCommitted=commitTrialQualification();
function trialPanel(){
  if(!trials.length)return '';
  const done=trials.filter(t=>t.status==='可结算').length,pct=Math.round(done/trials.length*100);
  let h='<div class="st-trial '+(trialPass?'':'fail')+'"><div class="st-trial-head"><span class="st-trial-title">◆ 晋升试炼数据库核验</span><span class="st-trial-count">'+done+' / '+trials.length+'</span></div>';
  trials.forEach((t,i)=>{let cls='wait',txt=t.status||'未标记';if(t.status==='可结算'){cls='ok';txt='已完成'}else if(t.status==='失败'){cls='bad';txt='失败'}else if(t.status==='可交付'){txt='待结算'}else if(t.status==='进行中'){txt='未完成'}h+='<div class="st-trial-row"><span class="st-trial-name">'+esc(t.name)+'</span><span class="st-state '+cls+'">'+esc(txt)+'</span></div>'});
  h+='<div class="st-trial-bar"><div class="st-trial-fill" style="width:'+pct+'%"></div></div>';
  h+='<div class="st-trial-verdict '+(trialPass?'ok':'no')+'">'+(trialPass?'✓ 全部试炼已完成，晋升资格已写入数据库。':'✕ 晋升资格未取得：仍有试炼任务未达到【可结算】。')+'</div>';
  h+='<div class="st-trial-source">检定源：stat_data.任务.列表 ｜ 系统状态.试炼已完成='+(trialPass?'true':'保持原值')+(trialPass&&!trialCommitted?'（写入失败）':'')+'</div></div>';return h;
}
function parseHeader(){
  const title=(raw.match(/^###\s*\*{0,2}【?([^\n】]+)】?\*{0,2}/m)||[])[1]||'主神空间 - 轮回清算协议';
  const serial=clean((raw.match(/\[协议序列\]\*{0,2}\s*[：:]\s*([^\n]+)/)||[])[1]||'');
  const player=clean((raw.match(/\[轮回者\]\*{0,2}\s*[：:]\s*([^\n]+)/)||[])[1]||'');return{title,serial,player};
}
function stageType(n){if(/评估|稳定/.test(n))return'assess';if(/烙印|回放|传闻/.test(n))return'story';if(/法则|战利品|遗物/.test(n))return'loot';if(/收益|空间币/.test(n))return'income';return'epilogue'}
function renderLine(line,state){
  const orig=line;line=line.trim();if(!line)return'';
  if(/^<\/?/.test(line)||/^\$\(/.test(line))return'';
  if(/^###/.test(line))return'';
  let body=line.replace(/^\s*[*+-]\s+/,'').trim();
  // 兼容旧回复：即使模型仍吐出旧“晋升试炼任务”面板，也彻底隐藏，由数据库面板接管。
  if(/【?晋升试炼任务】?/.test(clean(body))&&!/晋升试炼[·\.\d一二三四五六七八九十]/.test(body)){state.skipLegacyTrial=true;return''}
  if(state.skipLegacyTrial){if(/失败惩罚执行|个人最终总收益|主神权限凭证|最终阶段/.test(body))state.skipLegacyTrial=false;else return''}
  let m;
  if((m=body.match(/^\*{0,2}副本烙印\s*[｜|]\s*(.+)$/)))return'<div class="st-brand"><small>副 本 烙 印</small><strong>'+esc(clean(m[1]))+'</strong></div>';
  if((m=body.match(/^\*{0,2}[【\[]?([^*【】\[\]：:]{2,24})[】\]]?\*{0,2}\s*[：:]\s*$/))){const n=m[1].trim();state.sub=n;if(/任务专属奖励/.test(n))state.rewardSeen=true;if(/失败惩罚执行/.test(n)&&state.rewardSeen&&!state.trialInserted&&trials.length){state.trialInserted=true;return trialPanel()+'<div class="st-sub">'+esc(n)+'</div>'}return'<div class="st-sub">'+esc(n)+'</div>'}
  if((m=body.match(/^\*{0,2}[【\[]?([^*【】\[\]：:]{1,30})[】\]]?\*{0,2}\s*[：:]\s*(.+)$/))){
    const k=clean(m[1]),v=clean(m[2]);
    if(/总收益/.test(k)){const num=(v.match(/-?[\d,.]+\s*万?/)||[])[0]||v;return'<div class="st-total"><small>个 人 最 终 总 收 益</small><strong>'+esc(num)+' <span style="font-size:.45em">空间币</span></strong></div>'}
    if(/评述/.test(k))return'<div class="st-comment">'+esc(v)+'</div>';
    if(/评级|难度/.test(k)&&grade(v))return'<div class="st-kv"><span class="k">'+esc(k)+'</span><span class="v">'+gradeBadge(v)+'</span></div>';
    if(state.sub&&/失败惩罚/.test(state.sub)&&/强制执行|惩罚|失败/.test(v+k))return'<div class="st-punish">⚠ <b>'+esc(k)+'</b>：'+esc(v)+'</div>';
    let cls='';if(state.sub&&/任务专属奖励/.test(state.sub))cls=/已发放|获得/.test(v)?' good':'';else if(/奖励|收益|合计|上限|计入/.test(k))cls=' gold';
    return'<div class="st-kv'+cls+'"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>';
  }
  const p=clean(body);
  if(!p)return'';
  if(/^【.*完毕.*】$/.test(p))return'<div class="st-close">'+esc(p)+'</div>';
  if(/^【?提示[：:]/.test(p))return'<div class="st-notice">'+esc(p.replace(/^【?提示[：:]?\s*/,'').replace(/】$/,''))+'</div>';
  if(/本次.*(?:无|未).*(?:失败|惩罚|遗物|压缩|获得)/.test(p))return'<div class="st-empty">'+esc(p)+'</div>';
  if(/^\[.+\].*=/.test(p)||/×/.test(p)&&/=/.test(p))return'<div class="st-list">'+esc(p)+'</div>';
  if(/^[-•]/.test(orig.trim())||/^\s{2,}[*+-]/.test(orig))return'<div class="st-list">'+esc(p)+'</div>';
  return'<div class="st-para">'+esc(p)+'</div>';
}
function render(){
  const hd=parseHeader();let h='<div class="st-banner"><div class="st-title">'+esc(hd.title)+'</div><div class="st-tags">';if(hd.serial)h+='<span class="st-tag">协议序列 <b>'+esc(hd.serial)+'</b></span>';if(hd.player)h+='<span class="st-tag">轮回者 <b>'+esc(hd.player)+'</b></span>';h+='</div></div>';
  const lines=raw.replace(/\r/g,'').split('\n');let stage=null,stageHtml='',stageNo=0;const state={sub:'',rewardSeen:false,trialInserted:false,skipLegacyTrial:false};
  function flush(){if(!stage)return;h+='<section class="st-stage t-'+stageType(stage)+'"><div class="st-stage-head"><span class="st-stage-no">'+stageNo+'</span><span class="st-stage-name">'+esc(stage)+'</span><span class="st-stage-line"></span></div>'+stageHtml+'</section>';stageHtml=''}
  lines.forEach(line=>{const sm=line.trim().match(/^####\s*\*{0,2}【?(.+?)】?\*{0,2}\s*$/);if(sm){flush();stage=clean(sm[1]).replace(/^【|】$/g,'');stageNo++;state.sub='';return}if(!stage)return;stageHtml+=renderLine(line,state)});
  if(state.rewardSeen&&!state.trialInserted&&trials.length){stageHtml+=trialPanel();state.trialInserted=true}flush();panel.innerHTML=h;
  const sm=(hd.serial||'').match(/^Ω-(.+)-结算$/);label.textContent=sm?'轮回清算 · '+sm[1]:'轮回清算协议';
}
// 保留原美化器的重要副作用：世界结晶写入道具、世界遗物写入装备。
function settlementItemsToMvu(){
  if(!bootCtx||!bootCtx.win||!bootCtx.win.Mvu)return;
  try{
    const c=deepClone(bootCtx.data),sd=c.stat_data||c;sd.主角=sd.主角||{};sd.主角.道具=sd.主角.道具||{};sd.主角.装备=sd.主角.装备||{};let changed=false;
    const diff=(raw.match(/世界难度评级\*{0,2}\s*[：:]\s*([^\n]+)/)||[])[1]||'';const gs=(String(diff).toUpperCase().match(/SSS|SS|S|A|B|C|D|E|F/g)||[]);let base='F';if(gs.length)base=gs.reduce((a,b)=>GRADES.indexOf(a)<=GRADES.indexOf(b)?a:b);
    const cm=raw.match(/世界结晶[\s\S]*?获得物品\*{0,2}\s*[：:]\s*【([^】]+)】[\s\S]*?类型\*{0,2}\s*[：:]\s*([^\n]+)[\s\S]*?效果\*{0,2}\s*[：:]\s*([^\n]+)[\s\S]*?描述\*{0,2}\s*[：:]\s*([^\n]+)/);
    if(cm&&cm[1]&&!/[{}]|XXX/.test(cm[1])&&!sd.主角.道具[cm[1]]){sd.主角.道具[cm[1]]={品质:base,类型:clean(cm[2])||'纪念物',数量:1,标签:['主神空间'],效果:{因果铭刻:clean(cm[3])},描述:clean(cm[4]),状态:0};changed=true}
    const gm=raw.match(/世界遗物特别嘉奖[\s\S]*?获得[：:]?\s*\n?\s*[>*+-]*\s*【([^】]+)】[\s\S]*?类型[：:]\s*([^\n]+)[\s\S]*?来源[：:]\s*([^\n]+)[\s\S]*?效果[：:]\s*([^\n]+)[\s\S]*?描述[：:]\s*([^\n]+)/);
    if(gm&&gm[1]&&!/[{}]|XXX|未获得/.test(gm[1])&&!sd.主角.装备[gm[1]]){sd.主角.装备[gm[1]]={品质:base,类型:8,标签:['主神空间',clean(gm[3])].filter(Boolean),原始属性:{},效果:{持有时:clean(gm[4])},描述:clean(gm[5]),消耗:'',状态:0};changed=true}
    if(changed){bootCtx.win.Mvu.replaceMvuData(c,{type:'message',message_id:'latest'});try{bootCtx.win.Mvu.replaceMvuData(c,{type:'chat'})}catch(e){}}
  }catch(e){console.warn('[结算美化] 结算物写入失败:',e)}
}
render();settlementItemsToMvu();
btn.addEventListener('click',()=>{btn.classList.toggle('active');panel.classList.toggle('show')});
setTimeout(()=>{document.querySelectorAll('.st-trial-fill').forEach(x=>x.style.width=x.style.width)},50);
})();
