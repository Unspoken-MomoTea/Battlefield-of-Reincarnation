name: one-shot-direct-aux-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, '[direct-aux-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Edit auxiliary files directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          aux_paths = [
              root / 'script' / '辅助计算脚本.js',
              root / 'dist' / 'V20260916' / '辅助计算脚本.js',
          ]

          ui_guard = '''    /**
           * 是否处于“悬浮球UI操作”窗口期。
           * 这里只用于识别合法 UI 字段修改（例如角色进阶），不再承担状态/冷却的回合防重。
           */
          function isUIMutationActive() {
              try {
                  let flagWin = null;
                  try { if (typeof GS_PARENT !== 'undefined' && GS_PARENT) flagWin = GS_PARENT; } catch(e){}
                  if (!flagWin) { try { if (window.parent && window.parent !== window) flagWin = window.parent; } catch(e){} }
                  if (!flagWin) { try { if (window.top && window.top !== window) flagWin = window.top; } catch(e){} }
                  if (!flagWin) flagWin = window;
                  return !!(flagWin && flagWin.__samsaraUIMutation === true);
              } catch (e) {
                  return false;
              }
          }

          '''
          tier_marker = '    /**\n     * 角色层级"普升通行证"校验'
          broken = '            const extraReincarnatorPaths = 旧UI来源守卫'
          fixed = '            const extraReincarnatorPaths = isUIMutationActive()'

          for path in aux_paths:
              text = path.read_text(encoding='utf-8')
              if broken in text:
                  text = text.replace(broken, fixed, 1)
              if 'function isUIMutationActive()' not in text:
                  if tier_marker not in text:
                      raise SystemExit(f'cannot find tier permit insertion marker in {path}')
                  text = text.replace(tier_marker, ui_guard + tier_marker, 1)
              if '旧UI来源守卫' in text:
                  raise SystemExit(f'invalid placeholder remains in {path}')
              if fixed not in text:
                  raise SystemExit(f'UI field guard call missing in {path}')
              combat_start = text.find('    function processCombatAndCooldowns(statData, statDataBefore) {')
              combat_end = text.find('    // 初始化事件注册', combat_start)
              if combat_start < 0 or combat_end < 0:
                  raise SystemExit(f'cannot isolate combat function in {path}')
              combat = text[combat_start:combat_end]
              if 'isUIMutationActive()' in combat:
                  raise SystemExit(f'UI source guard must not control turn/cooldown consumption in {path}')
              path.write_text(text, encoding='utf-8')

          test_path = root / 'tests' / 'asset-harvest-lifecycle.cjs'
          test = test_path.read_text(encoding='utf-8')
          old = "assert.doesNotMatch(source,/isUIMutationActive\\(\\)/,'UI 来源判断不再承担回合防重职责');"
          new = """assert.match(source,/function isUIMutationActive\\(\\)/,'UI 来源识别仍用于合法字段修改守卫');
          const protectedStart=source.indexOf('    function guardProtectedFields');
          const protectedEnd=source.indexOf('    // ===== 属性全量重算',protectedStart);
          const protectedSource=source.slice(protectedStart,protectedEnd);
          assert.match(protectedSource,/const extraReincarnatorPaths = isUIMutationActive\\(\\)/,'UI 来源守卫只用于角色层级保护');
          const combatStart=source.indexOf('    function processCombatAndCooldowns');
          const combatEnd=source.indexOf('    // 初始化事件注册',combatStart);
          const combatSource=source.slice(combatStart,combatEnd);
          assert.doesNotMatch(combatSource,/isUIMutationActive\\(\\)/,'状态/冷却防重只由正文楼层负责');"""
          if old not in test:
              raise SystemExit('obsolete UI-guard assertion not found')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')

          workflow_block = '''      - name: Deduplicate consuming turns by assistant message
                  run: |
                    legacy="__samsara""WorldCommit"
                    if grep -q "let lastTurnMessageKey = ''" script/辅助计算脚本.js \\
                      && ! grep -R "$legacy" script tests --exclude-dir=.git; then
                      echo "message-level turn deduplication already synchronized"
                    else
                      python tools/patch-aux-turn-message-dedup.py
                    fi
                - name: Remove obsolete helper UI turn guard
                  run: python tools/patch-aux-ui-mutation-cleanup.py
          '''
          # The YAML files use the same logical block but standard 6/8-space indentation.
          workflow_block = workflow_block.replace('              run:', '        run:').replace('                legacy=', '          legacy=').replace('                if ', '          if ').replace('                  && ', '            && ').replace('                  echo ', '            echo ').replace('                else', '          else').replace('                  python ', '            python ').replace('                fi', '          fi').replace('              - name:', '      - name:').replace('                run:', '        run:')
          for wf_name in ['task-awareness-build.yml', 'task-awareness-check.yml']:
              wf = root / '.github' / 'workflows' / wf_name
              text = wf.read_text(encoding='utf-8')
              if workflow_block not in text:
                  raise SystemExit(f'aux patch workflow block not found in {wf_name}')
              wf.write_text(text.replace(workflow_block, '', 1), encoding='utf-8')

          for tool in [
              root / 'tools' / 'patch-aux-ui-mutation-cleanup.py',
              root / 'tools' / 'patch-aux-turn-message-dedup.py',
              root / 'tools' / 'patch-aux-world-commit-flow.py',
          ]:
              if tool.exists():
                  tool.unlink()
          PY

          rm .github/workflows/one-shot-direct-aux-fix.yml

      - name: Verify direct auxiliary fix
        shell: bash
        run: |
          node --check script/辅助计算脚本.js
          node --check dist/V20260916/辅助计算脚本.js
          node tests/asset-harvest-lifecycle.cjs
          node tests/trial-promotion-flow.cjs
          node tests/statusbar-settlement-topbar.cjs
          ! grep -R "旧UI来源守卫" script dist tests
          ! grep -R "patch-aux-" .github/workflows tools --exclude-dir=.git
          cmp -s script/辅助计算脚本.js dist/V20260916/辅助计算脚本.js

      - name: Commit direct edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore UI field guard directly [task-awareness-built]"
          git push
