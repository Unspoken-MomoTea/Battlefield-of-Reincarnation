name: Patch settlement credential autogrant

on:
  push:
    paths:
      - '.github/workflows/settlement-cert-autogrant.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_settlement_cert.py

      - name: Check settlement renderer syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('Regular/结算任务美化.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert scripts
          Path('/tmp/settlement-renderer.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/settlement-renderer.js

      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/settlement-cert-autogrant.yml .github/scripts/patch_settlement_cert.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "move settlement credentials to renderer"
          git push
