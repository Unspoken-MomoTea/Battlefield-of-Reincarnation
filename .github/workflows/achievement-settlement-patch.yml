            var starText=stars?'★'.repeat(stars):(r.diff||'—');
            var gm=String(r.reward||'').toUpperCase().match(/(SSS|SS|S|A|B|C|D|E|F)\s*级盲盒/);
            html+='<div class="ac-item'+(isDone?' done':'')+'">';
            html+='<div class="ac-stars">'+esc(starText)+'</div><div class="ac-main"><div class="ac-name">'+esc(r.name||('成就 '+r.no))+'</div>';
            if(r.desc) html+='<div class="ac-desc">'+esc(r.desc)+'</div>';
            if(r.reward) html+='<div class="ac-reward">🎁 '+(gm?'<span class="ac-grade">'+esc(gm[1])+'</span>':'')+esc(r.reward)+'</div>';
            html+='</div><div class="ac-state '+(isDone?'ok':'no')+'">'+(isDone?'已达成':'未达成')+'</div></div>';
          });
          html+='</div>';
          html+='<div class="ac-foot">'+(done>0?'本次达成 <b>'+done+'</b> 项成就，对应盲盒已统一发送至玩家背包。':'本次未达成副本成就，无成就盲盒发放。')+'</div>';
        }else html+='<div class="ac-empty">未检测到副本成就记录。</div>';
        panel.innerHTML=html;
        btn.addEventListener('click',function(){btn.classList.toggle('active');panel.classList.toggle('show');});
