name: fix-shop-credential-indent
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-test-commit:
    if: ${{ contains(github.event.head_commit.message, '[fix-shop-credential-indent]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align rollback indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script/悬浮球状态栏.js')
          s = p.read_bytes().decode('utf-8')
          nl = '\r\n' if '\r\n' in s else '\n'
          old = (
              '                            statData.角色.空间币 = safeNum(statData.角色.空间币, 0) + bloodFusionSnap.price;' + nl +
              '                        statData.角色.权限凭证 = statData.角色.权限凭证 || {};' + nl +
              '                        shopCredentialRefund(statData.角色.权限凭证, bloodFusionSnap.credentialRequirements || {});' + nl +
              '                            if (bloodFusionSnap.preBloodLib !== null && statData.商城) {'
          )
          new = (
              '                            statData.角色.空间币 = safeNum(statData.角色.空间币, 0) + bloodFusionSnap.price;' + nl +
              '                            statData.角色.权限凭证 = statData.角色.权限凭证 || {};' + nl +
              '                            shopCredentialRefund(statData.角色.权限凭证, bloodFusionSnap.credentialRequirements || {});' + nl +
              '                            if (bloodFusionSnap.preBloodLib !== null && statData.商城) {'
          )
          if s.count(old) != 1:
              raise SystemExit(f'expected one indentation anchor, got {s.count(old)}')
          p.write_bytes(s.replace(old, new, 1).encode('utf-8'))
          PY
      - name: Validate
        run: |
          node --check script/悬浮球状态栏.js
          node tests/shop-permission-guard.cjs
          node tests/credential-ledger-integration.cjs
          node tests/shop-credential-spend.cjs
          git -c core.whitespace=cr-at-eol diff --check -- script/悬浮球状态栏.js
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-shop-credential-indent.yml
          git add script/悬浮球状态栏.js
          git commit -m "style: align shop credential rollback indentation"
          git push
