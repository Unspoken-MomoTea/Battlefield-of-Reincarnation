---
阵营-织梦者 (羁绊与灵魂):
    核心理念: 于虚空织梦，万物皆可缔约
    核心风格:
      - 因果交易
      - 认知操控
      - 命运干涉
      - 信息与规则利用
    战术倾向:
      - 信息欺骗
      - 身份伪装
      - 环境污染
      - 精神误导
    行为铁律:
      - 能让别人替自己完成，就绝不亲自出手
      - 优先保持信息优势，让第三方互斗
      - 身份或核心能力暴露时，优先更换媒介、位置或目标
    核心特征:
      - 行动方式最难预测
      - 擅长幕后布局与精神层面影响
      - 常接触异常与禁忌领域
    行事准则: 善于与剧情人物建立深厚羁绊，视契约物为禁脔，若伙伴死亡会不计代价复仇
    主神形态: 温和暖色光球，随审美流转
    空间描述: 个人专属独立空间"梦境花园"，初始公寓，可扩展为别墅、庄园、城堡
    兑换限制: 无限制
    专属能力:
      梦境契约:
        自愿缔结:
          描述: 与目标建立平等伙伴关系
          条件: 目标好感度达到100且主观同意
          羁绊任务效果: 完成专属羁绊任务后，缔约费用永久降低90%
          基础费用:
            Ⅰ级: 100(优惠后10)
            Ⅱ级: 800(优惠后80)
            Ⅲ级: 4000(优惠后400)
            Ⅳ级: 20000(优惠后2000)
            Ⅴ级: 80000(优惠后8000)
            Ⅵ级: 320000(优惠后32000)
            Ⅶ级: 1280000(优惠后128000)
            Ⅷ级: 5120000(优惠后512000)
            Ⅸ级: 20480000(优惠后2048000)
        强制奴役:
          描述: 将目标转化为绝对服从的傀儡
          条件: 目标失去战斗力或无法反抗，支付足额费用
          基础费用:
            Ⅰ级: 50
            Ⅱ级: 400
            Ⅲ级: 2000
            Ⅳ级: 10000
            Ⅴ级: 40000
            Ⅵ级: 160000
            Ⅶ级: 640000
            Ⅷ级: 2560000
            Ⅸ级: 10240000
      羁绊系统:
        组合技能: 特定伙伴组合可解锁专属组合技
        羁绊加成: 伙伴好感度越高，越易触发自动援护、连携攻击等效果
    阵营设施:
      梦境花园(家园系统):
        描述: 私人位面，契约伙伴的居所
        建筑:
          温泉: 消耗5000空间币，下次任务获得一个随机正面增益
          训练室: 消耗10000空间币，伙伴自主训练，小概率提升属性
          图书馆: 消耗8000空间币，提升伙伴间特殊互动事件概率
        扩建费用:
          小型公寓→中型别墅: 20000空间币
          中型别墅→大型庄园: 100000空间币
          大型庄园→梦境城堡: 500000空间币
