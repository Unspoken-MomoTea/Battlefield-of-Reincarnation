name: opening-preview-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, '[deploy opening preview]') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Cloudflare deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::缺少 GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::缺少 GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      - name: Opening delivery synchronized
        run: python tools/build-opening.py --check

      - name: Opening and Worker contract tests
        run: |
          node --test src/opening/tests/*.test.mjs
          node tests/opening-page.cjs
          cd cloudflare
          npm test

      - name: Syntax checks
        run: |
          find src/opening -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find cloudflare/src -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate production Worker deployment
        working-directory: cloudflare
        run: npx wrangler deploy --env production --dry-run

      - name: Deploy production Worker preview endpoint
        working-directory: cloudflare
        run: npx wrangler deploy --env production

      - name: Verify production remains Workshop stable and Opening follows main
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://workshop.6661816.xyz';

          async function retry(label, fn) {
            let last;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try { return await fn(); }
              catch (error) {
                last = error;
                console.log(`${label} attempt ${attempt}/8 failed: ${error.message}`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            throw last;
          }

          await retry('health', async () => {
            const response = await fetch(`${base}/api/health`, { signal: AbortSignal.timeout(10000) });
            const body = await response.json();
            if (!response.ok || body.ok !== true || body.update_channel !== 'stable' || body.update_ref !== 'workshop-stable') {
              throw new Error(`unexpected health response: ${response.status} ${JSON.stringify(body)}`);
            }
          });

          const opening = await retry('opening latest', async () => {
            const response = await fetch(`${base}/opening/latest`, {
              redirect: 'manual',
              cache: 'no-store',
              signal: AbortSignal.timeout(10000),
            });
            const location = response.headers.get('location') || '';
            if (response.status !== 302) throw new Error(`unexpected status: ${response.status}`);
            if (response.headers.get('x-opening-channel') !== 'testing') {
              throw new Error(`unexpected opening channel: ${response.headers.get('x-opening-channel')}`);
            }
            if (response.headers.get('x-opening-ref') !== 'main') {
              throw new Error(`unexpected opening ref: ${response.headers.get('x-opening-ref')}`);
            }
            if (!/@[0-9a-f]{40}\/dist\/opening\/entry\.html\?v=/u.test(location)) {
              throw new Error(`unexpected opening location: ${location}`);
            }
            return { response, location };
          });

          const html = await retry('opening html', async () => {
            const response = await fetch(opening.location, {
              cache: 'no-store',
              signal: AbortSignal.timeout(15000),
            });
            const text = await response.text();
            if (!response.ok || !text.startsWith('<!DOCTYPE html>') || !text.includes('class="wizard-layout"') || !text.includes('executeJourney')) {
              throw new Error(`unexpected opening HTML: ${response.status}, length=${text.length}`);
            }
            return text;
          });

          console.log('Opening preview passed:', opening.location, 'bytes=', html.length);
          NODE
