name: deploy-workshop-staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: workshop-staging
      url: https://workshop-test.6661816.xyz
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 GitHub Secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 GitHub Secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify main branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "::error::测试服只允许从 main 部署"
            exit 1
          }
          echo "Deploying $GITHUB_SHA to workshop staging"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      - name: Worker contract tests
        working-directory: cloudflare
        run: npm test

      - name: Client contract tests
        run: node --test src/CreativeWorkshop/tests/*.test.mjs

      - name: Syntax checks
        shell: bash
        run: |
          find cloudflare/src -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find cloudflare/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
          find src/CreativeWorkshop -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate staging deployment
        working-directory: cloudflare
        run: npx wrangler deploy --env staging --dry-run

      - name: Apply staging D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --env staging --remote

      - name: Deploy staging Worker
        working-directory: cloudflare
        run: npx wrangler deploy --env staging

      - name: Health check
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://workshop-test.6661816.xyz/api/health';
          let lastError;
          for (let attempt = 1; attempt <= 6; attempt += 1) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
              const health = await response.json();
              if (
                response.ok
                && health.ok === true
                && health.update_channel === 'testing'
                && health.update_ref === 'main'
              ) {
                console.log('Staging health check passed:', health);
                process.exit(0);
              }
              lastError = new Error(`unexpected health response: ${response.status} ${JSON.stringify(health)}`);
            } catch (error) {
              lastError = error;
            }
            console.log(`Health check attempt ${attempt}/6 failed; retrying...`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw lastError;
          NODE
