name: task-awareness-build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[task-awareness-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Polish settlement prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('World Book/【结算任务】[mvu_plot].txt')
          text = p.read_text(encoding='utf-8')
          replacements = {
            '    - 失败惩罚执行铁律: 若参与结算的主神任务中存在【状态: 失败】或未完成任务，必须强制读取该任务的【惩罚】字段。若惩罚为扣除空间币，必须提取数值并在最终总收益中做减法（允许结算总收益为负数负债）；若为属性扣除或抹杀等非货币惩罚，必须在面板中显式宣告执行':
            '    - 失败惩罚: 本次失败或未完成任务必须执行【惩罚】；空间币惩罚计入扣除，其他惩罚在面板宣告',
            '    - 世界探索附加收益 = 【奖励基准评级对应基础奖励】 × 【总探索度%】。总额上限: 【奖励基准评级对应基础奖励】 × 300%。':
            '    - 世界探索附加收益 = 【世界难度最低评级基础奖励】 × 【总探索度%】，上限300%。',
            '    - 单一世界不结算世界探索与势力羁绊附加收益；两者只作为当前世界的长期资料继续保留。':
            '    - 当前清算不结算世界探索与势力羁绊附加收益；两者仅作为长期资料保留。',
            '    - 任务专属奖励 = 提取【可结算】主神任务中尚未发放的专属奖励，逐项单独核算，不重复计入其他收益':
            '    - 任务专属奖励 = 仅提取本次成功任务中尚未发放的专属奖励',
            '    - 失败任务惩罚扣除 = 提取【失败】主神任务中明确注明的空间币惩罚数值':
            '    - 失败/未完成惩罚 = 执行对应任务惩罚；空间币惩罚计入扣除',
            '    - 惩罚核查：扫描是否存在【状态: 失败】的主神任务，量化需要扣除的空间币数值，提取需要执行的恶性惩罚（如属性品质下降）':
            '    - 惩罚核查：读取失败/未完成任务的惩罚，计算空间币扣除并提取其他惩罚',
            '* **系统评述**: {简评<user>本次结算周期内对世界线的影响，说明打分理由}':
            '* **系统评述**: {简评本次任务成果与世界影响}',
            '    $(若 stat_data.世界.探索.地点名.探索度 > 0 则输出: * {基础奖励数值} × [地点名] ({{get_message_variable::stat_data.世界.探索.地点名.探索度}}%) = {总额})':
            '    $(若 stat_data.世界.探索.地点名.探索度 > 0 则输出: * <%= reputationBase %> × [地点名] ({{get_message_variable::stat_data.世界.探索.地点名.探索度}}%) = {总额})',
            '    * **探索奖励上限**: **{基础奖励数值 × 300%}** 空间币':
            '    * **探索奖励上限**: **<%= reputationBase * 3 %>** 空间币',
            '* **个人最终总收益**: **【 {以上各项收益相加总和 - 失败任务扣除数值 的精确结果} 空间币 】** 已清算完毕。$(若为负数，加注：余额不足，账户进入负债状态，脱离主神空间前需强制偿还)':
            '* **个人最终总收益**: **【 {以上各项收益相加总和 - 失败/未完成任务扣除数值 的精确结果} 空间币 】** 已清算完毕。$(若为负数，加注：余额不足，账户进入负债状态，脱离主神空间前需强制偿还)'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('prompt polish anchor missing: ' + old[:80])
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          t = Path('tests/task-performance-settlement.cjs')
          test = t.read_text(encoding='utf-8')
          anchor = "assert.match(prompt, /失败\\/未完成惩罚/);\n"
          extra = "assert.doesNotMatch(prompt, /任务完成率与世界稳定值核算|奖励基准评级对应基础奖励|单一世界不结算/);\nassert.match(prompt, /任务专属奖励 = 仅提取本次成功任务/);\nassert.match(prompt, /世界难度最低评级基础奖励/);\n"
          if extra not in test:
              if anchor not in test:
                  raise SystemExit('test polish anchor missing')
              test = test.replace(anchor, anchor + extra, 1)
              t.write_text(test, encoding='utf-8', newline='\n')
          PY
      - name: Task performance settlement regression
        run: node tests/task-performance-settlement.cjs
      - name: Existing world-engine regressions
        run: |
          node tests/world-engine-superstable-prompt.cjs
          node tests/world-engine-task-awareness.cjs
          node tests/world-engine-chronology-guard.cjs
          node tests/world-engine-npc-audit-toggle.cjs
          node tests/world-engine-modules.cjs
      - name: Commit prompt polish
        run: |
          if git diff --quiet -- "World Book/【结算任务】[mvu_plot].txt" tests/task-performance-settlement.cjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "World Book/【结算任务】[mvu_plot].txt" tests/task-performance-settlement.cjs
          git commit -m "refactor: align task settlement wording [task-awareness-built]"
          git push
