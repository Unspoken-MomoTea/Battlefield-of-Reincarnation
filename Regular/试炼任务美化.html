<body>
  <!-- 替换模板开始 -->
  <div class="tq-wrap">
    <div class="tq-toggle" role="button" tabindex="0">
      <svg class="tq-icon" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5.1-3.4 9.7-8 11-4.6-1.3-8-5.9-8-11V5l8-3zm0 4.1L8 7.6v3.1c0 3.4 1.8 6.5 4 7.6 2.2-1.1 4-4.2 4-7.6V7.6l-4-1.5zm-1 2.4h2v4h-2v-4zm0 5.5h2v2h-2v-2z"/></svg>
      <span class="tq-label"></span>
      <span class="tq-arrow">⌄</span>
    </div>
    <div class="tq-panel"></div>
    <div class="tq-raw" style="display:none;">$1</div>
    <script>
      (function() {
        'use strict';
        const script = document.currentScript;
        if (!script) return;
        const wrapper = script.closest('.tq-wrap');
        if (!wrapper) return;

        const toggle = wrapper.querySelector('.tq-toggle');
        const panel = wrapper.querySelector('.tq-panel');
        const raw = wrapper.querySelector('.tq-raw');
        const label = wrapper.querySelector('.tq-label');
        if (!toggle || !panel || !raw) return;

        const TIERS = ['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ'];
        const GRADES = ['F','E','D','C','B','A','S','SS','SSS'];
        function esc(value) {
          const amp = '&';
          return String(value == null ? '' : value)
            .replace(/&/g,amp+'amp;').replace(/</g,amp+'lt;').replace(/>/g,amp+'gt;')
            .replace(/"/g,amp+'quot;').replace(/'/g,amp+'#39;');
        }
        function clean(value) {
          return String(value == null ? '' : value).trim().replace(/^\*+|\*+$/g,'').trim();
        }
        function rawTextOf(element) {
          const amp = '&';
          return String(element && (element.innerHTML || element.textContent) || '')
            .replace(/<br\s*\/?>/gi,'\n')
            .replace(/<\/(?:p|div|li)>/gi,'\n')
            .replace(/<[^>]*>/g,'')
            .replace(new RegExp(amp+'nbsp;','gi'),' ')
            .replace(new RegExp(amp+'amp;','gi'),'&')
            .replace(new RegExp(amp+'lt;','gi'),'<')
            .replace(new RegExp(amp+'gt;','gi'),'>')
            .replace(new RegExp(amp+'quot;','gi'),'"')
            .replace(new RegExp(amp+'#39;','gi'),"'");
        }
        function gradeOf(value) {
          const m = String(value || '').toUpperCase().match(/SSS|SS|S|A|B|C|D|E|F/);
          return m ? m[0] : '';
        }
        function rankOf(value) {
          const m = String(value || '').match(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨ]/);
          return m ? m[0] : '';
        }
        function splitAlienEntries(text) {
          const entries = [];
          let current = '', depth = 0;
          String(text || '').split('').forEach(function(ch) {
            if (ch === '〔') depth++;
            if ((ch === '，' || ch === ',' || ch === '；' || ch === ';') && depth === 0) {
              if (current.trim()) entries.push(current.trim());
              current = '';
              return;
            }
            current += ch;
            if (ch === '〕' && depth > 0) depth--;
          });
          if (current.trim()) entries.push(current.trim());
          return entries;
        }
        function parseAliens(text) {
          if (/^(?:无|无异端|0\s*人?)$/.test(String(text || '').trim())) return [];
          return splitAlienEntries(text).map(function(rawEntry) {
            const m = rawEntry.match(/^[【\[]([^】\]]+)[】\]]\s*[\[【]([^\]】]+)[\]】]\s*(.+?)\s*[（(]([^）)]+)[）)]\s*$/);
            if (!m) return null;
            const details = m[3].trim().match(/^(.*?)\s*〔\s*来源\s*[:：]\s*(.*?)\s*[|｜]\s*经历\s*[:：]\s*(.*?)\s*〕\s*$/);
            const rank = rankOf(m[4]);
            if (!details || !rank) return null;
            return { faction:m[1].trim(), job:m[2].trim(), name:details[1].trim(), source:details[2].trim(), experience:details[3].trim(), rank:rank };
          }).filter(Boolean);
        }
        function parseTrial(text) {
          const out = { mode:'', status:'', applicant:'', current:'', target:'', grade:'', reason:'', world:{}, scene:{}, tasks:[], achievements:[], stage:'', storyline:'', aliensText:'', aliens:[] };
          let section = '', curTask = null;
          const worldKeys = ['名称','世界位格','主模块','副模块','生态','副本难度','时间锚点','干涉模式','主线状态','世界法则','切入身份'];
          const sceneKeys = ['世界名称','异象锚点','局势变化','试炼干涉'];
          String(text || '').replace(/\r/g,'').split('\n').forEach(function(sourceLine) {
            let line = sourceLine.trim().replace(/^>\s*/, '').trim();
            if (!line) return;
            if (/^<试炼世界>$/i.test(line)) { section = 'world'; return; }
            if (/^<试炼现场>$/i.test(line)) { section = 'scene'; return; }
            if (/^<试炼任务列表>$/i.test(line)) { section = 'tasks'; return; }
            if (/^<试炼成就列表>$/i.test(line)) { section = 'achievements'; return; }
            if (/^<晋升任务>$/i.test(line)) {
              section = 'legacyTask';
              curTask = { label:'任务一', diff:'', name:'', desc:'', reward:'', punish:'', target:'', limit:'' };
              out.tasks.push(curTask);
              return;
            }
            if (/^<异端名单>$/i.test(line)) { section = 'aliens'; return; }
            if (/^<\/(?:试炼世界|试炼现场|试炼任务列表|试炼成就列表|晋升任务|异端名单)>$/i.test(line)) { section = ''; curTask = null; return; }

            let tm = line.match(/^任务([一二三四五六七八九十\d]+)?\s*[（(]\s*难度[：:]\s*([^）)]+)[）)]\s*$/);
            if (tm) {
              section = 'tasks';
              curTask = { label:'任务'+(tm[1] || out.tasks.length + 1), diff:gradeOf(tm[2]), name:'', desc:'', reward:'', punish:'' };
              out.tasks.push(curTask);
              return;
            }
            let am = line.match(/^(★+)\s*[-—–]\s*(.+)$/);
            if (am) {
              section = 'achievements';
              const rest = am[2].trim();
              let parts = rest.split(/\s*\|\s*/);
              const left = (parts.shift() || '').trim();
              const nm = left.match(/^\[?([^\]：:]+)\]?\s*[：:]\s*(.*)$/);
              let reward = parts.join(' | ').replace(/^\s*奖励\s*[：:]\s*/, '').trim();
              out.achievements.push({ stars:Math.min(6,am[1].length), name:nm ? nm[1].trim() : left, desc:nm ? nm[2].trim() : '', reward:reward, grade:gradeOf(reward) });
              return;
            }

            const m = line.match(/^(?:[-*]\s*)?(?:\[([^\]]+)\]|([^：:]+))[：:]\s*(.*)$/);
            if (!m) return;
            const key = clean(m[1] || m[2]);
            const value = clean(m[3]);
            if (section === 'world' || (!curTask && worldKeys.includes(key))) { out.world[key] = value; return; }
            if (section === 'scene' || (!curTask && sceneKeys.includes(key))) { out.scene[key] = value; return; }
            if ((section === 'tasks' || section === 'legacyTask') && curTask) {
              if (key === '名称') { curTask.name = value; return; }
              if (key === '描述') { curTask.desc = value; return; }
              if (key === '奖励') { curTask.reward = value; return; }
              if (key === '惩罚') { curTask.punish = value; return; }
              if (key === '难度') { curTask.diff = gradeOf(value); return; }
              if (key === '目标') { curTask.target = value; return; }
              if (key === '绝对限制') { curTask.limit = value; return; }
            }
            if (key === '当前阶段') { out.stage = value; return; }
            if (key === '故事线') { out.storyline = value; return; }
            if (key === '异端') { out.aliensText = value; return; }
            if (key === '模式') out.mode = value;
            else if (key === '状态') out.status = value;
            else if (key === '申请人') out.applicant = value;
            else if (key === '当前层级') out.current = rankOf(value) || value;
            else if (key === '目标层级') out.target = rankOf(value) || value;
            else if (key === '目标品质') out.grade = gradeOf(value) || value;
            else if (key === '拒绝原因') out.reason = value;
          });
          out.tasks.forEach(function(task){
            if (!task.desc && task.target) task.desc = task.target + (task.limit ? '｜绝对限制：'+task.limit : '');
          });
          out.aliens = parseAliens(out.aliensText);
          return out;
        }
        function field(labelText, value, wide) {
          if (!value) return '';
          return '<div class="tq-field'+(wide?' wide':'')+'"><div class="tq-k">'+esc(labelText)+'</div><div class="tq-v">'+esc(value)+'</div></div>';
        }
        function lawsHtml(value) {
          const laws = String(value || '').split(/[;；]\s*/).map(function(x){return x.trim();}).filter(Boolean);
          if (!laws.length) return '';
          return '<div class="tq-field wide"><div class="tq-k">世界法则</div><div class="tq-laws">'+laws.map(function(x){return '<div class="tq-law">'+esc(x)+'</div>';}).join('')+'</div></div>';
        }
        function expectedData(q) {
          const curIdx = TIERS.indexOf(q.current);
          const targetIdx = curIdx >= 0 ? Math.min(8, curIdx + 1) : -1;
          const single = q.mode === '单一世界';
          const ecology = String(q.world.生态 || '').trim();
          const upperStep = single ? 1 : (ecology === '无异端' ? 1 : 2);
          const upperIdx = targetIdx >= 0 ? Math.min(8, targetIdx + upperStep) : -1;
          const taskCount = single ? 1 : (ecology === '无异端' ? 2 : ecology === '死斗局' ? 3 : ecology === '混沌局' ? 5 : 0);
          const bases = [100,500,2500,12000,50000,200000,800000,3200000,12800000];
          const rewardPool = targetIdx >= 0 ? bases[targetIdx] : 0;
          const gradeIndexes = Array.from({length:taskCount},function(_,idx){
            if (taskCount === 1) return upperIdx;
            return Math.round(targetIdx+(upperIdx-targetIdx)*idx/(taskCount-1));
          });
          const weights = gradeIndexes.map(function(index){return Math.max(1,index-targetIdx+1);});
          const weightSum = weights.reduce(function(sum,value){return sum+value;},0);

            set(c,'stat_data.世界.货币',{体系:'',购买力基准:'',经济波动:''});
            set(c,'stat_data.世界.探索',{});
            set(c,'stat_data.世界.势力',{});
            set(c,'stat_data.世界.因果轨道.当前阶段',q.stage || q.world.主线状态 || '试炼投放');
            set(c,'stat_data.世界.因果轨道.故事线',q.storyline || q.world.主线状态 || '试炼投放');
            set(c,'stat_data.世界.因果轨道.下一节点',(q.tasks[0] && q.tasks[0].desc) || '完成晋升试炼');
            set(c,'stat_data.世界.因果轨道.偏移记录',{});
            set(c,'stat_data.世界.异端雷达.当前模式',stripExpectedCount(q.world.干涉模式));
            const roster = {};
            q.aliens.forEach(function(a){ roster[a.name]={来源:a.source,经历:a.experience,阵营:a.faction,职业:a.job,层级:a.rank,状态:'活跃'}; });
            set(c,'stat_data.世界.异端雷达.名单',roster);
            set(c,'stat_data.任务.副本成就',{});
            const worldName = String(q.world.名称 || '晋升试炼').replace(/[【】《》]/g,'').trim() || '晋升试炼';
            q.achievements.forEach(function(item,index){
              const achPath = ['stat_data','任务','副本成就',item.name || ('试炼成就'+(index+1))];
              set(c,achPath.concat('说明'),item.desc || '完成对应试炼挑战');
              set(c,achPath.concat('难度'),'★'.repeat(index+1));
              set(c,achPath.concat('奖励'),(ex.achievementGrades[index] || 'F')+'级盲盒·'+worldName);
              set(c,achPath.concat('状态'),'未达成');
            });
          }

          // 快照取自试炼美化器已经完成全部赋值的 c；同层额外AI变量更新无法复制或改写任务。
          installTaskGenerationLock(win, c, '晋升试炼美化');
          win.Mvu.replaceMvuData(c,{type:'message',message_id:'latest'});
          try { win.Mvu.replaceMvuData(c,{type:'chat'}); } catch(e) {}

          return true;
        }

        const rawText = rawTextOf(raw);
        const q = parseTrial(rawText);
        normalizeLockedTrialData(q);
        const errors = validate(q);
        const trialName = q.mode === '轮回试炼' ? q.world.名称 : q.scene.世界名称;
        label.textContent = q.status === '允许' ? ('晋升试炼 · '+(trialName || q.target || '载入中')) : '晋升试炼 · 申请驳回';
        panel.innerHTML = render(q,errors);
        if (q.status !== '允许') { toggle.classList.add('active'); panel.classList.add('show'); }
        function togglePanel() {
          toggle.classList.toggle('active');
          panel.classList.toggle('show');
        }
        toggle.addEventListener('click',togglePanel);
        toggle.addEventListener('keydown',function(event){
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); togglePanel(); }
        });
        if (q.status === '允许' && !errors.length) activate(q);
      })();
    </script>
  </div>
