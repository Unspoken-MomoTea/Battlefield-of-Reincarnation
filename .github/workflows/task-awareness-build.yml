name: task-awareness-build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[task-awareness-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync variable prompt world time ownership
        run: python tools/patch-world-time-ownership.py
      - name: Remove world request size cap
        run: python tools/patch-world-request-size-cap.py
      - name: Sync settlement character lifecycle
        run: python tools/patch-settlement-character-lifecycle.py
      - name: Sync hidden trial task identity
        run: |
          if grep -q "试炼任务名单: safeTags" script/ZOD脚本.js \
            && grep -q "试炼任务名单',trialTaskNames" "Regular/试炼任务美化.html" \
            && grep -q "function settlementTaskKeysForData(data)" "Regular/结算任务美化.html" \
            && grep -q "setValue(sys, '试炼任务名单', \[\])" "Regular/结算任务美化.html"; then
            echo "hidden trial task identity already synchronized"
          else
            python tools/patch-trial-task-identity.py
          fi
      - name: Sync legacy trial task identity
        run: python tools/patch-trial-task-legacy-compat.py
      - name: Sync settlement coin balance baseline
        run: python tools/patch-settlement-coin-baseline.py
      - name: Sync task-independent settlement coin accounting
        run: python tools/patch-settlement-coin-task-independence.py
      - name: Sync settlement snapshot follow-up
        run: python tools/patch-settlement-snapshot-followup.py
      - name: Sync hierarchical world history memory
        run: python tools/patch-world-history-memory.py
      - name: Fold history leaves into world commit
        run: python tools/patch-history-per-advance-commit.py
      - name: Persist replay with primary world write
        run: python tools/patch-world-replay-single-write.py
      - name: Build delivery
        run: python tools/build-world-engine.py
      - name: Resolve Tavern player asset ownership directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # RED：结算必须识别酒馆真实玩家名，而不是只认字面 <user>。
          replace_once(
              'tests/task-settlement-simplified.cjs',
              "        玩家庄园: { 所属对象: ['<user>'], 类型: '固定地产' },\n        共管基地: { 所属对象: ['盟友', '<user>'], 类型: '要塞' },",
              "        玩家庄园: { 所属对象: ['测试玩家'], 类型: '固定地产' },\n        共管基地: { 所属对象: ['盟友', '测试玩家'], 类型: '要塞' },",
              'settlement fixture actual player name'
          )
          replace_once(
              'tests/task-settlement-simplified.cjs',
              "const ordinaryFinalize = makeSettlementFinalizeData(false);\nassert.equal(applySettlementFinalization(ordinaryFinalize, true), true);",
              "const previousSettlementWindow = global.window;\nglobal.window = { parent: { SillyTavern: { name1: '测试玩家' } } };\nconst ordinaryFinalize = makeSettlementFinalizeData(false);\nassert.equal(applySettlementFinalization(ordinaryFinalize, true), true);",
              'settlement runtime identity setup'
          )
          replace_once(
              'tests/task-settlement-simplified.cjs',
              "assert.equal(ordinaryFinalize.stat_data.系统状态.是否在主神空间, true);\nconst singleFinalize = makeSettlementFinalizeData(true);",
              "assert.equal(ordinaryFinalize.stat_data.系统状态.是否在主神空间, true);\nif (previousSettlementWindow === undefined) delete global.window;\nelse global.window = previousSettlementWindow;\nconst singleFinalize = makeSettlementFinalizeData(true);",
              'settlement runtime identity cleanup'
          )

          multi = Path('tests/world-engine-asset-multi-owner.cjs')
          text = multi.read_text(encoding='utf-8')
          text = text.replace(
              "// 直接执行辅助脚本中的两个纯函数，锁定“只有字面 <user> 才收菜”与删除墓碑行为。",
              "// 直接执行辅助脚本中的纯函数：真实 Tavern 玩家名与旧玩家标记都必须识别为玩家资产。",
              1
          )
          text = text.replace(
              "const isPlayerOwnedAsset = new Function(helper.slice(ownerStart, ownerEnd) + ';return isPlayerOwnedAsset;')();\nassert.equal(isPlayerOwnedAsset({所属对象:['<user>','白银之手']}), true);\nassert.equal(isPlayerOwnedAsset({所属对象:['玩家']}), false);\nassert.equal(isPlayerOwnedAsset({所属对象:['{{user}}']}), false);\nassert.equal(isPlayerOwnedAsset({所属对象:[]}), false);",
              "const isPlayerOwnedAsset = new Function(helper.slice(ownerStart, ownerEnd) + ';return isPlayerOwnedAsset;')();\nconst previousOwnerWindow = global.window;\nglobal.window = { parent: { SillyTavern: { name1: '测试玩家' } } };\nassert.equal(isPlayerOwnedAsset({所属对象:['测试玩家','白银之手']}), true);\nassert.equal(isPlayerOwnedAsset({所属对象:['<user>','白银之手']}), true);\nassert.equal(isPlayerOwnedAsset({所属对象:['玩家']}), true);\nassert.equal(isPlayerOwnedAsset({所属对象:['{{user}}']}), true);\nassert.equal(isPlayerOwnedAsset({所属对象:[]}), false);",
              1
          )
          text = text.replace(
              "assert.equal(isPlayerOwnedAsset({}), false, '新语义下缺失归属不能直接触发自动收菜；旧数据由 ZOD 迁移为 [<user>]');",
              "assert.equal(isPlayerOwnedAsset({}), false, '缺失归属不能直接触发自动收菜；旧数据由 ZOD 迁移');\nif (previousOwnerWindow === undefined) delete global.window;\nelse global.window = previousOwnerWindow;",
              1
          )
          text = text.replace(
              "assert.match(helper, /function isPlayerOwnedAsset[\\s\\S]{0,420}Array\\.isArray\\(asset\\?\\.所属对象\\)[\\s\\S]{0,420}=== '<user>'/, '自动收菜必须只认所属对象数组里的 <user>');\nconst harvestHelper = helper.slice(helper.indexOf('function isPlayerOwnedAsset'), helper.indexOf('/** 资产全自动收菜系统'));\nassert.doesNotMatch(harvestHelper, /playerName|SillyTavern|\\{\\{user\\}\\}|玩家/, '自动收菜不得再把玩家名或别名当成收菜权限');",
              "assert.match(helper, /function isPlayerOwnedAsset[\\s\\S]{0,2200}SillyTavern[\\s\\S]{0,2200}<user>/, '自动收菜必须解析酒馆真实玩家名并兼容旧标记');\nconst harvestHelper = helper.slice(helper.indexOf('function isPlayerOwnedAsset'), helper.indexOf('/** 资产全自动收菜系统'));\nassert.match(harvestHelper, /playerName|SillyTavern|玩家/, '自动收菜必须识别运行时玩家身份');",
              1
          )
          text = text.replace(
              "assert.match(vars, /Array\\.isArray\\(asset\\?\\.所属对象\\)[\\s\\S]{0,260}=== '<user>'/, '正文玩家资产投影必须支持所属对象数组并只认 <user>');",
              "assert.match(vars, /playerAssetOwnerKeys[\\s\\S]{0,2200}SillyTavern/, '正文玩家资产投影必须解析酒馆真实玩家名并兼容旧标记');",
              1
          )
          multi.write_text(text, encoding='utf-8')
          PY

          if node tests/task-settlement-simplified.cjs; then
            echo 'RED failed: old settlement unexpectedly recognized Tavern player name'
            exit 1
          else
            echo 'RED confirmed: literal <user> comparison loses assets owned by the actual Tavern player name'
          fi

          if node tests/world-engine-asset-multi-owner.cjs; then
            echo 'RED failed: old asset owner resolver unexpectedly passed new identity contract'
            exit 1
          else
            echo 'RED confirmed: helper/projection also depended on literal <user>'
          fi

          python - <<'PY'
          from pathlib import Path
          import shutil

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # GREEN 1：结算清理直接解析当前 Tavern name1；<user>/{{user}}/玩家仅作旧存档兼容别名。
          old_settlement = """              // 普通副本结束时只保留玩家拥有/共管的资产；纯NPC、势力或无主资产随副本清理。
              const assets = ensureObject(stat, '资产');
              Object.keys(assets).forEach(function(assetName) {
                const asset = assets[assetName];
                const rawOwners = asset && typeof asset === 'object' ? asset.所属对象 : null;
                // 兼容旧存档：缺失所属对象的历史资产仍按既有迁移语义视为玩家资产，避免误删。
                const owners = Array.isArray(rawOwners)
                  ? rawOwners
                  : (rawOwners == null ? ['<user>'] : [String(rawOwners)]);
                if (owners.indexOf('<user>') >= 0) return;
                delete assets[assetName];
                changed = true;
              });"""
          new_settlement = """              // 普通副本结束时只保留玩家拥有/共管的资产；纯NPC、势力或无主资产随副本清理。
              // <user> 属于提示词占位语义；程序侧直接读取 Tavern 当前玩家名，旧字面标记只做兼容。
              const assets = ensureObject(stat, '资产');
              const playerOwnerName = (() => {
                const dataName = String(stat && stat.角色 && stat.角色.名称 || '').trim();
                if (dataName) return dataName;
                try {
                  const ctx = typeof getMvuContext === 'function' ? getMvuContext() : null;
                  const win = ctx && ctx.win ? ctx.win : null;
                  const host = win || ((typeof window !== 'undefined' && window.parent && window.parent !== window)
                    ? window.parent
                    : (typeof window !== 'undefined' ? window : null));
                  return String(host?.SillyTavern?.name1 || host?.SillyTavern?.getContext?.()?.name1 || host?.name1 || '').trim();
                } catch (e) { return ''; }
              })();
              const ownerKey = value => String(value || '').trim().toLowerCase();
              const legacyTemplateUser = '{{' + 'user}}';
              const playerOwnerKeys = new Set([playerOwnerName, '<user>', legacyTemplateUser, '玩家'].filter(Boolean).map(ownerKey));
              Object.keys(assets).forEach(function(assetName) {
                const asset = assets[assetName];
                const rawOwners = asset && typeof asset === 'object' ? asset.所属对象 : null;
                // 兼容旧存档：缺失所属对象的历史资产继续视为玩家资产，避免结算误删。
                if (rawOwners == null) return;
                const owners = Array.isArray(rawOwners) ? rawOwners : [rawOwners];
                if (owners.some(owner => playerOwnerKeys.has(ownerKey(owner)))) return;
                delete assets[assetName];
                changed = true;
              });"""
          replace_once('Regular/结算任务美化.html', old_settlement, new_settlement, 'settlement player owner resolver')

          # GREEN 2：自动收菜使用同一身份语义。
          old_helper = """    function isPlayerOwnedAsset(asset) {
        const owners = Array.isArray(asset?.所属对象)
            ? asset.所属对象
            : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
        return owners.some(owner => String(owner || '').trim() === '<user>');
    }"""
          new_helper = """    function isPlayerOwnedAsset(asset, statData) {
        const owners = Array.isArray(asset?.所属对象)
            ? asset.所属对象
            : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
        if (!owners.length) return false;

        let playerName = String(statData?.角色?.名称 || '').trim();
        if (!playerName) {
            try {
                let host = null;
                try { if (typeof GS_PARENT !== 'undefined' && GS_PARENT) host = GS_PARENT; } catch (e) {}
                if (!host && typeof window !== 'undefined') {
                    try { if (window.parent && window.parent !== window) host = window.parent; } catch (e) {}
                    if (!host) host = window;
                }
                playerName = String(host?.SillyTavern?.name1 || host?.SillyTavern?.getContext?.()?.name1 || host?.name1 || '').trim();
            } catch (e) {}
        }

        const ownerKey = value => String(value || '').trim().toLowerCase();
        const legacyTemplateUser = '{{' + 'user}}';
        const playerOwnerKeys = new Set([playerName, '<user>', legacyTemplateUser, '玩家'].filter(Boolean).map(ownerKey));
        return owners.some(owner => playerOwnerKeys.has(ownerKey(owner)));
    }"""
          replace_once('script/辅助计算脚本.js', old_helper, new_helper, 'helper player owner resolver')
          replace_once(
              'script/辅助计算脚本.js',
              "            if (!asset || typeof asset !== 'object' || !isPlayerOwnedAsset(asset)) return;",
              "            if (!asset || typeof asset !== 'object' || !isPlayerOwnedAsset(asset, statData)) return;",
              'helper harvest owner call'
          )
          shutil.copyfile('script/辅助计算脚本.js', 'dist/V20260916/辅助计算脚本.js')

          # GREEN 3：正文变量投影也不能只认字面 <user>。
          old_vars = """const projectionNameKey = value => String(value || '').toLowerCase().replace(/[\\/／·・._\-\s]+/g, '');
const isPlayerOwnedAsset = asset => {
  const owners = Array.isArray(asset?.所属对象)
    ? asset.所属对象
    : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
  return owners.some(owner => String(owner || '').trim() === '<user>');
};"""
          new_vars = """const projectionNameKey = value => String(value || '').toLowerCase().replace(/[\\/／·・._\-\s]+/g, '');
const playerName = (() => {
  const dataName = String(_.get(data, '角色.名称', '') || '').trim();
  if (dataName) return dataName;
  try {
    const host = (typeof window !== 'undefined' && window.parent && window.parent !== window)
      ? window.parent
      : (typeof window !== 'undefined' ? window : null);
    return String(host?.SillyTavern?.name1 || host?.SillyTavern?.getContext?.()?.name1 || host?.name1 || '').trim();
  } catch (_) { return ''; }
})();
const legacyTemplateUser = '{{' + 'user}}';
const playerIdentityValues = [playerName, '<user>', legacyTemplateUser, '玩家'].filter(Boolean);
const playerAssetOwnerKey = value => String(value || '').trim().toLowerCase();
const playerAssetOwnerKeys = new Set(playerIdentityValues.map(playerAssetOwnerKey));
const isPlayerOwnedAsset = asset => {
  const owners = Array.isArray(asset?.所属对象)
    ? asset.所属对象
    : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
  return owners.some(owner => playerAssetOwnerKeys.has(playerAssetOwnerKey(owner)));
};"""
          replace_once('World Book/[variables]当前变量.txt', old_vars, new_vars, 'variable projection player owner resolver')

          old_person = """    const playerName = (() => {
      const dataName = String(_.get(data, '角色.名称', '') || '').trim();
      if (dataName) return dataName;
      try {
        const host = (typeof window !== 'undefined' && window.parent && window.parent !== window) ? window.parent : (typeof window !== 'undefined' ? window : null);
        return String(host?.SillyTavern?.name1 || host?.SillyTavern?.getContext?.()?.name1 || host?.name1 || '').trim();
      } catch (_) { return ''; }
    })();
    const playerKeys = new Set([playerName, '{{user}}', '<user>', '玩家'].filter(Boolean).map(personNameKey));"""
          new_person = """    const playerKeys = new Set(playerIdentityValues.map(personNameKey));"""
          replace_once('World Book/[variables]当前变量.txt', old_person, new_person, 'reuse player identity for offstage projection')
          PY

          node --check script/辅助计算脚本.js
          node --check dist/V20260916/辅助计算脚本.js
          node tests/task-settlement-simplified.cjs
          node tests/world-engine-asset-multi-owner.cjs
          node tests/asset-harvest-lifecycle.cjs
          cmp -s script/辅助计算脚本.js dist/V20260916/辅助计算脚本.js
          ! grep -F "owners.indexOf('<user>')" "Regular/结算任务美化.html"
      - name: Legacy world commit marker removed
        run: |
          legacy="__samsara""WorldCommit"
          if grep -R "$legacy" script tests tools --exclude-dir=.git; then
            echo "legacy world commit marker still exists"
            exit 1
          fi
      - name: Syntax check
        run: node --check script/世界推进系统.js
      - name: Statusbar syntax check
        run: node --check script/悬浮球状态栏.js
      - name: Auxiliary syntax check
        run: node --check script/辅助计算脚本.js
      - name: Request observability regression
        run: node tests/world-engine-observability.cjs
      - name: Dedicated API preset selection regression
        run: node tests/world-engine-api-preset-selection.cjs
      - name: Simplified task settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: Settlement coin task-independence regression
        run: node tests/settlement-coin-task-independence.cjs
      - name: Settlement snapshot follow-up regression
        run: node tests/settlement-snapshot-followup.cjs
      - name: Trial promotion identity regression
        run: node tests/trial-promotion-flow.cjs
      - name: Legacy trial identity regression
        run: node tests/trial-legacy-identity.cjs
      - name: Settlement shop coin persistence regression
        run: node tests/settlement-shop-coin-persistence.cjs
      - name: Settlement message marker regression
        run: node tests/settlement-message-marker.cjs
      - name: Settlement current panel regression
        run: node tests/settlement-current-panel-regression.cjs
      - name: Settlement status alias regression
        run: node tests/settlement-status-aliases.cjs
      - name: Settlement character lifecycle regression
        run: node tests/settlement-character-lifecycle.cjs
      - name: Statusbar settlement topbar regression
        run: node tests/statusbar-settlement-topbar.cjs
      - name: Super-stable prompt regression
        run: node tests/world-engine-superstable-prompt.cjs
      - name: Task awareness regression
        run: node tests/world-engine-task-awareness.cjs
      - name: History memory regression
        run: node tests/world-engine-history-memory.cjs
      - name: History memory safety regression
        run: node tests/world-engine-history-memory-safety.cjs
      - name: History memory editor regression
        run: node tests/world-engine-history-memory-editor.cjs
      - name: Rumor rolling regression
        run: node tests/world-engine-rumor-capacity.cjs
      - name: Editable system prompts regression
        run: node tests/world-engine-editable-system-prompts.cjs
      - name: Editable module prompts regression
        run: node tests/world-engine-module-prompts.cjs
      - name: Offstage NPC knowledge boundary regression
        run: node tests/offstage-knowledge-boundary.cjs
      - name: Causal overview regression
        run: node tests/world-engine-causal-summary.cjs
      - name: Soft maintenance regression
        run: node tests/world-engine-soft-maintenance.cjs
      - name: Active alien activity normalization
        run: node tests/world-engine-alien-activity-normalization.cjs
      - name: Auto progress regression
        run: node tests/world-engine-auto-progress.cjs
      - name: Auto progress after variable reprocessing
        run: node tests/world-engine-auto-reprocess.cjs
      - name: Missing replay auto retry policy
        run: node tests/world-engine-reprocess-missing-snapshot-policy.cjs
      - name: World engine event bootstrap
        run: node tests/world-engine-event-bootstrap.cjs
      - name: Chronology guard regression
        run: node tests/world-engine-chronology-guard.cjs
      - name: World time lifecycle regression
        run: node tests/world-time-lifecycle.cjs
      - name: Asset harvest lifecycle regression
        run: node tests/asset-harvest-lifecycle.cjs
      - name: Causal stability gate regression
        run: node tests/world-engine-causal-stability-gate.cjs
      - name: Causal offset editor regression
        run: node tests/world-engine-causal-offset-editor.cjs
      - name: World integrity regression
        run: node tests/world-engine-integrity-guard.cjs
      - name: Commit generated delivery
        run: |
          if git diff --quiet -- script/world-engine-src/00-foundation-prompt.part.js script/world-engine-src/10-world-state.part.js script/world-engine-src/40-engine-runtime.part.js script/world-engine-src/50-engine-ui.part.js script/world-engine-src/56-rumor-liveliness.part.js script/world-engine-src/57-task-awareness.part.js script/world-engine-src/58-chronology-guard.part.js script/world-engine-src/59-auto-progress.part.js script/world-engine-src/59-auto-trigger-rebuild.part.js script/world-engine-src/59-history-memory.part.js script/world-engine-src/59-soft-maintenance.part.js script/world-engine-src/59-world-time-ownership.part.js script/world-engine-src/59-world-replay-persistence.part.js script/world-engine-src/59-reprocess-immediate-retry.part.js script/世界推进系统.js script/悬浮球状态栏.js script/辅助计算脚本.js "dist/V20260916/辅助计算脚本.js" script/ZOD脚本.js "World Book/[mvu_update]变量更新规则.txt" "World Book/[variables]当前变量.txt" "World Book/[InitVar]世界初始设定.yaml" "World Book/⚙️资产与载具规则.txt" "Regular/结算任务美化.html" "Regular/选择世界美化.txt" "Regular/试炼任务美化.html" "script/世界引擎接入说明.md" "docs/世界引擎V2审计.md" tests/task-settlement-simplified.cjs tests/statusbar-settlement-topbar.cjs tests/world-engine.cjs tests/world-engine-superstable-prompt.cjs tests/world-engine-prompt-pipeline.cjs tests/world-engine-scene-context.cjs tests/world-engine-asset-multi-owner.cjs tests/world-engine-asset-writeback.cjs tests/world-engine-request-transparency.cjs tests/world-engine-observability.cjs tests/world-engine-history-memory.cjs tests/world-engine-history-memory-safety.cjs tests/world-engine-history-memory-editor.cjs tests/world-engine-auto-reprocess.cjs tests/world-engine-reprocess-missing-snapshot-policy.cjs tests/world-engine-causal-offset-editor.cjs tests/world-time-lifecycle.cjs tests/asset-harvest-lifecycle.cjs; then exit 0; fi
