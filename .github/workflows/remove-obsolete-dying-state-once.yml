name: One-shot dying-state cleanup

on:
  push:
    branches:
      - chore/remove-obsolete-dying-state
    paths:
      - .github/workflows/remove-obsolete-dying-state-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/remove-obsolete-dying-state-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-obsolete-dying-state

      - name: Apply minimal replacements
        shell: python
        run: |
          from pathlib import Path

          def load(path):
              p = Path(path)
              text = p.read_bytes().decode('utf-8')
              nl = '\r\n' if '\r\n' in text else '\n'
              return p, text, nl

          def block(nl, lines):
              return nl.join(lines)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          # 1) 辅助计算脚本：删除两处“濒死=0HP死亡豁免”逻辑
          p, text, nl = load('script/辅助计算脚本.js')

          old = block(nl, [
              '            // 2. 智能死亡判定',
              '            // 判断条件 A：HP 归零，并且状态里没有“濒死”二字',
              "            const isHpZero = (typeof npc.HP === 'number' && npc.HP <= 0);",
              '            // 遍历状态名，防止 AI 起名字叫“严重濒死”之类的',
              "            const isDying = npc.状态 && Object.keys(npc.状态).some(key => key.includes('濒死')); ",
              '            const isHpDead = isHpZero && !isDying;'
          ])
          new = block(nl, [
              '            // 2. 死亡判定',
              '            // 判断条件 A：HP 归零',
              "            const isHpDead = (typeof npc.HP === 'number' && npc.HP <= 0);"
          ])
          text = replace_once(text, old, new, 'cleanupDeadNPCs death rule')

          old = block(nl, [
              '        // —— 0. 战场敌对存活性检测：无在场存活的敌对 NPC 时强制脱战 ——',
              '        //   敌对定义: 在场 且 非队友 且 好感度<0(仇视及以上敌意)',
              '        //   存活定义: HP>0 且 状态未明确标注“死亡”，且未处于纯濒死无威胁状态',
              '        //   (濒死单位失去意识、无法行动，视为无威胁；只要还有任一“非濒死且存活”的敌对单位，战斗继续)'
          ])
          new = block(nl, [
              '        // —— 0. 战场敌对存活性检测：无在场存活的敌对 NPC 时强制脱战 ——',
              '        //   敌对定义: 在场 且 非队友 且 好感度<0(仇视及以上敌意)',
              '        //   存活定义: HP>0 且 状态未明确标注“死亡”'
          ])
          text = replace_once(text, old, new, 'isHostileAlive comments')

          old = block(nl, [
              '            // 死亡判定: HP 归零(且非濒死护盾) 或 状态含“死亡”',
              "            const isHpDead = (typeof npc.HP === 'number' && npc.HP <= 0)",
              "                && !(npc.状态 && Object.keys(npc.状态).some(k => k.includes('濒死')));"
          ])
          new = block(nl, [
              '            // 死亡判定: HP 归零 或 状态含“死亡”',
              "            const isHpDead = (typeof npc.HP === 'number' && npc.HP <= 0);"
          ])
          text = replace_once(text, old, new, 'isHostileAlive death rule')

          if '濒死' in text:
              raise RuntimeError('辅助计算脚本.js still contains 濒死 after targeted replacements')
          p.write_bytes(text.encode('utf-8'))

          # 2) 悬浮球状态栏：HP<=0 直接视为死亡，不再检查“濒死”状态
          p, text, nl = load('script/悬浮球状态栏.js')
          old = block(nl, [
              '    function isNpcDead(n) {',
              "        if (!n || typeof n !== 'object') return false;",
              '        var hp = safeNum(n.HP, 0);',
              '        var hpmax = safeNum(n.HP_MAX, 0);',
              '        if (hpmax > 0 && hp <= 0) {',
              "            var isDying = n.状态 && Object.keys(n.状态).some(function(key) { return key.indexOf('濒死') >= 0; });",
              '            if (!isDying) return true;',
              '        }',
              "        var isExplicitlyDead = n.状态 && Object.keys(n.状态).some(function(key) { return key.indexOf('死亡') >= 0; });",
              '        return !!isExplicitlyDead;',
              '    }'
          ])
          new = block(nl, [
              '    function isNpcDead(n) {',
              "        if (!n || typeof n !== 'object') return false;",
              '        var hp = safeNum(n.HP, 0);',
              '        if (hp <= 0) return true;',
              "        var isExplicitlyDead = n.状态 && Object.keys(n.状态).some(function(key) { return key.indexOf('死亡') >= 0; });",
              '        return !!isExplicitlyDead;',
              '    }'
          ])
          text = replace_once(text, old, new, 'status bar isNpcDead')
          if '濒死' in text:
              raise RuntimeError('悬浮球状态栏.js still contains 濒死 after targeted replacement')
          p.write_bytes(text.encode('utf-8'))

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          node --check 'script/辅助计算脚本.js'
          node --check 'script/悬浮球状态栏.js'
          git config core.whitespace cr-at-eol
          git config core.quotepath false
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'script/辅助计算脚本.js'
          printf '%s\n' "${changed[@]}" | grep -Fx 'script/悬浮球状态栏.js'

      - name: Commit patched files and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.whitespace cr-at-eol
          git rm '.github/workflows/remove-obsolete-dying-state-once.yml'
          git add 'script/辅助计算脚本.js' 'script/悬浮球状态栏.js'
          git diff --cached --check
          git commit -m 'fix: remove obsolete dying-state death exemptions [skip ci]'
          git push origin HEAD:chore/remove-obsolete-dying-state
