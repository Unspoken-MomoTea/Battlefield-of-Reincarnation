name: credential-ledger-integration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: ${{ contains(github.event.head_commit.message, '[apply-credential-ledger]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused patch
        run: python tools/apply-credential-ledger-integration.py
      - name: Syntax check
        run: node --check script/悬浮球状态栏.js
      - name: Shop permission regression
        run: node tests/shop-permission-guard.cjs
      - name: Credential ledger integration regression
        run: node tests/credential-ledger-integration.cjs
      - name: Diff hygiene
        run: git diff --check -- script/悬浮球状态栏.js Regular/结算任务美化.html 'World Book/[variables]当前变量.txt' tests/shop-permission-guard.cjs tests/credential-ledger-integration.cjs
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/悬浮球状态栏.js Regular/结算任务美化.html 'World Book/[variables]当前变量.txt' tests/shop-permission-guard.cjs tests/credential-ledger-integration.cjs
          git diff --cached --quiet && exit 1
          git commit -m "feat: integrate permission credential ledger [credential-ledger-fixed]"
          git push
