name: World Engine Temporary People Lifecycle

on:
  push:
    branches:
      - refactor/world-engine-p1-ui
    paths:
      - .github/workflows/world-engine-temp-people.yml
      - tools/refactor-world-engine-temp-people.py
      - tests/world-engine-temporary-people.cjs

permissions:
  contents: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/world-engine-p1-ui
      - name: Apply temporary person lifecycle refactor
        run: python tools/refactor-world-engine-temp-people.py
      - name: Syntax check
        run: node --check 'script/世界推进系统.js'
      - name: Temporary person lifecycle acceptance
        run: node tests/world-engine-temporary-people.cjs
      - name: Person scene and roster acceptance
        run: node tests/world-engine-person-scene-ui.cjs
      - name: P1-A scene acceptance
        run: node tests/world-engine-scene-context.cjs
      - name: Prompt pipeline acceptance
        run: node tests/world-engine-prompt-pipeline.cjs
      - name: Existing regression parity with main
        shell: bash
        run: |
          cp 'script/世界推进系统.js' /tmp/branch-world-engine.js
          git fetch origin main --depth=1
          for test_file in tests/world-engine-lifecycle-audit.cjs tests/world-engine-prose.cjs tests/world-engine.cjs; do
            cp /tmp/branch-world-engine.js 'script/世界推进系统.js'
            set +e
            node "$test_file" >/tmp/branch-test.log 2>&1
            branch_status=$?
            set -e
            git checkout FETCH_HEAD -- 'script/世界推进系统.js'
            set +e
            node "$test_file" >/tmp/main-test.log 2>&1
            main_status=$?
            set -e
            echo "$test_file: branch=$branch_status main=$main_status"
            if [ "$branch_status" -ne "$main_status" ]; then
              echo 'Regression parity failed'
              echo '--- branch ---'; cat /tmp/branch-test.log
              echo '--- main ---'; cat /tmp/main-test.log
              exit 1
            fi
          done
          cp /tmp/branch-world-engine.js 'script/世界推进系统.js'
      - name: Verify integration boundary
        shell: bash
        run: |
          test -z "$(git status --porcelain | awk '{print $2}' | grep -E '(^|/)regex-|\.json$' || true)"
          grep -q '人物:projectHotWorldPeople(src)' 'script/世界推进系统.js'
          grep -q '回收人物:removedPeople' 'script/世界推进系统.js'
          grep -q '所有年龄判断只使用 `世界.时间`' 'script/世界引擎接入说明.md'
      - name: Commit lifecycle refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'script/世界推进系统.js' 'docs/世界引擎V2审计.md' 'script/世界引擎接入说明.md'
          git commit -m 'fix: bound temporary backstage person lifecycle'
          git push origin HEAD:refactor/world-engine-p1-ui
