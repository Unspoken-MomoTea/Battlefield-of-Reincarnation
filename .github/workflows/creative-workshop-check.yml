name: creative-workshop-check

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/CreativeWorkshop/**'
      - 'cloudflare/**'
      - '.github/workflows/creative-workshop-check.yml'
      - '.github/workflows/creative-workshop-promote-stable.yml'
      - '.github/workflows/deploy-workshop-staging.yml'
      - '创意工坊更新工具.bat'
  push:
    branches: [main]
    paths:
      - 'src/CreativeWorkshop/**'
      - 'cloudflare/**'
      - '.github/workflows/creative-workshop-check.yml'
      - '.github/workflows/creative-workshop-promote-stable.yml'
      - '.github/workflows/deploy-workshop-staging.yml'
      - '创意工坊更新工具.bat'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker contract tests
        working-directory: cloudflare
        run: npm test
      - name: Worker syntax
        run: |
          find cloudflare/src -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find cloudflare/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check
      - name: Client contract tests
        run: node --test src/CreativeWorkshop/tests/*.test.mjs
      - name: Client syntax
        run: find src/CreativeWorkshop -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
