name: npc-audit-level-migration
on:
  push:
    branches: [codex/npc-audit-level]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/npc-audit-level
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply NPC audit level model
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              assert old in text, f'missing pattern in {path}: {old[:80]!r}'
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          # ZOD: reuse the existing 审计级别 name as persistent NPC data. Missing value is inferred programmatically.
          patch('script/ZOD脚本.js',
          "const E_occupationType = z.preprocess(v => {\n    const s = String(v ?? '').trim();\n    return ['战斗', '生活', '辅助'].includes(s) ? s : '辅助';\n}, z.enum(['战斗', '生活', '辅助']));",
          "const E_occupationType = z.preprocess(v => {\n    const s = String(v ?? '').trim();\n    return ['战斗', '生活', '辅助'].includes(s) ? s : '辅助';\n}, z.enum(['战斗', '生活', '辅助']));\nconst NPC_AUDIT_LEVELS = ['杂兵级', '精英级', '首领/Boss级'];\nfunction inferNpcAuditLevel(npc) {\n    const explicit = String(npc?.审计级别 ?? '').trim();\n    if (NPC_AUDIT_LEVELS.includes(explicit)) return explicit;\n    const profileText = [\n        ...(Array.isArray(npc?.身份) ? npc.身份 : []),\n        ...Object.keys(npc?.职业 || {}), npc?.背景故事, npc?.态度\n    ].filter(Boolean).join(' ');\n    if (/(?:boss|首领|领主|头目|魔王|王者|宗主|掌门|教皇|最终敌人|最终对手)/i.test(profileText)) return '首领/Boss级';\n    if (/(?:精英|精锐|王牌|核心战力|强敌)/i.test(profileText)) return '精英级';\n    return '杂兵级';\n}")
          patch('script/ZOD脚本.js',
          "    层级: E_rank.prefault('Ⅰ'),\n    HP_MAX:",
          "    层级: E_rank.prefault('Ⅰ'),\n    审计级别: z.enum(NPC_AUDIT_LEVELS).optional(),\n    HP_MAX:")
          patch('script/ZOD脚本.js',
          "})).transform(char => {\n    // 跨节点幽灵机甲清理",
          "})).transform(char => {\n    char.审计级别 = inferNpcAuditLevel(char);\n    // 跨节点幽灵机甲清理")

          # Variable prompt: AI owns the explicit value when present and re-evaluates it after substantive changes.
          patch('World Book/[mvu_update]变量更新规则.txt',
          "    位格品质: &E_quality F|E|D|C|B|A|S|SS|SSS\n    五维:",
          "    位格品质: &E_quality F|E|D|C|B|A|S|SS|SSS\n    审计级别: &E_npc_audit 杂兵级|精英级|首领/Boss级\n    五维:")
          patch('World Book/[mvu_update]变量更新规则.txt',
          "       - insert必须一次性包含全字段(种族/身份/外貌/着装/血统/装备/技能)",
          "       - insert必须一次性包含全字段(种族/身份/审计级别/外貌/着装/血统/装备/技能)")
          patch('World Book/[mvu_update]变量更新规则.txt',
          "      层级: *E_life_level\n      ${资源值}: *resource",
          "      层级: *E_life_level\n      审计级别:\n        type: *E_npc_audit\n        check:\n          - 表示当前剧情中的战斗构筑定位，与生命层级独立；创建NPC时按剧情身份、叙事地位、实际能力与遭遇需求明确填写\n          - 获得/失去关键力量、战斗职责或剧情地位发生实质变化时重新评估并更新；普通受伤、单次胜负或短期状态不改变\n          - 若旧档或漏填，程序会按身份、职业、背景故事、态度兜底推断；已有合法值时程序不得覆盖AI判断\n      ${资源值}: *resource")

          # NPC generation prompt, rewritten in-place.
          npc_rule = '''<NPC建档与生成规则>\n触发与范围:\n  - 首次正式出场且有姓名、身份、对白、敌对关系或后续价值的角色，同轮建档。敌对可交互单位不得因无名、同轮死亡或离场而省略。\n  - 纯背景人群及未进入当前场景、无法互动的单位不建完整面板；场外记录由世界推进规则维护。\n  - 有名角色、精英、Boss独立建档；同类无名杂兵合并为“${敌人类型}群体#${番号}”。\n  - 群体按单名成员生成属性与组件，数量仅记录人数；客户端将其余成员HP转为THP，AI不得手动乘算。成员取得独立身份/能力或成为剧情目标时才拆分。\n  - 本体层级按《生命层级与社会生态》；难度不用于凭空提高既有NPC层级。组件定档按《品质效果数值规则》，原始属性字段按《实体生成规则》，不输出真属性或最终属性。\n  - 创建时明确填写审计级别=杂兵级/精英级/首领/Boss级；它表示当前剧情中的战斗构筑定位，与本体层级独立，Ⅰ阶也可以是Boss，高阶也可只是杂兵。\n  - NPC获得/失去关键力量、战斗职责或剧情地位发生实质变化时，重新评估层级与审计级别：本体强度变化改层级，战斗构筑定位变化改审计级别，二者可同时变化。旧档或漏填审计级别时由程序兜底推断。\n\n组件数量（血统 / 装备 / 技能；以下为最低构筑）:\n  杂兵: 1 / 2起 / 1起\n  精英: 1 / 4起 / 2起\n  首领或Boss: 1 / 6起 / 4起\n  - 血统默认1项；只有明确多重血统设定时才增加，不为凑数量拆分或复制血统。\n  - 装备与技能可按实际设定继续增加，但不得用重复、同义或无实战意义条目机械凑数。\n  - NPC构筑中的装备默认全部处于已装备状态，统一写状态: 1；状态0仅用于剧情明确的随身未装备物，状态2仅用于仓库物，0/2均不计入上述最低装备数。\n  - 精英以上须有明确战斗定位，以及杀伤、生存、机动或控制手段；Boss另具至少一种阶段转换、形态、状态或技能机制，不以纯辅助替代实际攻防。\n  - 同一能力只保留一个主要归属；同区域人物在职业、定位、组件或战斗方式上有所区别。\n  - 非人生物有战斗功能的爪牙、甲壳等器官可建为类型0天然装备，填写实际ATK/DEF等原始属性；血统不重复计算同一器官收益。纯外观或飞行器官不强行装备化。\n\n建档与展示:\n  - 按Schema创建完整NPC：在场、是否队友、好感度、种族、身份、职业、层级、审计级别、外貌、着装、性格、喜爱、背景故事、态度及实际组件。\n  - 初次在场默认true，未组队则是否队友=false，无既有关系依据则好感度=0。\n  - 血统须含五维原始属性；装备须含实际生效属性。所有战斗NPC至少满足对应最低技能数，不以空对象替代必须存在的血统、装备或技能。\n  - 正文明确稳定名称、身份、外观、装备、主要能力及群体人数；【实体登场】面板、正文与变量名称一致。\n</NPC建档与生成规则>\n'''
          Path('World Book/⚙️NPC生成规则.txt').write_text(npc_rule,encoding='utf-8',newline='\n')

          # Keep prompt regeneration tool synchronized with the canonical worldbook text.
          p=Path('tools/refine-world-prompts.py'); text=p.read_text(encoding='utf-8')
          start=text.index("write('⚙️NPC生成规则.txt', '''")
          end=text.index("\n''')", start)+5
          replacement="write('⚙️NPC生成规则.txt', '''\n"+npc_rule.rstrip()+"\n''')"
          p.write_text(text[:start]+replacement+text[end:],encoding='utf-8',newline='\n')

          # WorldResult can update the same persistent field.
          patch('script/world-engine-src/20-world-result.part.js',
          "        在场:false,种族:'',身份:[],职业:{},层级:'Ⅰ',HP:0,THP:0,EP:0,",
          "        在场:false,种族:'',身份:[],职业:{},层级:'Ⅰ',审计级别:'杂兵级',HP:0,THP:0,EP:0,")
          patch('script/world-engine-src/20-world-result.part.js',
          "                层级:{type:'string',enum:copy(RELATION_RANKS)},HP:{type:'number',minimum:0,maximum:99999999},",
          "                层级:{type:'string',enum:copy(RELATION_RANKS)},审计级别:{type:'string',enum:['杂兵级','精英级','首领/Boss级']},HP:{type:'number',minimum:0,maximum:99999999},")

          # Expose the stored value to audit/world projections.
          patch('script/world-engine-src/30-context-protocol.part.js',
          "['在场','种族','身份','职业','层级','HP_MAX'",
          "['在场','种族','身份','职业','层级','审计级别','HP_MAX'")
          patch('script/world-engine-src/30-context-protocol.part.js',
          "['在场','种族','身份','职业','层级','HP_MAX'",
          "['在场','种族','身份','职业','层级','审计级别','HP_MAX'")

          # Audit: explicit AI value wins; program only infers when absent/invalid.
          p=Path('script/world-engine-src/55-npc-narrative-audit.part.js'); text=p.read_text(encoding='utf-8')
          text=text.replace(
          "1. 审计级别只依据既有身份、职业、背景故事、态度体现的剧情份量判断，与人物层级独立；低阶可以是精英/Boss，高阶也不会自动升级。不得为了通过审计临时改写人物份量。",
          "1. 优先读取NPC已有审计级别（杂兵级/精英级/首领/Boss级），它与人物层级独立；只有缺失或非法时才由程序按身份、职业、背景故事、态度兜底推断。若本轮剧情中获得/失去关键力量、战斗职责或剧情地位已实质变化，可通过WorldResult.关系同步更新审计级别与必要构筑；不得因普通受伤、单次胜负或层级高低机械改级。")
          text=text.replace(
          "    function npcNarrativeAuditLevel(npc) {\n        const profileText=",
          "    function npcNarrativeAuditLevel(npc) {\n        const explicit=String(npc?.审计级别||'').trim();\n        if(['杂兵级','精英级','首领/Boss级'].includes(explicit))return explicit;\n        const profileText=")
          text=text.replace("&&currentPrompt.includes('最低构筑：杂兵=血统1/装备2/技能1')\n                &&!currentPrompt.includes('审计新增装备统一写状态=1');",
                            "&&currentPrompt.includes('最低构筑：杂兵=血统1/装备2/技能1')\n                &&!currentPrompt.includes('优先读取NPC已有审计级别');")
          p.write_text(text,encoding='utf-8',newline='\n')

          # Focused regression: explicit value overrides keyword inference, and prompt explains the ownership model.
          p=Path('tests/world-engine-npc-audit-toggle.cjs'); text=p.read_text(encoding='utf-8')
          text=text.replace(
          "      s.关系列表.低阶隐藏首领={...clone(base),身份:['隐藏Boss'],层级:'Ⅰ',背景故事:'表面普通，实际是本次遭遇的隐藏Boss。'};",
          "      s.关系列表.低阶隐藏首领={...clone(base),身份:['隐藏Boss'],层级:'Ⅰ',背景故事:'表面普通，实际是本次遭遇的隐藏Boss。'};\n      s.关系列表.显式降级首领={...clone(base),身份:['首领'],层级:'Ⅷ',审计级别:'杂兵级',背景故事:'曾经是首领，但当前只是普通守门人。'};")
          text=text.replace(
          "    const boss=audit.find(item=>item.名称==='低阶隐藏首领');",
          "    const boss=audit.find(item=>item.名称==='低阶隐藏首领');\n    const explicit=audit.find(item=>item.名称==='显式降级首领');")
          text=text.replace(
          "    assert.ok(boss?.缺口.some(x=>/技能不足 0\\/4/.test(x)));",
          "    assert.ok(boss?.缺口.some(x=>/技能不足 0\\/4/.test(x)));\n    assert.equal(explicit?.审计级别,'杂兵级','已有合法审计级别必须优先于关键词推断');")
          text=text.replace("    assert.match(on.system,/与人物层级独立/);",
                            "    assert.match(on.system,/与人物层级独立/);\n    assert.match(on.system,/优先读取NPC已有审计级别/);")
          p.write_text(text,encoding='utf-8',newline='\n')
          PY
      - name: Build delivery
        run: python tools/build-world-engine.py
      - name: Syntax checks
        run: |
          node --check script/世界推进系统.js
          node --check script/ZOD脚本.js
      - name: NPC audit regression
        run: node tests/world-engine-npc-audit-toggle.cjs
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/npc-audit-level-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist AI-managed NPC audit levels"
          git push origin codex/npc-audit-level
