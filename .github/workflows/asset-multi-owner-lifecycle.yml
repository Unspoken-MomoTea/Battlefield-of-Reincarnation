# clean acceptance rerun after duplicate migration fix
name: Asset Multi Owner Lifecycle

on:
  push:
    branches: [fix/asset-multi-owner-lifecycle]
    paths:
      - '.github/workflows/asset-multi-owner-lifecycle.yml'

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/asset-multi-owner-lifecycle
          fetch-depth: 0

      - name: Confirm red contract
        run: |
          if node tests/world-engine-asset-multi-owner.cjs; then
            echo 'Expected multi-owner contract to fail before refactor.'
            exit 1
          fi

      - name: Apply refactor
        run: |
          python tools/fix-asset-multi-owner-patcher.py
          python tools/refactor-asset-multi-owner.py
          python tools/fix-asset-multi-owner-tests.py

      - name: Build and validate
        run: |
          python tools/build-world-engine.py
          python tools/build-world-engine.py --check
          node --check 'script/世界推进系统.js'
          node --check 'script/悬浮球状态栏.js'
          node tests/world-engine-asset-multi-owner.cjs
          node tests/world-engine-asset-writeback.cjs
          node tests/world-engine-asset-ledger-cleanup.cjs
          node tests/world-engine-scene-context.cjs
          node tests/world-engine-person-scene-ui.cjs
          node tests/world-engine-hot-scenes.cjs
          node tests/world-engine-context-ui-redesign.cjs
          node tests/world-engine-prompt-pipeline.cjs
          node tests/world-engine-modules.cjs
          node tests/world-engine-request-transparency.cjs
          node tests/world-engine-schema-retry-diagnostics.cjs
          node tests/world-engine-macro-open-backbone.cjs
          node tests/world-engine-request-budget-retry-ui.cjs
          node tests/world-engine-ui-theme.cjs
          node tests/world-engine-observability.cjs
          node tests/world-engine-lifecycle-audit.cjs
          node tests/world-engine-temporary-people.cjs

      - name: Verify boundaries
        run: |
          git config core.whitespace cr-at-eol
          grep -q "所属对象:{type:'array'" script/world-engine-src/20-world-result.part.js
          grep -q '资产墓碑' script/world-engine-src/20-world-result.part.js
          grep -q '资产墓碑' script/辅助计算脚本.js
          grep -q 'assetOwnerChips' script/悬浮球状态栏.js
          grep -q "trim() === '<user>'" script/辅助计算脚本.js
          ! grep -q 'playerName' script/辅助计算脚本.js
          grep -q 'version:13' script/world-engine-src/00-foundation-prompt.part.js
          git diff --check

      - name: Commit formal changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'World Book/[mvu_update]变量更新规则.txt' 'World Book/[variables]当前变量.txt' 'World Book/⚙️资产与载具规则.txt' 'World Book/⚙️行为判定[mvu_plot].txt' docs/世界引擎V2审计.md script/ZOD脚本.js script/辅助计算脚本.js script/悬浮球状态栏.js script/world-engine-src/00-foundation-prompt.part.js script/world-engine-src/10-world-state.part.js script/world-engine-src/20-world-result.part.js script/world-engine-src/30-context-protocol.part.js script/世界引擎接入说明.md script/世界推进系统.js tests/world-engine-asset-multi-owner.cjs tests/world-engine-asset-writeback.cjs tests/world-engine-prompt-pipeline.cjs tests/world-engine-scene-context.cjs tests/world-engine.cjs
          git diff --cached --check
          git commit -m 'feat: support shared and ownerless assets'
          git push origin HEAD:fix/asset-multi-owner-lifecycle
