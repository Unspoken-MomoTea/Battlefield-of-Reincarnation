name: Fix credential floor reward

on:
  push:
    paths:
      - '.github/workflows/fix-credential-floor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch credential reward grade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('Regular/结算任务美化.html')
          raw = p.read_text(encoding='utf-8')
          nl = '\r\n' if '\r\n' in raw else '\n'
          s = raw.replace('\r\n', '\n')

          old = """            const gradeIndex = GRADES.indexOf(baseGrade);
            const targetIndex = heroIndex + 1;
            if (gradeIndex < targetIndex) return null;
            const grantGrade = GRADES[targetIndex];
            return { grade:grantGrade, name:grantGrade + '级权限凭证', heroTier:tierRaw, sourceGrade:baseGrade };
"""
          new = """            const gradeIndex = GRADES.indexOf(baseGrade);
            // 凭证品质严格取副本难度区间的最低档；仅当该最低档严格高于自身层级时发放。
            if (gradeIndex <= heroIndex) return null;
            const grantGrade = baseGrade;
            return { grade:grantGrade, name:grantGrade + '级权限凭证', heroTier:tierRaw, sourceGrade:baseGrade };
"""
          if s.count(old) != 1:
              raise SystemExit(f'credential grant anchor mismatch: {s.count(old)}')
          s = s.replace(old, new, 1)

          # 语义回归：最低难度决定凭证品质，自身层级只决定是否有资格获得。
          grades = ['F','E','D','C','B','A','S','SS','SSS']
          def floor(v):
              vals = re.findall(r'SSS|SS|S|A|B|C|D|E|F', str(v).upper())
              return min(vals, key=grades.index) if vals else ''
          def grant(hero_grade, difficulty):
              base = floor(difficulty)
              if not base: return None
              return base if grades.index(base) > grades.index(hero_grade) else None

          cases = {
              ('F','E~SSS'): 'E',
              ('F','C~SSS'): 'C',
              ('F','S级'): 'S',
              ('C','C~SSS'): None,
              ('B','C~SSS'): None,
              ('C','S~SSS'): 'S',
              ('S','S~SSS'): None,
              ('S','SS~SSS'): 'SS',
          }
          for (hero, diff), expected in cases.items():
              got = grant(hero, diff)
              if got != expected:
                  raise SystemExit(f'semantic case failed: hero={hero} diff={diff} got={got} expected={expected}')

          if "const grantGrade = GRADES[targetIndex];" in s:
              raise SystemExit('old next-tier reward logic still present')
          if "const grantGrade = baseGrade;" not in s:
              raise SystemExit('floor-grade reward logic missing')

          out = s if nl == '\n' else s.replace('\n', '\r\n')
          p.write_text(out, encoding='utf-8', newline='')
          print('credential floor reward patch + semantic cases: OK')
          PY

      - name: Validate embedded scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('Regular/结算任务美化.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script[^>]*>([\s\S]*?)</script>', s, flags=re.I)
          if not blocks:
              raise SystemExit('no script blocks found')
          for i, code in enumerate(blocks):
              Path(f'/tmp/settlement-{i}.js').write_text(code, encoding='utf-8')
          print('script blocks:', len(blocks))
          PY
          for f in /tmp/settlement-*.js; do node --check "$f"; done

      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-credential-floor.yml
          git add 'Regular/结算任务美化.html'
          git add -u .github/workflows/fix-credential-floor.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix credential rewards to dungeon minimum grade"
          git push
