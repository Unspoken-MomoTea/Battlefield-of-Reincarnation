name: Restore mall prompt before reinforcement gating

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-shop-prompt.yml'

permissions:
  contents: write

jobs:
  restore-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-gating mall prompt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          current_path = Path('script/悬浮球状态栏.js')
          old_path = Path('dist/悬浮球状态栏.js')
          current = current_path.read_bytes().decode('utf-8-sig')
          old = old_path.read_bytes().decode('utf-8-sig')

          start = "            + '3. 升级重铸机制:"
          end = "            + (hasReq"

          ca = current.index(start)
          cb = current.index(end, ca)
          oa = old.index(start)
          ob = old.index(end, oa)

          old_block = old[oa:ob]
          # 只做当前功能所需的最小兼容：旧提示词当时还没有形态商品，现版已支持形态。
          old_block = old_block.replace('血统、技能或装备', '血统、技能、装备或形态')
          old_block = old_block.replace('血统、技能、装备的强化、升阶、重铸或觉醒', '血统、技能、装备、形态的升级、重铸或觉醒')
          current = current[:ca] + old_block + current[cb:]

          # 8/26 基线在商品职责与示例里还残留强化分级命名；一并恢复成无计数的旧式完整替换方案。
          stale_lines = [
              "            + '      * 同阶强化与跨阶升阶均为有效升级方案，同一目标可同时提供同阶强化和跨阶升阶选项。\\\n'\r\n",
              "            + '      * 同阶强化与跨阶升阶均为有效升级方案，同一目标可同时提供同阶强化和跨阶升阶选项。\\\n'\n",
          ]
          for line in stale_lines:
              current = current.replace(line, '')

          current = current.replace('M16A2突击步枪·强化Ⅰ', 'M16A2突击步枪·改')

          # 形态仍是现行商品类型，确保旧提示词恢复不会把它从升级职责中丢掉。
          current = current.replace(
              '仅处理玩家当前已有血统、技能、装备的强化、升阶、重铸或觉醒。必须填写准确替换目标。',
              '仅处理玩家当前已有血统、技能、装备、形态的升级、重铸或觉醒。必须填写准确替换目标。'
          )
          current = current.replace(
              '仅处理玩家当前已有血统、技能、装备的强化、升阶或重铸。必须填写准确替换目标。',
              '仅处理玩家当前已有血统、技能、装备、形态的升级或重铸。必须填写准确替换目标。'
          )

          forbidden = [
              '【同阶强化】',
              '强化Ⅰ',
              '强化Ⅱ',
              '强化Ⅲ',
              '至少完成1次同阶强化',
              '商城可以提前展示未解锁的跨阶方案',
              '【升级命名铁律】',
              '【名称解析规则】',
              '【程序字段】',
              '任何【原始属性】均不得高于成品品质',
          ]
          leftovers = [x for x in forbidden if x in current]
          if leftovers:
              raise SystemExit('商城提示词仍残留强化门槛规则: ' + ' | '.join(leftovers))

          required = [
              '3. 升级重铸机制:',
              '升级与重铸的阶位上限，严格与上述第2条的【品质与视野权限控制】同步',
              '升级商品必须完整继承替换目标的已有有效词条',
              'M16A2突击步枪·改',
          ]
          missing = [x for x in required if x not in current]
          if missing:
              raise SystemExit('旧商城提示词恢复不完整: ' + ' | '.join(missing))

          current_path.write_bytes(current.encode('utf-8'))
          print('商城提示词已恢复到强化门槛引入前的升级重铸口径。')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check 'script/悬浮球状态栏.js'
          python3 - <<'PY'
          from pathlib import Path
          text = Path('script/悬浮球状态栏.js').read_text(encoding='utf-8')
          for token in ['【同阶强化】','强化Ⅰ','强化Ⅱ','强化Ⅲ','至少完成1次同阶强化','商城可以提前展示未解锁的跨阶方案','【升级命名铁律】','【名称解析规则】','【程序字段】','任何【原始属性】均不得高于成品品质']:
              assert token not in text, token
          for token in ['shopReinforcementValue','shopInspectUpgrade','shopFilterRawUpgrades','samReinforcementLabel','.强化']:
              assert token not in text, token
          assert '3. 升级重铸机制:' in text
          assert 'M16A2突击步枪·改' in text
          print('prompt rollback checks passed')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/restore-shop-prompt.yml'
          git add 'script/悬浮球状态栏.js'
          git commit -m 'restore mall prompt before reinforcement gating'
          git push
