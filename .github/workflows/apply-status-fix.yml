name: Apply status fixes

on:
  push:
    branches:
      - fix/status-quality-clean

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/status-quality-clean
          fetch-depth: 0
      - name: Apply patch
        run: python .github/apply_status_fix.py
      - name: Syntax check
        run: |
          node --check script/ZOD脚本.js
          node --check script/辅助计算脚本.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'World Book/⚙️品质效果数值规则.txt' 'World Book/⚙️状态协议.txt' script/ZOD脚本.js script/辅助计算脚本.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: align status quality handling"
          git push origin HEAD:fix/status-quality-clean
