name: creative-workshop-promote-stable

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: '创意工坊正式版本号，必须与 WORKSHOP_VERSION 一致，例如 2.0.9'
        required: true
        type: string
      target_sha:
        description: '要发布到正式通道的 main 提交 SHA；留空则使用触发工作流时的提交'
        required: false
        type: string

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish workshop]') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Cloudflare deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::缺少 GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::缺少 GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      - name: Resolve release target
        id: target
        shell: bash
        env:
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --tags origin main workshop-stable
          TARGET_SHA="$TARGET_SHA_INPUT"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="$GITHUB_SHA"
          fi
          TARGET_SHA="$(git rev-parse "$TARGET_SHA^{commit}")"

          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Refusing release: $TARGET_SHA is not on main."
            exit 1
          fi

          STABLE_SHA="$(git rev-parse origin/workshop-stable^{commit})"
          if ! git merge-base --is-ancestor "$STABLE_SHA" "$TARGET_SHA"; then
            echo "workshop-stable is a deployment pointer with rollback history; guarded realignment will use force-with-lease."
          fi

          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "stable_sha=$STABLE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout release target
        shell: bash
        run: git checkout --detach "${{ steps.target.outputs.sha }}"

      - name: Validate release version
        id: release
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: node cloudflare/scripts/validate-release-version.mjs workshop "$RELEASE_VERSION_INPUT"

      - name: Reject an existing immutable tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Refusing release: tag $TAG already exists and is immutable."
            exit 1
          fi

      - name: Worker contract tests
        working-directory: cloudflare
        run: npm test

      - name: Worker and release script syntax
        run: |
          find cloudflare/src -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find cloudflare/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z | xargs -0 -n1 node --check

      - name: Client contract tests
        run: node --test src/CreativeWorkshop/tests/*.test.mjs

      - name: Client syntax
        run: find src/CreativeWorkshop -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate production Worker deployment
        working-directory: cloudflare
        run: npx wrangler deploy --env production --dry-run

      - name: Apply shared D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Deploy production Worker
        working-directory: cloudflare
        run: npx wrangler deploy --env production

      - name: Verify production health and Discord login start
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://workshop.6661816.xyz';
          async function retry(label, fn) {
            let last;
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              try { return await fn(); }
              catch (error) {
                last = error;
                console.log(`${label} attempt ${attempt}/8 failed: ${error.message}`);
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }
            throw last;
          }

          await retry('health', async () => {
            const response = await fetch(`${base}/api/health`, { signal: AbortSignal.timeout(10000) });
            const body = await response.json();
            if (!response.ok || body.ok !== true || body.update_channel !== 'stable' || body.update_ref !== 'workshop-stable') {
              throw new Error(`unexpected health response: ${response.status} ${JSON.stringify(body)}`);
            }
            console.log('Production health passed:', body);
          });

          const loginId = 'a'.repeat(64);
          await retry('discord start', async () => {
            const response = await fetch(
              `${base}/api/auth/discord/start?login_id=${loginId}`,
              { redirect: 'manual', signal: AbortSignal.timeout(10000) },
            );
            const location = response.headers.get('location') || '';
            if (response.status !== 302 || !location.startsWith('https://discord.com/oauth2/authorize')) {
              throw new Error(`unexpected Discord start response: ${response.status} ${location}`);
            }
            const redirectUri = new URL(location).searchParams.get('redirect_uri');
            if (redirectUri !== `${base}/api/auth/discord/callback`) {
              throw new Error(`unexpected Discord callback: ${redirectUri}`);
            }
            console.log('Production Discord authorize start passed.');
          });

          const origin = 'https://client-smoke.invalid';
          const exchange = await fetch(`${base}/api/auth/exchange`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Origin: origin },
            body: JSON.stringify({ login_id: loginId }),
            signal: AbortSignal.timeout(10000),
          });
          if (exchange.status !== 409 || exchange.headers.get('access-control-allow-origin') !== origin) {
            throw new Error(`production auth polling/CORS failed: ${exchange.status}`);
          }
          console.log('Production auth polling/CORS passed.');
          NODE

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" "${{ steps.target.outputs.sha }}" \
            -m "Reincarnation Workshop v${{ steps.release.outputs.version }}"

      - name: Promote stable and tag atomically
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          git push --atomic \
            --force-with-lease="refs/heads/workshop-stable:${{ steps.target.outputs.stable_sha }}" \
            origin \
            "HEAD:refs/heads/workshop-stable" \
            "refs/tags/$TAG:refs/tags/$TAG"

          echo "### Reincarnation Workshop release promoted" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workshop version: `v${{ steps.release.outputs.version }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: `$TAG`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: `${{ steps.target.outputs.sha }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable ref: `workshop-stable`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Testing ref remains: `main`" >> "$GITHUB_STEP_SUMMARY"
          echo "- World engine release is independent and unchanged by this workflow." >> "$GITHUB_STEP_SUMMARY"
