name: settlement-credential-hotfix
on:
  push:
    branches: [fix/settlement-credential-baseline]
permissions:
  contents: write
jobs:
  red-green:
    if: ${{ !contains(github.event.head_commit.message, '[settlement-hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add regression tests
        run: |
          python tools/settlement-credential-hotfix.py --phase tests
          python tools/settlement-credential-test-sync.py
      - name: Red - reproduce credential baseline bug
        shell: bash
        run: |
          if node tests/settlement-status-aliases.cjs; then
            echo 'Expected the new regression to fail before implementation.'
            exit 1
          fi
          echo 'Red confirmed: old implementation does not satisfy the regression.'
      - name: Implement settlement baseline and status alignment
        run: python tools/settlement-credential-hotfix.py --phase implementation
      - name: Green - settlement regressions
        run: |
          node tests/settlement-status-aliases.cjs
          node tests/task-settlement-simplified.cjs
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Regular/结算任务美化.html" "World Book/【结算任务】[mvu_plot].txt" tests/settlement-status-aliases.cjs tests/task-settlement-simplified.cjs
          if git diff --cached --quiet; then
            echo 'No hotfix changes to commit.'
            exit 0
          fi
          git commit -m "fix: preserve settlement task baseline for credentials [settlement-hotfix]"
          git push
