      - name: Validate syntax and scope
        shell: bash
        run: |
          node --check 'script/悬浮球状态栏.js'
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          text = Path('Regular/开局.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          nonempty = [s for s in scripts if s.strip()]
          if not nonempty:
              raise SystemExit('no inline scripts found')
          for i, js in enumerate(nonempty):
              p = Path(tempfile.gettempdir()) / f'opening-inline-{i}.js'
              p.write_text(js, encoding='utf-8')
              subprocess.run(['node', '--check', str(p)], check=True)
          required = [
              'samsara_variable_api_mode',
              "chooseVariableApiMode('额外API')",
              'applyVariableApiMode',
              'data-variable-api-mode',
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'opening missing marker: {needle}')
          PY
          git config core.whitespace cr-at-eol
          git config core.quotepath false
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'Regular/开局.html'
          printf '%s\n' "${changed[@]}" | grep -Fx 'script/悬浮球状态栏.js'
          grep -Fq 'samsara_variable_api_mode' 'script/悬浮球状态栏.js'
          grep -Fq '🧭 变量更新方式' 'script/悬浮球状态栏.js'

      - name: Commit migrated files and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/add-variable-update-mode-once.yml'
          git add 'Regular/开局.html' 'script/悬浮球状态栏.js'
          git config core.whitespace cr-at-eol
          git diff --cached --check
          git commit -m 'feat: add variable update mode switch [skip ci]'
          git push origin HEAD:feat/variable-update-mode-switch
