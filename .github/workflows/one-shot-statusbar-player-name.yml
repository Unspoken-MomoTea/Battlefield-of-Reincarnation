name: one-shot-statusbar-player-name
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-statusbar-player-name.yml'
permissions:
  contents: write
jobs:
  direct-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Edit statusbar source directly
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Statusbar syntax check
        run: node --check script/悬浮球状态栏.js
      - name: Statusbar identity smoke check
        run: |
          grep -F "var PLAYER_NAME = '';" script/悬浮球状态栏.js
          grep -F "GS_PARENT.Samsara.playerName = PLAYER_NAME;" script/悬浮球状态栏.js
          grep -F "function isPlayerIdentity(value)" script/悬浮球状态栏.js
      - name: Commit direct source edit and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-statusbar-player-name.yml
          git add script/悬浮球状态栏.js
          git commit -m "fix: share Tavern player name in statusbar [task-awareness-built]"
          git push
