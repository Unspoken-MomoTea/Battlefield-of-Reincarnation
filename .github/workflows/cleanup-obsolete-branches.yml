name: cleanup-obsolete-branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete development branches
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|workshop-stable|'') continue ;;
            esac
            echo "Deleting obsolete branch: $branch"
            git push origin --delete "$branch"
            deleted=$((deleted + 1))
          done
          echo "Deleted obsolete branches: $deleted" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify branch set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t remaining < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          printf '%s\n' "${remaining[@]}"
          unexpected=0
          for branch in "${remaining[@]}"; do
            case "$branch" in
              main|workshop-stable) ;;
              *) echo "Unexpected remaining branch: $branch"; unexpected=1 ;;
            esac
          done
          exit "$unexpected"
