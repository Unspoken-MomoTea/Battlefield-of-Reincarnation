name: World Engine Hot Scene Priority Acceptance

on:
  push:
    branches: [fix/world-engine-context-ui-redesign]
    paths:
      - '.github/workflows/world-engine-hot-scene-priority.yml'

permissions:
  contents: write

jobs:
  priority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-engine-context-ui-redesign
          fetch-depth: 0

      - name: Red - many alien scenes currently crowd critical scenes
        run: |
          if node tests/world-engine-hot-scenes.cjs; then
            echo 'Expected current projection to fail crowded critical-scene case.' >&2
            exit 1
          fi

      - name: Apply priority fix
        run: python tools/fix-world-engine-hot-scene-priority.py

      - name: Green - hot scene projection
        run: node tests/world-engine-hot-scenes.cjs

      - name: Supporting contracts
        run: |
          node tests/world-engine-context-ui-redesign.cjs
          node tests/world-engine-person-scene-ui.cjs
          node tests/world-engine-scene-context.cjs
          node tests/world-engine-prompt-pipeline.cjs
          node tests/world-engine-request-transparency.cjs
          node tests/world-engine-schema-retry-diagnostics.cjs
          node tests/world-engine-macro-open-backbone.cjs
          node tests/world-engine-request-budget-retry-ui.cjs
          node tests/world-engine-ui-theme.cjs

      - name: Delivery build remains synchronized
        run: |
          python tools/build-world-engine.py --check
          node --check 'script/世界推进系统.js'

      - name: Verify critical scene contract
        run: |
          grep -q 'const criticalScenes = candidates.filter(scene => scene.强制保留)' 'World Book/[variables]当前变量.txt'
          grep -q 'scene.强制保留 = true' 'World Book/[variables]当前变量.txt'
          grep -q 'slice(0, 4)' 'World Book/[variables]当前变量.txt'
          git diff --check

      - name: Commit priority fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'World Book/[variables]当前变量.txt' script/世界引擎接入说明.md docs/世界引擎V2审计.md tests/world-engine-hot-scenes.cjs
          git diff --cached --check
          git commit -m 'fix: protect critical hot world scenes'
          git push origin HEAD:fix/world-engine-context-ui-redesign
