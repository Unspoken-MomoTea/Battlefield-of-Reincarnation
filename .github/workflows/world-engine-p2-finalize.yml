name: World Engine P2 Finalize

on:
  push:
    branches: [refactor/world-engine-p2-modularize]
    paths:
      - '.github/workflows/world-engine-p2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/world-engine-p2-modularize
          fetch-depth: 0
      - name: Reconcile P2 documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path('docs/世界引擎V2审计.md')
          text = audit.read_text(encoding='utf-8')
          old_row = '| 单文件承载推演+Prompt+UI | `世界推进系统.js` 体积大 | 维护边界差，但直接拆分风险高 | 后续拆分 | P2 | P0/P1 不改变加载方式 |'
          new_row = '| 单文件承载推演+Prompt+UI | 运行时仍为单文件，开发源码已拆为 7 个连续职责片段 | 兼顾维护边界与酒馆兼容性 | 源码片段 + 固定顺序构建单文件（已完成） | P2（已完成） | 构建结果与交付文件逐字节一致 |'
          if old_row not in text:
              raise SystemExit('audit matrix P2 row anchor missing')
          text = text.replace(old_row, new_row, 1)
          marker = '## 后续顺序\n\nP1-A 世界现场数据语义（已完成） → P1-B 角色关系 UI 与视觉系统（已完成） → P1-C Prompt 可观测性（已完成） → P2 单文件拆分。'
          if marker not in text:
              raise SystemExit('audit P2 sequence anchor missing')
          p2 = '''## P2：开发源码模块化、单文件交付（已完成）

- 运行时和酒馆安装方式不变：仍只加载 `script/世界推进系统.js`，不引入浏览器 `import/export`，不要求多脚本加载。
- 开发源改为 `script/world-engine-src/` 下 7 个连续职责片段：foundation/prompt、world-state、WorldResult、context/protocol、engine-runtime、engine-ui、bootstrap。
- `tools/build-world-engine.py` 是唯一构建入口，只按固定顺序拼接，不压缩、不改写、不注入业务文本。以后修改世界引擎业务源码后运行 `python tools/build-world-engine.py` 同步交付文件。
- `python tools/build-world-engine.py --check` 与 `node tests/world-engine-modules.cjs` 固定验证“7 个源码片段拼接 = 单文件交付”、职责锚点、IIFE 边界以及无运行时 ES Module。
- P2 首次拆分生成的 `script/世界推进系统.js` 与 P1-C 的 main 版本逐字节一致，因此本阶段没有改变 Prompt、Schema、MVU、生命周期、API、UI 或推演行为。
- P0/P1 永久测试全部通过；旧 `lifecycle / prose / world-engine` 测试保持与 main 完全相同的基线结果。
- P2 施工用 audit/split workflow 与一次性拆分脚本在验收后删除，仓库只保留开发源码片段、永久构建器、永久模块测试和设计文档。

## 后续顺序

P0（已完成） → P1-A（已完成） → P1-B（已完成） → P1-C（已完成） → P2（已完成）。世界引擎 V2 本轮架构改造收束；后续新增功能直接在对应源码片段开发，不再回到单文件直接堆叠。'''
          text = text.replace(marker, p2, 1)
          audit.write_text(text, encoding='utf-8')

          guide = Path('script/世界引擎接入说明.md')
          text = guide.read_text(encoding='utf-8')
          old_intro = '把 `世界推进系统.js` 作为独立酒馆脚本加载，并更新 `悬浮球状态栏.js`、`ZOD脚本.js`、`辅助计算脚本.js`、结算任务美化，以及世界书的 `[variables]当前变量`、`[mvu_update]变量更新规则` 两个条目。没有构建产物自动发布步骤；本目录源码不会自动同步到已导入酒馆的角色卡。'
          new_intro = '把 `世界推进系统.js` 作为独立酒馆脚本加载，并更新 `悬浮球状态栏.js`、`ZOD脚本.js`、`辅助计算脚本.js`、结算任务美化，以及世界书的 `[variables]当前变量`、`[mvu_update]变量更新规则` 两个条目。酒馆仍只加载这一份单文件；仓库中的开发源码位于 `script/world-engine-src/`，修改后运行 `python tools/build-world-engine.py` 生成 `世界推进系统.js`。构建不会自动同步到已导入酒馆的角色卡。'
          if old_intro not in text:
              raise SystemExit('integration guide intro anchor missing')
          text = text.replace(old_intro, new_intro, 1)
          insertion = '''\n\n## 开发源码与单文件交付（P2）\n\n世界引擎采用“开发源码分片、运行时单文件”的方式。业务修改应落在 `script/world-engine-src/*.part.js`，不要把 `script/世界推进系统.js` 当作独立第二份源码维护。修改完成后执行 `python tools/build-world-engine.py`；提交前执行 `python tools/build-world-engine.py --check` 与 `node tests/world-engine-modules.cjs`。构建器只做固定顺序拼接，不引入 npm、浏览器模块或额外运行时依赖，因此现有酒馆安装/加载方式不变。\n'''
          anchor = '\n\n## 2026-09-08 世界引擎界面重构'
          if anchor not in text:
              raise SystemExit('integration guide section anchor missing')
          text = text.replace(anchor, insertion + anchor, 1)
          guide.write_text(text, encoding='utf-8')

          design = Path('docs/世界引擎V2-P2模块化设计.md')
          text = design.read_text(encoding='utf-8')
          text = text.replace('## P2 首次拆分验收\n', '## P2 首次拆分验收（已完成）\n', 1)
          if 'P2 完成状态：' not in text:
              text += '\nP2 完成状态：7 个源码片段已纳入版本控制；永久构建/契约测试通过；最终单文件与 P1-C main 版本逐字节一致；酒馆加载方式未改变。\n'
          design.write_text(text, encoding='utf-8')
          PY
      - name: Verify permanent modular build
        shell: bash
        run: |
          python tools/build-world-engine.py --check
          node tests/world-engine-modules.cjs
          node --check 'script/世界推进系统.js'
          node tests/world-engine-observability.cjs
          node tests/world-engine-ui-theme.cjs
          node tests/world-engine-person-scene-ui.cjs
          node tests/world-engine-temporary-people.cjs
          node tests/world-engine-scene-context.cjs
          node tests/world-engine-prompt-pipeline.cjs
      - name: Prove delivery behavior unchanged from main
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- 'script/世界推进系统.js'
      - name: Remove P2 construction-only files
        shell: bash
        run: |
          git rm -f \
            .github/workflows/world-engine-p2-audit.yml \
            .github/workflows/world-engine-p2-modularize.yml \
            .github/workflows/world-engine-p2-finalize.yml \
            tools/audit-world-engine-p2.py \
            tools/split-world-engine-p2.py
      - name: Commit final P2 state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/世界引擎V2审计.md docs/世界引擎V2-P2模块化设计.md script/世界引擎接入说明.md
          git diff --cached --check
          git status --short
          git commit -m 'refactor: finalize world engine modular source layout'
          git push origin HEAD:refactor/world-engine-p2-modularize
