name: Patch world panel

on:
  push:
    paths:
      - '.github/workflows/patch-world-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/patch-world-panel.py

      - name: Validate JavaScript
        run: |
          node --check 'script/悬浮球状态栏.js'
          node --check 'script/ZOD脚本.js'

      - name: Validate embedded HTML scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for src in ['Regular/主神任务美化.html', 'Regular/试炼任务美化.html']:
              text = Path(src).read_text(encoding='utf-8')
              blocks = re.findall(r'<script[^>]*>([\s\S]*?)</script>', text, flags=re.I)
              if not blocks:
                  raise SystemExit(f'no script blocks found: {src}')
              for i, code in enumerate(blocks):
                  out = Path('/tmp') / (Path(src).stem + f'-{i}.js')
                  out.write_text(code, encoding='utf-8')
                  print(out)
          PY
          for f in /tmp/主神任务美化-*.js /tmp/试炼任务美化-*.js; do node --check "$f"; done

      - name: Commit business changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patch-world-panel.py .github/workflows/patch-world-panel.yml
          git add 'script/悬浮球状态栏.js' 'script/ZOD脚本.js' 'World Book/[mvu_update]变量更新规则.txt' 'Regular/主神任务美化.html' 'Regular/试炼任务美化.html'
          git add -u .github/patch-world-panel.py .github/workflows/patch-world-panel.yml
          git diff --cached --quiet && exit 0
          git commit -m "refine world stability and hide alien details"
          git push
