name: Fix achievement settlement replay

on:
  push:
    paths:
      - '.github/workflows/fix-achievement-settlement-replay.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"

      - name: Validate settlement beautifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('Regular/结算任务美化.html').read_bytes().decode('utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if len(scripts) != 1:
              raise SystemExit(f'expected one script block, found {len(scripts)}')
          Path('/tmp/settlement.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/settlement.js
          git diff --check -- 'Regular/结算任务美化.html'

      - name: Commit business change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-achievement-settlement-replay.yml
          git add 'Regular/结算任务美化.html'
          git commit -m 'preserve achievement settlement panel on refresh'
          git push origin HEAD:main
