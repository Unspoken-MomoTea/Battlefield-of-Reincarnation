name: World Engine Context UI Redesign Acceptance

on:
  push:
    branches: [fix/world-engine-context-ui-redesign]
    paths:
      - '.github/workflows/world-engine-context-ui-redesign.yml'

permissions:
  contents: write

jobs:
  context-ui-redesign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-engine-context-ui-redesign
          fetch-depth: 0
      - name: Red - reproduce duplicated scene projection and split UI
        run: |
          if node tests/world-engine-context-ui-redesign.cjs; then
            echo 'Expected redesign acceptance to fail before implementation.' >&2
            exit 1
          fi
      - name: Green - apply focused refactor and build
        run: |
          python tools/refactor-world-engine-context-ui-redesign.py
          python tools/build-world-engine.py
          python tools/build-world-engine.py --check
          node --check 'script/世界推进系统.js'
      - name: Green - context and UI redesign
        run: node tests/world-engine-context-ui-redesign.cjs
      - name: Green - person scene UI
        run: node tests/world-engine-person-scene-ui.cjs
      - name: Green - shared scene semantics
        run: node tests/world-engine-scene-context.cjs
      - name: Green - modules
        run: node tests/world-engine-modules.cjs
      - name: Green - prompt pipeline
        run: node tests/world-engine-prompt-pipeline.cjs
      - name: Green - request transparency
        run: node tests/world-engine-request-transparency.cjs
      - name: Verify scope
        run: |
          git diff --check
          ! grep -q "section('后台活动人物'" script/world-engine-src/50-engine-ui.part.js
          ! grep -q 'we-temp-person-list' script/world-engine-src/50-engine-ui.part.js
          grep -q 'readonly.世界.场外人物动态 = groupedScenes' 'World Book/[variables]当前变量.txt'
          grep -q "section('区域档案',areaDetail" script/world-engine-src/50-engine-ui.part.js
          test -z "$(git status --porcelain | awk '{print $2}' | grep -E '正则|regex' || true)"
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'World Book/[variables]当前变量.txt' \
            'World Book/⚙️额外思考.txt' \
            script/world-engine-src/10-world-state.part.js \
            script/world-engine-src/40-engine-runtime.part.js \
            script/world-engine-src/50-engine-ui.part.js \
            script/世界推进系统.js \
            script/世界引擎接入说明.md \
            docs/世界引擎V2审计.md \
            tests/world-engine-context-ui-redesign.cjs \
            tests/world-engine-person-scene-ui.cjs \
            tests/world-engine-scene-context.cjs
          git diff --cached --check
          git commit -m 'refactor: group scene context and unify world people UI'
          git push origin HEAD:fix/world-engine-context-ui-redesign
