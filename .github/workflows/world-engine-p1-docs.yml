name: World Engine P1 Docs Sync

on:
  push:
    branches:
      - refactor/world-engine-p0
    paths:
      - .github/workflows/world-engine-p1-docs.yml
      - tools/sync-world-engine-p1-docs.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/world-engine-p0
      - name: Sync P1 docs
        run: python tools/sync-world-engine-p1-docs.py
      - name: Verify docs
        shell: bash
        run: |
          grep -q 'v8 → v9 → v10' 'docs/世界引擎V2审计.md'
          grep -q 'P1-A：世界现场与人物背景关联（已完成）' 'docs/世界引擎V2审计.md'
          grep -q '### 世界现场与人物背景关联（2026-09-10）' 'script/世界引擎接入说明.md'
          grep -q '身边发展' 'script/世界引擎接入说明.md'
      - name: Commit docs
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'docs/世界引擎V2审计.md' 'script/世界引擎接入说明.md'
          git commit -m 'docs: document shared world scene semantics'
          git push origin HEAD:refactor/world-engine-p0
