name: world-time-prompt-policy

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-world-time-prompt-policy.py'
      - '.github/workflows/world-time-prompt-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply world time prompt policy
        run: python tools/patch-world-time-prompt-policy.py
      - name: Build world engine delivery
        run: python tools/build-world-engine.py
      - name: Syntax check
        run: node --check script/世界推进系统.js
      - name: Editable module prompt regression
        run: node tests/world-engine-module-prompts.cjs
      - name: World integrity regression
        run: node tests/world-engine-integrity-guard.cjs
      - name: Module synchronization
        run: node tests/world-engine-modules.cjs
      - name: Commit generated policy and remove one-shot tooling
        run: |
          rm tools/patch-world-time-prompt-policy.py .github/workflows/world-time-prompt-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: standardize world time dayparts'
          git push
