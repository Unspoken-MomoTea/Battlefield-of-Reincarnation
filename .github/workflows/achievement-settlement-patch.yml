      - name: Validate JavaScript and patch markers
        shell: bash
        run: |
          node --check 'script/辅助计算脚本.js'
          grep -q '完整世界结算时由辅助脚本统一发放奖励' 'script/ZOD脚本.js'
          grep -q '等待完整世界结算统一发奖' 'World Book/⚙️任务与委托系统.txt'
          grep -q '<achievement settlement>' 'World Book/【结算任务】[mvu_plot].txt'
          grep -q 'findRegex:.*achievement settlement' 'Regular/成就结算美化.html'

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'script/辅助计算脚本.js' 'script/ZOD脚本.js' 'World Book/⚙️任务与委托系统.txt' 'World Book/【结算任务】[mvu_plot].txt' 'Regular/成就结算美化.html'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: settle achievement rewards at world clear'
          git push
