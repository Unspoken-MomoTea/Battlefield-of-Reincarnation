name: World Engine P2 Modularization Acceptance

on:
  push:
    branches: [refactor/world-engine-p2-modularize]
    paths:
      - '.github/workflows/world-engine-p2-modularize.yml'

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/world-engine-p2-modularize
          fetch-depth: 1
      - name: Split current delivery at guarded boundaries
        run: python tools/split-world-engine-p2.py
      - name: Verify deterministic build before any source rewrite
        run: |
          python tools/build-world-engine.py --check
          node tests/world-engine-modules.cjs
          node --check 'script/世界推进系统.js'
      - name: Run P0/P1 permanent acceptance
        run: |
          node tests/world-engine-observability.cjs
          node tests/world-engine-ui-theme.cjs
          node tests/world-engine-person-scene-ui.cjs
          node tests/world-engine-temporary-people.cjs
          node tests/world-engine-scene-context.cjs
          node tests/world-engine-prompt-pipeline.cjs
      - name: Existing regression parity with main
        shell: bash
        run: |
          cp 'script/世界推进系统.js' /tmp/branch-world-engine.js
          git fetch origin main --depth=1
          for test_file in tests/world-engine-lifecycle-audit.cjs tests/world-engine-prose.cjs tests/world-engine.cjs; do
            cp /tmp/branch-world-engine.js 'script/世界推进系统.js'
            set +e
            node "$test_file" >/tmp/branch-test.log 2>&1
            branch_status=$?
            set -e
            git checkout FETCH_HEAD -- 'script/世界推进系统.js'
            set +e
            node "$test_file" >/tmp/main-test.log 2>&1
            main_status=$?
            set -e
            echo "$test_file: branch=$branch_status main=$main_status"
            if [ "$branch_status" -ne "$main_status" ]; then
              echo 'Regression parity failed'; cat /tmp/branch-test.log; cat /tmp/main-test.log; exit 1
            fi
          done
          cp /tmp/branch-world-engine.js 'script/世界推进系统.js'
          python tools/build-world-engine.py --check
      - name: Verify deployment boundary
        shell: bash
        run: |
          test ! -f package.json
          test -z "$(git status --porcelain | awk '{print $2}' | grep -E '(^|/)regex-|\.json$' || true)"
          ! grep -R -n -E '^\s*(import|export)\s' script/world-engine-src
          grep -q '(function (root)' 'script/world-engine-src/00-foundation-prompt.part.js'
          grep -q 'CommonJS 入口仅供离线测试' 'script/world-engine-src/60-bootstrap.part.js'
      - name: Commit authored source parts
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- script/world-engine-src)" ]; then
            echo 'No source parts to commit'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script/world-engine-src
          git commit -m 'refactor: split world engine authored source'
          git push origin HEAD:refactor/world-engine-p2-modularize
