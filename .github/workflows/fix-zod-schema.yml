name: Fix ZOD schema

on:
  push:
    paths:
      - '.github/workflows/fix-zod-schema.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply ZOD-only patch
        run: python .github/patch-zod-clean.py
      - name: Check ZOD syntax
        run: node --check 'script/ZOD脚本.js'
      - name: Check auxiliary syntax
        run: node --check 'script/辅助计算脚本.js'
      - name: Verify semantics
        run: |
          python -c "from pathlib import Path; z=Path('script/ZOD脚本.js').read_text(encoding='utf-8'); a=Path('script/辅助计算脚本.js').read_text(encoding='utf-8'); assert 'reinforcementLevel' not in z; assert '    强化:' not in z; assert '未登场' not in z; assert \"z.enum(['活跃', '死亡'])\" in z; assert \"状态: E_alienStatus.prefault('活跃')\" in z; assert 'registerMvuSchema(Schema)' in z; assert 'function onUpdateData(' in a; assert 'function recalcAllCharacters(' in a; assert 'function calcWorldStability(' in a; assert 'function checkTrialEligibility(' in a; assert 'normalizeAlienRosterStatuses' not in a; assert 'cleanupLegacyReinforcementFields' not in a"
      - name: Commit business change and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/patch-zod-clean.py .github/workflows/fix-zod-schema.yml
          git add 'script/ZOD脚本.js'
          git add -u .github/patch-zod-clean.py .github/workflows/fix-zod-schema.yml
          git diff --cached --quiet && exit 0
          git commit -m "remove legacy reinforcement schema"
          git push
