name: task-awareness-build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[task-awareness-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden one-off exploration UI fixer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/_oneoff_fix_exploration_ui.py')
          text = p.read_text(encoding='utf-8')
          old = "if 'we-ledger-strip' in text or 'we-ledger-stat' in text:\n    raise SystemExit('ledger strip leftovers remain in UI source')"
          new = "text = '\\n'.join(line for line in text.splitlines() if 'we-ledger-strip' not in line and 'we-ledger-stat' not in line) + '\\n'\nif 'we-ledger-strip' in text or 'we-ledger-stat' in text:\n    raise SystemExit('ledger strip leftovers remain in UI source')"
          if old not in text:
              raise SystemExit('one-off fixer guard anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Apply exploration ledger maintenance
        run: python tools/_oneoff_fix_exploration_ui.py
      - name: Build delivery
        run: python tools/build-world-engine.py
      - name: Syntax check
        run: node --check script/世界推进系统.js
      - name: Super-stable prompt regression
        run: node tests/world-engine-superstable-prompt.cjs
      - name: Task awareness regression
        run: node tests/world-engine-task-awareness.cjs
      - name: Chronology guard regression
        run: node tests/world-engine-chronology-guard.cjs
      - name: NPC audit regression
        run: node tests/world-engine-npc-audit-toggle.cjs
      - name: Module synchronization
        run: node tests/world-engine-modules.cjs
      - name: Commit generated delivery and maintenance changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve single-world exploration and simplify world ledger UI [task-awareness-built]"
          git push
