name: direct-player-owner-fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Red
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/task-settlement-simplified.cjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("玩家庄园: { 所属对象: ['<user>'], 类型: '固定地产' },", "玩家庄园: { 所属对象: ['测试玩家'], 类型: '固定地产' },", 1)
          s = s.replace("共管基地: { 所属对象: ['盟友', '<user>'], 类型: '要塞' },", "共管基地: { 所属对象: ['盟友', '测试玩家'], 类型: '要塞' },", 1)
          marker = "const ordinaryFinalize = makeSettlementFinalizeData(false);"
          if marker not in s: raise SystemExit('settlement test marker missing')
          s = s.replace(marker, "global.window = { parent: { SillyTavern: { name1: '测试玩家' } } };\n" + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          if node tests/task-settlement-simplified.cjs; then
            echo 'expected red failure'; exit 1
          fi
      - name: Green
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          def sub1(path, pattern, replacement, flags=0):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n, count = re.subn(pattern, replacement, s, count=1, flags=flags)
              if count != 1: raise SystemExit(f'{path}: replacement count={count}')
              p.write_text(n, encoding='utf-8')

          # 结算：实际玩家名来自酒馆运行时，不再只比较字面 <user>。
          sub1(
            'Regular/结算任务美化.html',
            r"              // 普通副本结束时只保留玩家拥有/共管的资产；纯NPC、势力或无主资产随副本清理。\n              const assets = ensureObject\(stat, '资产'\);\n              Object\.keys\(assets\)\.forEach\(function\(assetName\) \{\n                const asset = assets\[assetName\];\n                const rawOwners = asset && typeof asset === 'object' \? asset\.所属对象 : null;\n                // 兼容旧存档：缺失所属对象的历史资产仍按既有迁移语义视为玩家资产，避免误删。\n                const owners = Array\.isArray\(rawOwners\)\n                  \? rawOwners\n                  : \(rawOwners == null \? \['<user>'\] : \[String\(rawOwners\)\]\);\n                if \(owners\.indexOf\('<user>'\) >= 0\) return;\n                delete assets\[assetName\];\n                changed = true;\n              \}\);",
            """              // 普通副本结束时只保留玩家拥有/共管的资产；纯NPC、势力或无主资产随副本清理。
              // 提示词里的 <user> 可能已被酒馆展开为真实玩家名；程序侧必须直接读取运行时 name1。
              const assets = ensureObject(stat, '资产');
              const playerOwnerName = (() => {
                try {
                  const ctx = typeof getMvuContext === 'function' ? getMvuContext() : null;
                  const win = ctx && ctx.win ? ctx.win : null;
                  const host = win || ((typeof window !== 'undefined' && window.parent && window.parent !== window)
                    ? window.parent
                    : (typeof window !== 'undefined' ? window : null));
                  return String(host?.SillyTavern?.name1 || host?.SillyTavern?.getContext?.()?.name1 || host?.name1 || '').trim();
                } catch (e) { return ''; }
              })();
              const ownerKey = value => String(value || '').trim().toLowerCase();
              const legacyTemplateUser = '{{' + 'user}}';
              const playerOwnerKeys = new Set([playerOwnerName, '<user>', legacyTemplateUser, '玩家'].filter(Boolean).map(ownerKey));
              Object.keys(assets).forEach(function(assetName) {
                const asset = assets[assetName];
                const rawOwners = asset && typeof asset === 'object' ? asset.所属对象 : null;
                // 旧存档缺失所属对象时沿用既有迁移语义：视为玩家资产，避免误删。
                if (rawOwners == null) return;
                const owners = Array.isArray(rawOwners) ? rawOwners : [rawOwners];
                if (owners.some(owner => playerOwnerKeys.has(ownerKey(owner)))) return;
                delete assets[assetName];
                changed = true;
              });"""
          )

          # 辅助脚本自动收菜：同样识别当前酒馆玩家名，并兼容旧标记。
          sub1(
            'script/辅助计算脚本.js',
            r"    function isPlayerOwnedAsset\(asset\) \{\n        const owners = Array\.isArray\(asset\?\.所属对象\)\n            \? asset\.所属对象\n            : \(typeof asset\?\.所属对象 === 'string' \? \[asset\.所属对象\] : \[\]\);\n        return owners\.some\(owner => String\(owner \|\| ''\)\.trim\(\) === '<user>'\);\n    \}",
            """    function isPlayerOwnedAsset(asset, statData) {
        const owners = Array.isArray(asset?.所属对象)
            ? asset.所属对象
            : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
        if (!owners.length) return false;
        let playerName = '';
        try {
            let host = null;
            try { if (typeof GS_PARENT !== 'undefined' && GS_PARENT) host = GS_PARENT; } catch (e) {}
            if (!host && typeof window !== 'undefined') {
                try { if (window.parent && window.parent !== window) host = window.parent; } catch (e) {}
                if (!host) host = window;
            }
            playerName = String(host?.SillyTavern?.name1 || host?.SillyTavern?.getContext?.()?.name1 || host?.name1 || '').trim();
        } catch (e) {}
        const ownerKey = value => String(value || '').trim().toLowerCase();
        const legacyTemplateUser = '{{' + 'user}}';
        const playerOwnerKeys = new Set([playerName, '<user>', legacyTemplateUser, '玩家'].filter(Boolean).map(ownerKey));
        return owners.some(owner => playerOwnerKeys.has(ownerKey(owner)));
    }"""
          )
          sub1(
            'script/辅助计算脚本.js',
            r"if \(!asset \|\| typeof asset !== 'object' \|\| !isPlayerOwnedAsset\(asset\)\) return;",
            "if (!asset || typeof asset !== 'object' || !isPlayerOwnedAsset(asset, statData)) return;"
          )
          shutil.copyfile('script/辅助计算脚本.js', 'dist/V20260916/辅助计算脚本.js')

          # 当前变量投影：玩家资产过滤使用真实 Tavern name1 + 旧标记。
          sub1(
            'World Book/[variables]当前变量.txt',
            r"const projectionNameKey = value => String\(value \|\| ''\)\.toLowerCase\(\)\.replace\(/\[\\\\/／·・\._\\-\\s\]\+/g, ''\);\nconst isPlayerOwnedAsset = asset => \{\n  const owners = Array\.isArray\(asset\?\.所属对象\)\n    \? asset\.所属对象\n    : \(typeof asset\?\.所属对象 === 'string' \? \[asset\.所属对象\] : \[\]\);\n  return owners\.some\(owner => String\(owner \|\| ''\)\.trim\(\) === '<user>'\);\n\};",
            """const projectionNameKey = value => String(value || '').toLowerCase().replace(/[\\/／·・._\\-\\s]+/g, '');
const playerName = (() => {
  try {
    const host = (typeof window !== 'undefined' && window.parent && window.parent !== window)
      ? window.parent
      : (typeof window !== 'undefined' ? window : null);
    return String(host?.SillyTavern?.name1 || host?.SillyTavern?.getContext?.()?.name1 || host?.name1 || '').trim();
  } catch (_) { return ''; }
})();
const legacyTemplateUser = '{{' + 'user}}';
const playerIdentityKeys = new Set([playerName, '<user>', legacyTemplateUser, '玩家'].filter(Boolean).map(projectionNameKey));
const isPlayerOwnedAsset = asset => {
  const owners = Array.isArray(asset?.所属对象)
    ? asset.所属对象
    : (typeof asset?.所属对象 === 'string' ? [asset.所属对象] : []);
  return owners.some(owner => playerIdentityKeys.has(projectionNameKey(owner)));
};"""
          )

          # 原场外人物投影已有一套玩家名解析，改为复用上面的统一身份集合。
          p = Path('World Book/[variables]当前变量.txt')
          s = p.read_text(encoding='utf-8')
          start = s.find("    const playerName = (() => {", s.find("const personNameKey"))
          end_marker = "    const playerKeys = new Set([playerName, '{{user}}', '<user>', '玩家'].filter(Boolean).map(personNameKey));"
          end = s.find(end_marker, start)
          if start >= 0 and end >= 0:
              end += len(end_marker)
              s = s[:start] + "    const playerKeys = playerIdentityKeys;" + s[end:]
          p.write_text(s, encoding='utf-8')

          # 旧测试曾刻意锁死“只有字面 <user>”，同步到正确语义。
          p = Path('tests/world-engine-asset-multi-owner.cjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("assert.equal(isPlayerOwnedAsset({所属对象:['玩家']}), false);", "assert.equal(isPlayerOwnedAsset({所属对象:['玩家']}), true);", 1)
          s = s.replace("assert.equal(isPlayerOwnedAsset({所属对象:['{{user}}']}), false);", "assert.equal(isPlayerOwnedAsset({所属对象:['{{user}}']}), true);", 1)
          s = re.sub(r"assert\.match\(helper, /function isPlayerOwnedAsset[^\n]+\nconst harvestHelper", "assert.match(helper, /function isPlayerOwnedAsset[\\s\\S]{0,1800}SillyTavern[\\s\\S]{0,1800}<user>/, '自动收菜必须解析酒馆玩家名并兼容旧标记');\nconst harvestHelper", s, count=1)
          s = re.sub(r"assert\.doesNotMatch\(harvestHelper, /playerName\|SillyTavern[^\n]+", "assert.match(harvestHelper, /playerName|SillyTavern|玩家/, '自动收菜必须识别运行时玩家身份');", s, count=1)
          s = re.sub(r"assert\.match\(vars, /Array\\\.isArray[^\n]+", "assert.match(vars, /playerIdentityKeys[\\s\\S]{0,1800}SillyTavern/, '正文玩家资产投影必须解析酒馆玩家名');", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

          node --check script/辅助计算脚本.js
          node --check dist/V20260916/辅助计算脚本.js
          node tests/task-settlement-simplified.cjs
          node tests/world-engine-asset-multi-owner.cjs
          node tests/asset-harvest-lifecycle.cjs
          cmp -s script/辅助计算脚本.js dist/V20260916/辅助计算脚本.js
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/tmp-direct-player-owner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve player asset owner by Tavern name [task-awareness-built]'
          git push
