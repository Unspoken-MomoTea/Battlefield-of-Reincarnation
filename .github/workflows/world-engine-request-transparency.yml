name: World Engine Request Transparency Acceptance

on:
  push:
    branches: [fix/world-engine-request-transparency]
    paths:
      - '.github/workflows/world-engine-request-transparency.yml'

permissions:
  contents: write

jobs:
  transparency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-engine-request-transparency
          fetch-depth: 0
      - name: Apply focused refactor
        run: python tools/refactor-world-engine-request-transparency.py
      - name: Rebuild single-file delivery
        run: |
          python tools/build-world-engine.py
          python tools/build-world-engine.py --check
          node --check 'script/世界推进系统.js'
          node tests/world-engine-modules.cjs
      - name: Run focused acceptance
        run: |
          node tests/world-engine-request-transparency.cjs
          node tests/world-engine-observability.cjs
          node tests/world-engine-prompt-pipeline.cjs
          node tests/world-engine-ui-theme.cjs
          node tests/world-engine-person-scene-ui.cjs
          node tests/world-engine-temporary-people.cjs
          node tests/world-engine-scene-context.cjs
      - name: Verify scope
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain | awk '{print $2}' | grep -E '(^|/)regex-|World Book/.*regex|\.json$' || true)"
          ! grep -q '【本轮执行顺序】' script/world-engine-src/40-engine-runtime.part.js
          grep -q "世界书:books.map(b=>String(b.内容||'')).filter(Boolean)" script/world-engine-src/40-engine-runtime.part.js
          grep -q '固定系统注入' script/world-engine-src/50-engine-ui.part.js
          grep -q '本轮实际读取资料' script/world-engine-src/50-engine-ui.part.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            script/world-engine-src/40-engine-runtime.part.js \
            script/world-engine-src/50-engine-ui.part.js \
            script/世界推进系统.js \
            docs/世界引擎V2审计.md \
            script/世界引擎接入说明.md
          git diff --cached --check
          git commit -m 'fix: make world engine requests transparent'
          git push origin HEAD:fix/world-engine-request-transparency
