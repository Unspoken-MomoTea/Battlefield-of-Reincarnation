name: World Engine P1 Observability Acceptance

on:
  push:
    branches: [refactor/world-engine-p1-observability]
    paths:
      - '.github/workflows/world-engine-p1-observability.yml'

permissions:
  contents: write

jobs:
  observability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/world-engine-p1-observability
          fetch-depth: 1
      - name: Fix helper replacement escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/refactor-world-engine-p1-observability.py')
          s=p.read_text(encoding='utf-8')
          old="new_text, count = re.subn(pattern, repl, text, count=1, flags=flags)"
          new="new_text, count = re.subn(pattern, lambda _match: repl, text, count=1, flags=flags)"
          if s.count(old)!=1:
              raise SystemExit(f'helper escaping anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply guarded observability refactor
        run: python tools/refactor-world-engine-p1-observability.py
      - name: Syntax check
        run: node --check 'script/世界推进系统.js'
      - name: Token observability acceptance
        run: node tests/world-engine-observability.cjs
      - name: P1 regression checks
        run: |
          node tests/world-engine-ui-theme.cjs
          node tests/world-engine-person-scene-ui.cjs
          node tests/world-engine-temporary-people.cjs
          node tests/world-engine-scene-context.cjs
          node tests/world-engine-prompt-pipeline.cjs
      - name: Existing regression parity with main
        shell: bash
        run: |
          cp 'script/世界推进系统.js' /tmp/branch-world-engine.js
          git fetch origin main --depth=1
          for test_file in tests/world-engine-lifecycle-audit.cjs tests/world-engine-prose.cjs tests/world-engine.cjs; do
            cp /tmp/branch-world-engine.js 'script/世界推进系统.js'
            set +e
            node "$test_file" >/tmp/branch-test.log 2>&1
            branch_status=$?
            set -e
            git checkout FETCH_HEAD -- 'script/世界推进系统.js'
            set +e
            node "$test_file" >/tmp/main-test.log 2>&1
            main_status=$?
            set -e
            echo "$test_file: branch=$branch_status main=$main_status"
            if [ "$branch_status" -ne "$main_status" ]; then
              echo 'Regression parity failed'
              echo '--- branch ---'; cat /tmp/branch-test.log
              echo '--- main ---'; cat /tmp/main-test.log
              exit 1
            fi
          done
          cp /tmp/branch-world-engine.js 'script/世界推进系统.js'
      - name: Verify diagnostics boundary
        shell: bash
        run: |
          test -z "$(git status --porcelain | awk '{print $2}' | grep -E '(^|/)regex-|\.json$' || true)"
          ! grep -q '请求字符数:' 'script/世界推进系统.js'
          grep -q 'requestTokenTelemetry' 'script/世界推进系统.js'
          grep -q 'lastAttemptTelemetry' 'script/世界推进系统.js'
      - name: Commit P1-C source
        shell: bash
        run: |
          if git diff --quiet -- 'script/世界推进系统.js'; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'script/世界推进系统.js'
          git commit -m 'feat: add world engine token observability'
          git push origin HEAD:refactor/world-engine-p1-observability
