name: settlement-message-marker-hotfix
on:
  push:
    branches: [fix/settlement-message-marker]
permissions:
  contents: write
jobs:
  red-green:
    if: ${{ !contains(github.event.head_commit.message, '[settlement-message-marker-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python tools/apply-settlement-message-marker.py
      - name: Message marker regression
        run: node tests/settlement-message-marker.cjs
      - name: Shop coin persistence regression
        run: node tests/settlement-shop-coin-persistence.cjs
      - name: Current panel regression
        run: node tests/settlement-current-panel-regression.cjs
      - name: Simplified task settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: Settlement status alias regression
        run: node tests/settlement-status-aliases.cjs
      - name: ZOD syntax
        run: node --check script/ZOD脚本.js
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Regular/结算任务美化.html' 'script/ZOD脚本.js' 'World Book/[InitVar]世界初始设定.yaml' 'World Book/[variables]当前变量.txt' tests/settlement-shop-coin-persistence.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: move settlement coin marker out of stat_data [settlement-message-marker-fixed]'
          git push
