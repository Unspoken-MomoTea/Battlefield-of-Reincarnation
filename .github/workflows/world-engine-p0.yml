name: World Engine P0 Review

on:
  push:
    branches:
      - refactor/world-engine-p0
    paths:
      - .github/workflows/world-engine-p0.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/world-engine-p0
      - name: Restore business invariants
        run: python tools/review-world-engine-p0.py
      - name: Syntax check
        run: node --check 'script/世界推进系统.js'
      - name: Verify prompt architecture
        shell: bash
        run: |
          grep -q 'Step 7 · 输出差分' 'script/世界推进系统.js'
          grep -q '【Canonical WorldResult JSON Schema】' 'script/世界推进系统.js'
          if grep -q '【WorldResult 标准字段结构】' 'script/世界推进系统.js'; then
            echo 'Duplicated field manual still present'
            exit 1
          fi
      - name: Commit review fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'script/世界推进系统.js'
          git commit -m 'fix: preserve world engine business invariants'
          git push origin HEAD:refactor/world-engine-p0
