name: settlement-side-reward-rebalance
on:
  push:
    branches: [main]
    paths:
      - tools/patch-settlement-side-rewards.py
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply settlement rebalance patch
        run: python tools/patch-settlement-side-rewards.py
      - name: Settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: Commit renderer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Regular/结算任务美化.html
          git commit -m "fix: rebalance settlement side rewards and credential gating [task-awareness-built]"
          git push origin HEAD:main
