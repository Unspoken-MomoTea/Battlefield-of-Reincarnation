name: World Engine P1 Observability Audit

on:
  push:
    branches: [refactor/world-engine-p1-observability]
    paths:
      - '.github/workflows/world-engine-p1-observability-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/world-engine-p1-observability
      - name: Inspect request diagnostics flow
        run: python tools/audit-world-engine-p1-observability.py
