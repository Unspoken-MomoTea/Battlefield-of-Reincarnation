name: private-npc-audit-level
on:
  push:
    branches:
      - codex/private-npc-audit-level
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/private-npc-audit-level
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python tools/migrate-private-npc-audit.py
      - name: Preserve tier independence wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('script/world-engine-src/55-npc-narrative-audit.part.js')
          text=p.read_text(encoding='utf-8')
          old='1. 审计级别是世界推进私有信息'
          new='1. 审计级别与人物层级独立，是世界推进私有信息'
          assert old in text
          p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
      - name: Build delivery
        run: python tools/build-world-engine.py
      - name: Syntax checks
        run: |
          node --check script/世界推进系统.js
          node --check script/ZOD脚本.js
      - name: NPC audit regression
        run: node tests/world-engine-npc-audit-toggle.cjs
      - name: World integrity regression
        run: node tests/world-engine-integrity-guard.cjs
      - name: Commit migration
        shell: bash
        run: |
          rm tools/migrate-private-npc-audit.py
          rm .github/workflows/private-npc-audit-level.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: keep NPC audit levels private to world engine"
          git push origin HEAD:codex/private-npc-audit-level
