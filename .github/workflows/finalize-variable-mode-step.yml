name: Finalize variable mode step behavior

on:
  push:
    branches:
      - feat/variable-update-mode-switch
    paths:
      - .github/workflows/finalize-variable-mode-step.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/variable-update-mode-switch
      - name: Require mode application before leaving step one
        shell: python
        run: |
          from pathlib import Path
          p = Path('Regular/开局.html')
          text = p.read_bytes().decode('utf-8')
          nl = '\r\n' if '\r\n' in text else '\n'
          old = nl.join([
              '    // ===== 步骤 =====',
              '    function jumpStep(n) { ',
              '        currentStep = n; ',
              '        applyStepUI(); ',
              '    }',
              '    ',
              '    function goStep(dir) {',
              '        if (dir === 1 && currentStep < 4) currentStep++;',
              '        else if (dir === -1 && currentStep > 1) currentStep--;',
              '        applyStepUI();',
              '    }'
          ])
          new = nl.join([
              '    // ===== 步骤 =====',
              '    async function ensureVariableApiModeBeforeStepChange(targetStep) {',
              '        if (currentStep !== 1 || targetStep <= 1) return true;',
              '        const result = await chooseVariableApiMode(getVariableApiMode(), { silent:true });',
              '        if (result.ok) return true;',
              "        showToast(result.error || '变量更新方式尚未成功应用，请检查酒馆助手与世界书配置。', 'error');",
              '        return false;',
              '    }',
              '    async function jumpStep(n) {',
              '        if (!(await ensureVariableApiModeBeforeStepChange(n))) return;',
              '        currentStep = n;',
              '        applyStepUI();',
              '    }',
              '    ',
              '    async function goStep(dir) {',
              '        let targetStep = currentStep;',
              '        if (dir === 1 && currentStep < 4) targetStep = currentStep + 1;',
              '        else if (dir === -1 && currentStep > 1) targetStep = currentStep - 1;',
              '        if (!(await ensureVariableApiModeBeforeStepChange(targetStep))) return;',
              '        currentStep = targetStep;',
              '        applyStepUI();',
              '    }'
          ])
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'expected one step-navigation block, got {count}')
          p.write_bytes(text.replace(old, new, 1).encode('utf-8'))
      - name: Validate opening scripts
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          text = Path('Regular/开局.html').read_text(encoding='utf-8')
          scripts = [s for s in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I) if s.strip()]
          for i, js in enumerate(scripts):
              p = Path(tempfile.gettempdir()) / f'opening-final-{i}.js'
              p.write_text(js, encoding='utf-8')
              subprocess.run(['node', '--check', str(p)], check=True)
          assert 'ensureVariableApiModeBeforeStepChange' in text
          PY
          git config core.whitespace cr-at-eol
          git diff --check
          test "$(git diff --name-only)" = 'Regular/开局.html'
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/finalize-variable-mode-step.yml'
          git add 'Regular/开局.html'
          git config core.whitespace cr-at-eol
          git diff --cached --check
          git commit -m 'fix: apply variable mode before leaving setup step [skip ci]'
          git push origin HEAD:feat/variable-update-mode-switch
