name: task-awareness-build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[task-awareness-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harden migration matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/migrate-task-performance-settlement.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith('think_pattern ='))
          end = next(i for i in range(start, len(lines)) if "settlement prompt: dm_think replacement mismatch" in lines[i])
          replacement = '''think_old = """  调取字典与公式算账 (严格执行上述读取协议)：
          <%_ if (!isSingleWorld) { _%>
              - 确定读取：提取当前世界难度的最低评级，锁定【奖励基准评级】与对应的【基础奖励】常数
          <%_ } else { _%>
              - 确定读取：提取本次结算已完成主神任务中的最高评级，锁定【奖励基准评级】与对应的【基础奖励】常数
          <%_ } _%>
              - 评级打分：根据完成度得出 S-F，锁定【任务表现评级乘数】
          """
          think_new = """  调取字典与公式算账：
              - 逐任务采用模板锁定的表现评级与基础收益，禁止重新打分
          """
          if think_new not in text:
              if think_old not in text:
                  raise SystemExit('settlement prompt: dm_think block mismatch')
              text = text.replace(think_old, think_new, 1)'''.splitlines()
          # remove indentation introduced solely for this workflow heredoc
          replacement = [line[10:] if line.startswith('          ') else line for line in replacement]
          lines[start:end + 1] = replacement
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          PY
      - name: Apply task performance migration
        run: python tools/migrate-task-performance-settlement.py
      - name: Build delivery
        run: python tools/build-world-engine.py
      - name: Syntax check
        run: node --check script/世界推进系统.js
      - name: Task performance settlement regression
        run: node tests/task-performance-settlement.cjs
      - name: Super-stable prompt regression
        run: node tests/world-engine-superstable-prompt.cjs
      - name: Task awareness regression
        run: node tests/world-engine-task-awareness.cjs
      - name: Chronology guard regression
        run: node tests/world-engine-chronology-guard.cjs
      - name: NPC audit regression
        run: node tests/world-engine-npc-audit-toggle.cjs
      - name: Module synchronization
        run: node tests/world-engine-modules.cjs
      - name: Commit migrated files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "script/ZOD脚本.js" \
            "World Book/[mvu_update]变量更新规则.txt" \
            "World Book/⚙️任务与委托系统.txt" \
            "World Book/【结算任务】[mvu_plot].txt" \
            "Regular/主神任务美化.html" \
            "Regular/试炼任务美化.html" \
            "Regular/结算任务美化.html" \
            "tests/task-performance-settlement.cjs" \
            "script/世界推进系统.js"
          git commit -m "feat: add per-task performance settlement [task-awareness-built]"
          git push
