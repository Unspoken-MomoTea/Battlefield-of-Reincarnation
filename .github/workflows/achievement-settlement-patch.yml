name: Apply achievement settlement patch

on:
  push:
    paths:
      - '.github/workflows/achievement-settlement-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded achievement settlement patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              p = Path(path)
              raw = p.read_bytes().decode('utf-8')
              nl = '\r\n' if '\r\n' in raw else '\n'
              return p, raw.replace('\r\n', '\n'), nl

          def save(p, text, nl):
              if nl == '\r\n':
                  text = text.replace('\n', '\r\n')
              p.write_bytes(text.encode('utf-8'))

          def replace_once(path, old, new, label):
              p, text, nl = load(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              save(p, text.replace(old, new, 1), nl)

          # 1) 辅助计算脚本：取消实时发奖，改为完整世界结算时统一发放。
          helper, text, helper_nl = load('script/辅助计算脚本.js')
          old_live = '''            // 副本成就首次达成：根据状态变化立即发放锁定盲盒，不等待结算
            grantAchievementRewards(statData, statDataBefore);

'''
          new_live = '''            // 副本成就这里只记录状态；奖励统一在完整世界结算时发放

'''
          if text.count(old_live) != 1:
              raise SystemExit(f'helper live grant: expected 1 match, got {text.count(old_live)}')
          text = text.replace(old_live, new_live, 1)

          fn_start = text.find('    /**\n     * 副本成就即时奖励')
          fn_end = text.find('\n    /** 规范化生命层级', fn_start)
          if fn_start < 0 or fn_end < 0:
              raise SystemExit('helper reward function boundaries not found')
          new_fn = '''    /**
     * 副本成就结算奖励
     *   - 仅在完整世界清算时调用；游玩过程中只更新成就状态，不即时发奖
     *   - 扫描当前副本全部【已达成】成就，同名盲盒聚合后一次性写入背包
     *   - 完整结算随后清空副本成就；消息级防重入 + 空成就表共同保证不会重复发放
     * @returns {number} 本次实际发放的盲盒总数
     */
    function grantAchievementRewards(statData) {
        const currentAchievements = statData?.任务?.副本成就;
        if (!currentAchievements || typeof currentAchievements !== 'object' || !Object.keys(currentAchievements).length) return 0;
        if (!statData?.主角) return 0;

        const grants = {};
        const fallbackWorld = String(statData?.世界?.名称 || '').replace(/[【】《》]/g, '').trim();
        Object.entries(currentAchievements).forEach(([achievementName, achievement]) => {
            if (achievement?.状态 !== '已达成') return;

            const reward = String(achievement.奖励 || '').trim();
            let match = reward.match(/^(SSS|SS|S|A|B|C|D|E|F)\\s*级盲盒\\s*[·・]\\s*(.+)$/i);
            if (!match) match = reward.match(/^(SSS|SS|S|A|B|C|D|E|F)\\s*级盲盒\\s*[（(]\\s*([^）)]*)\\s*[）)]$/i);
            if (!match) match = reward.match(/^(SSS|SS|S|A|B|C|D|E|F)\\s*级盲盒\\s*$/i);
            if (!match) {
                console.warn('[成就奖励] 结算时无法识别盲盒格式:', achievementName, reward);
                return;
            }

            const grade = normalizeTier(match[1]);
            const world = String(match[2] || fallbackWorld).trim();
            const boxName = grade + '级盲盒' + (world ? ('·' + world) : '');
            if (!grants[boxName]) grants[boxName] = { grade, world, count: 0, achievements: [] };
            grants[boxName].count++;
            grants[boxName].achievements.push(achievementName);
        });

        if (!Object.keys(grants).length) return 0;
        const items = statData.主角.道具 = statData.主角.道具 || {};
        let grantedCount = 0;
        Object.entries(grants).forEach(([boxName, grant]) => {
            const existing = items[boxName] && typeof items[boxName] === 'object' ? items[boxName] : {};
            const currentQty = safeNum(existing.数量, 0);

            existing.品质 = grant.grade;
            existing.类型 = '盲盒';
            existing.数量 = currentQty + grant.count;
            existing.标签 = Array.from(new Set([...(Array.isArray(existing.标签) ? existing.标签 : []), '主神空间', '盲盒', grant.world].filter(Boolean)));
            existing.效果 = existing.效果 && typeof existing.效果 === 'object' ? existing.效果 : {};
            if (!existing.效果.开启) existing.效果.开启 = '盲盒抽奖，打开后随机抽取「' + (grant.world || '主神空间') + '」对应品质的奖励。';
            if (!existing.描述) existing.描述 = '副本成就奖励。';
            if (![0, 1, 2].includes(Number(existing.状态))) existing.状态 = 0;
            items[boxName] = existing;

            grantedCount += grant.count;
            console.log('[成就奖励] 结算发放:', boxName, '×' + grant.count, grant.achievements);
        });
        return grantedCount;
    }
'''
          text = text[:fn_start] + new_fn + text[fn_end:]

          settle_anchor = '''                if (shouldCompleteTrial) {
                    sd.系统状态 = sd.系统状态 || {};
                    sd.系统状态.试炼已完成 = true;
                }
                // 1. 基础数据重置
'''
          settle_new = '''                if (shouldCompleteTrial) {
                    sd.系统状态 = sd.系统状态 || {};
                    sd.系统状态.试炼已完成 = true;
                }
                // 完整副本结算：先发放当前副本全部已达成成就的锁定盲盒，再清理副本数据。
                // 单一世界不生成副本成就，因此仅轮回模式执行。
                if (!isSingleWorld) {
                    grantAchievementRewards(sd);
                }
                // 1. 基础数据重置
'''
          if text.count(settle_anchor) != 1:
              raise SystemExit(f'helper settlement anchor: expected 1 match, got {text.count(settle_anchor)}')
          text = text.replace(settle_anchor, settle_new, 1)
          save(helper, text, helper_nl)

          # 2) 任务规则与 ZOD 注释同步。
          replace_once(
              'World Book/⚙️任务与委托系统.txt',
              '    - 副本成就首次达成时由系统立即发放锁定奖励，AI只负责更新成就状态',
              '    - 副本成就达成时AI只负责更新成就状态；锁定奖励由系统在完整世界结算时统一发放',
              'task system reward rule',
          )
          replace_once(
              'World Book/⚙️任务与委托系统.txt',
              '    已达成 + 系统立即发奖（终态）',
              '    已达成（等待完整世界结算统一发奖，终态）',
              'task system state machine',
          )
          replace_once(
              'script/ZOD脚本.js',
              '        // 副本成就: 首次从未达成变为已达成时，由辅助脚本立即发放奖励',
              '        // 副本成就: AI仅维护未达成/已达成；完整世界结算时由辅助脚本统一发放奖励',
              'zod achievement comment',
          )

          # 3) 结算世界书：把当前成就数据固化进结算消息，数据库清空后仍可重放。
          settlement, text, settlement_nl = load('World Book/【结算任务】[mvu_plot].txt')
          top_anchor = '''  const warehouseSummary = (() => {
    const parts = [];
    if (warehouseEquipText) parts.push(`装备: ${warehouseEquipText}`);
    if (warehouseItemText) parts.push(`道具: ${warehouseItemText}`);
    return parts.length ? parts.join(' | ') : '（仓库为空）';
  })();
'''
          top_extra = '''
  // 副本成就快照：完整结算后数据库会被清空，因此把全部成就固化进结算消息本身。
  // 单一世界不生成副本成就；数据库为空时不输出额外成就窗口。
  const cleanAchievementField = (value) => String(value == null ? '' : value)
    .replace(/\\r?\\n/g, ' ')
    .replace(/\\|/g, '／')
    .trim();
  const achievementEntries = Object.entries(_.get(rule_data, '任务.副本成就', {}) || {}).map(([name, item]) => {
    const a = item && typeof item === 'object' ? item : {};
    return {
      name: cleanAchievementField(name),
      difficulty: cleanAchievementField(a.难度),
      desc: cleanAchievementField(a.说明),
      reward: cleanAchievementField(a.奖励),
      status: cleanAchievementField(a.状态 || '未达成'),
    };
  });
  const achievementDoneCount = achievementEntries.filter((a) => a.status === '已达成').length;
  const achievementWorldName = cleanAchievementField(_.get(rule_data, '世界.名称', '当前副本')) || '当前副本';
'''
          if text.count(top_anchor) != 1:
              raise SystemExit(f'settlement top anchor: expected 1 match, got {text.count(top_anchor)}')
          text = text.replace(top_anchor, top_anchor + top_extra, 1)

          display_anchor = '''前端展示层 (必须使用 `<settlement tasks>` 标签包裹，强制按以下Markdown格式输出，严禁擅自增加无关闲聊):
============================================================
<settlement tasks>
'''
          display_new = '''前端展示层 (必须使用 `<settlement tasks>` 标签包裹，强制按以下Markdown格式输出，严禁擅自增加无关闲聊):
  - 轮回模式且数据库存在副本成就时：在 `</settlement tasks>` 后必须逐字输出程序预填的 `<achievement settlement>` 成就快照块；严禁改名、改序、改状态、改奖励或遗漏任一项
  - `<achievement settlement>` 只用于前端成就结算窗口与历史消息重放；AI不得把其中的奖励再次写入变量，奖励由后台结算脚本统一发放
============================================================
<settlement tasks>
'''
          if text.count(display_anchor) != 1:
              raise SystemExit(f'settlement display anchor: expected 1 match, got {text.count(display_anchor)}')
          text = text.replace(display_anchor, display_new, 1)

          end_anchor = '''</settlement tasks>
</System_Rules>
'''
          end_new = '''</settlement tasks>
<%_ if (!isSingleWorld && achievementEntries.length) { _%>
<achievement settlement>
副本：<%= achievementWorldName %>
达成：<%= achievementDoneCount %>/<%= achievementEntries.length %>
<%_ achievementEntries.forEach((a, index) => { _%>
<%= index + 1 %>|<%= a.difficulty %>|<%= a.name %>|<%= a.desc %>|<%= a.reward %>|<%= a.status %>
<%_ }); _%>
</achievement settlement>
<%_ } _%>
</System_Rules>
'''
          if text.count(end_anchor) != 1:
              raise SystemExit(f'settlement end anchor: expected 1 match, got {text.count(end_anchor)}')
          text = text.replace(end_anchor, end_new, 1)
          save(settlement, text, settlement_nl)

          # 最终结构断言。
          _, helper_check, _ = load('script/辅助计算脚本.js')
          if 'grantAchievementRewards(statData, statDataBefore);' in helper_check:
              raise SystemExit('old immediate achievement grant call still exists')
          if 'function grantAchievementRewards(statData)' not in helper_check:
              raise SystemExit('new settlement achievement grant function missing')
          if helper_check.count('grantAchievementRewards(sd);') != 1:
              raise SystemExit('settlement achievement grant call missing or duplicated')
          if helper_check.index('grantAchievementRewards(sd);') > helper_check.index('sd.任务.副本成就 = {};'):
              raise SystemExit('achievement rewards would be granted after achievement data is cleared')

          _, settlement_check, _ = load('World Book/【结算任务】[mvu_plot].txt')
          if '<achievement settlement>' not in settlement_check or 'achievementEntries.length' not in settlement_check:
              raise SystemExit('achievement settlement snapshot block missing')

          print('Achievement settlement patch applied successfully.')
          PY

          node --check 'script/辅助计算脚本.js'
          git -c core.whitespace=cr-at-eol diff --check
          git diff -- 'script/辅助计算脚本.js' 'script/ZOD脚本.js' 'World Book/⚙️任务与委托系统.txt' 'World Book/【结算任务】[mvu_plot].txt'

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/achievement-settlement-patch.yml
          git add 'script/辅助计算脚本.js' 'script/ZOD脚本.js' 'World Book/⚙️任务与委托系统.txt' 'World Book/【结算任务】[mvu_plot].txt'
          git commit -m 'settle achievement rewards at world clear'
          git push origin HEAD:main
