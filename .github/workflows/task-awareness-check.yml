name: task-awareness-check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  task-awareness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build delivery
        run: python tools/build-world-engine.py
      - name: Exploration pruning regression
        run: node tests/world-engine-exploration-prune.cjs
      - name: Simplified task settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: Task awareness regression
        run: node tests/world-engine-task-awareness.cjs
      - name: Soft maintenance regression
        run: node tests/world-engine-soft-maintenance.cjs
      - name: Auto progress regression
        run: node tests/world-engine-auto-progress.cjs
      - name: Chronology guard regression
        run: node tests/world-engine-chronology-guard.cjs
      - name: World integrity regression
        run: node tests/world-engine-integrity-guard.cjs
      - name: NPC audit regression
        run: node tests/world-engine-npc-audit-toggle.cjs
      - name: Asset scope regression
        run: node tests/world-engine-asset-writeback.cjs
      - name: Module synchronization
        run: node tests/world-engine-modules.cjs
      - name: Generated delivery synchronized
        run: python tools/build-world-engine.py --check
