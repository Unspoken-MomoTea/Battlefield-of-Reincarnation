name: task-awareness-check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  task-awareness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync settlement coin balance baseline
        run: python tools/patch-settlement-coin-baseline.py
      - name: Sync task-independent settlement coin accounting
        run: python tools/patch-settlement-coin-task-independence.py
      - name: Sync settlement snapshot follow-up
        run: python tools/patch-settlement-snapshot-followup.py
      - name: Sync hierarchical world history memory
        run: python tools/patch-world-history-memory.py
      - name: Persist replay with primary world write
        run: python tools/patch-world-replay-single-write.py
      - name: Build delivery
        run: python tools/build-world-engine.py
      - name: Legacy world commit marker removed
        run: |
          legacy="__samsara""WorldCommit"
          if grep -R "$legacy" script tests tools --exclude-dir=.git; then
            echo "legacy world commit marker still exists"
            exit 1
          fi
      - name: World engine syntax check
        run: |
          if ! node --check script/世界推进系统.js; then
            echo "::group::World engine syntax failure context"
            nl -ba script/世界推进系统.js | sed -n '8734,8756p'
            echo "::endgroup::"
            exit 1
          fi
      - name: Statusbar syntax check
        run: node --check script/悬浮球状态栏.js
      - name: Auxiliary syntax check
        run: node --check script/辅助计算脚本.js
      - name: Full world engine regression suite
        run: node tests/run-world-engine-suite.cjs
      - name: Simplified task settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: Settlement coin task-independence regression
        run: node tests/settlement-coin-task-independence.cjs
      - name: Settlement snapshot follow-up regression
        run: node tests/settlement-snapshot-followup.cjs
      - name: Settlement shop coin persistence regression
        run: node tests/settlement-shop-coin-persistence.cjs
      - name: Settlement message marker regression
        run: node tests/settlement-message-marker.cjs
      - name: Settlement current panel regression
        run: node tests/settlement-current-panel-regression.cjs
      - name: Settlement status alias regression
        run: node tests/settlement-status-aliases.cjs
      - name: Settlement character lifecycle regression
        run: node tests/settlement-character-lifecycle.cjs
      - name: Statusbar settlement topbar regression
        run: node tests/statusbar-settlement-topbar.cjs
      - name: Opening catalog regression
        run: node tests/opening-catalog.cjs
      - name: Opening character asset regression
        run: node tests/opening-character-assets.cjs
      - name: Opening page compile regression
        run: node tests/opening-page.cjs
      - name: Opening storage contract
        run: node tests/opening-storage-contract.cjs
      - name: Generated delivery synchronized
        run: python tools/build-world-engine.py --check
