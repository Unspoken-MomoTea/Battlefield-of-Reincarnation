name: task-awareness-build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[task-awareness-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync variable prompt world time ownership
        run: python tools/patch-world-time-ownership.py
      - name: Remove world request size cap
        run: python tools/patch-world-request-size-cap.py
      - name: Sync settlement character lifecycle
        run: python tools/patch-settlement-character-lifecycle.py
      - name: Sync settlement coin balance baseline
        run: python tools/patch-settlement-coin-baseline.py
      - name: Sync task-independent settlement coin accounting
        run: python tools/patch-settlement-coin-task-independence.py
      - name: Sync settlement snapshot follow-up
        run: python tools/patch-settlement-snapshot-followup.py
      - name: Sync hierarchical world history memory
        run: python tools/patch-world-history-memory.py
      - name: Fold history leaves into world commit
        run: python tools/patch-history-per-advance-commit.py
      - name: Persist replay with primary world write
        run: python tools/patch-world-replay-single-write.py
      - name: Build world engine delivery
        run: python tools/build-world-engine.py
      - name: Build statusbar delivery
        run: python tools/build-status-bar.py
      - name: Sync auxiliary delivery
        run: cp script/辅助计算脚本.js "dist/V20260916/辅助计算脚本.js"
      - name: Legacy world commit marker removed
        run: |
          legacy="__samsara""WorldCommit"
          if grep -R "$legacy" script tests tools --exclude-dir=.git; then
            echo "legacy world commit marker still exists"
            exit 1
          fi
      - name: Syntax check
        run: |
          if ! node --check script/世界推进系统.js; then
            echo "::group::World engine syntax failure context"
            nl -ba script/世界推进系统.js | sed -n '8734,8756p'
            echo "::endgroup::"
            exit 1
          fi
      - name: Statusbar source contracts
        run: node --test src/StatusBar/tests/*.test.mjs
      - name: Statusbar syntax check
        run: node --check script/悬浮球状态栏.js
      - name: Auxiliary syntax check
        run: node --check script/辅助计算脚本.js
      - name: Full world engine regression suite
        run: node tests/run-world-engine-suite.cjs
      - name: Simplified task settlement regression
        run: node tests/task-settlement-simplified.cjs
      - name: Settlement coin task-independence regression
        run: node tests/settlement-coin-task-independence.cjs
      - name: Settlement snapshot follow-up regression
        run: node tests/settlement-snapshot-followup.cjs
      - name: Trial promotion identity regression
        run: node tests/trial-promotion-flow.cjs
      - name: Legacy trial identity regression
        run: node tests/trial-legacy-identity.cjs
      - name: Settlement shop coin persistence regression
        run: node tests/settlement-shop-coin-persistence.cjs
      - name: Settlement message marker regression
        run: node tests/settlement-message-marker.cjs
      - name: Settlement current panel regression
        run: node tests/settlement-current-panel-regression.cjs
      - name: Settlement status alias regression
        run: node tests/settlement-status-aliases.cjs
      - name: Settlement character lifecycle regression
        run: node tests/settlement-character-lifecycle.cjs
      - name: Statusbar settlement topbar regression
        run: node tests/statusbar-settlement-topbar.cjs
      - name: Commit generated delivery
        run: |
          if git diff --quiet -- src/StatusBar tools/build-status-bar.py src/WorldEngine/core/WorldEngineFoundation.part.js src/WorldEngine/core/WorldSharedUtilities.part.js src/WorldEngine/core/WorldEngineRuntimeConstants.part.js src/WorldEngine/ui/WorldThemeCatalog.part.js src/WorldEngine/prompts/WorldBasePromptDefaults.part.js src/WorldEngine/domains/WorldStateModel.part.js src/WorldEngine/core/SamsaraWorldEngine.part.js src/WorldEngine/core/WorldEngineConfigService.part.js src/WorldEngine/domains/WorldHistoryMemoryPolicy.part.js src/WorldEngine/prompts/WorldPromptDefaults.part.js src/WorldEngine/domains/WorldReplayService.part.js script/世界推进系统.js script/悬浮球状态栏.js script/辅助计算脚本.js "dist/V20260916/辅助计算脚本.js" script/ZOD脚本.js "World Book/[mvu_update]变量更新规则.txt" "World Book/[variables]当前变量.txt" "World Book/[InitVar]世界初始设定.yaml" "World Book/⚙️资产与载具规则.txt" "Regular/结算任务美化.html" "Regular/选择世界美化.txt" "Regular/试炼任务美化.html" "script/世界引擎接入说明.md" "docs/世界引擎V2审计.md" tests/statusbar-settlement-topbar.cjs tests/world-engine.cjs tests/world-engine-superstable-prompt.cjs tests/world-engine-prompt-pipeline.cjs tests/world-engine-scene-context.cjs tests/world-engine-asset-multi-owner.cjs tests/world-engine-asset-writeback.cjs tests/world-engine-request-transparency.cjs tests/world-engine-observability.cjs tests/world-engine-history-memory.cjs tests/world-engine-history-memory-safety.cjs tests/world-engine-history-memory-editor.cjs tests/world-engine-auto-reprocess.cjs tests/world-engine-reprocess-missing-snapshot-policy.cjs tests/world-engine-causal-offset-editor.cjs tests/world-time-lifecycle.cjs tests/asset-harvest-lifecycle.cjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/StatusBar tools/build-status-bar.py src/WorldEngine/core/WorldEngineFoundation.part.js src/WorldEngine/core/WorldSharedUtilities.part.js src/WorldEngine/core/WorldEngineRuntimeConstants.part.js src/WorldEngine/ui/WorldThemeCatalog.part.js src/WorldEngine/prompts/WorldBasePromptDefaults.part.js src/WorldEngine/domains/WorldStateModel.part.js src/WorldEngine/core/SamsaraWorldEngine.part.js src/WorldEngine/core/WorldEngineConfigService.part.js src/WorldEngine/domains/WorldHistoryMemoryPolicy.part.js src/WorldEngine/prompts/WorldPromptDefaults.part.js src/WorldEngine/domains/WorldReplayService.part.js script/世界推进系统.js script/悬浮球状态栏.js script/辅助计算脚本.js "dist/V20260916/辅助计算脚本.js" script/ZOD脚本.js "World Book/[mvu_update]变量更新规则.txt" "World Book/[variables]当前变量.txt" "World Book/[InitVar]世界初始设定.yaml" "World Book/⚙️资产与载具规则.txt" "Regular/结算任务美化.html" "Regular/选择世界美化.txt" "Regular/试炼任务美化.html" "script/世界引擎接入说明.md" "docs/世界引擎V2审计.md" tests/statusbar-settlement-topbar.cjs tests/world-engine.cjs tests/world-engine-superstable-prompt.cjs tests/world-engine-prompt-pipeline.cjs tests/world-engine-scene-context.cjs tests/world-engine-asset-multi-owner.cjs tests/world-engine-asset-writeback.cjs tests/world-engine-request-transparency.cjs tests/world-engine-observability.cjs tests/world-engine-history-memory.cjs tests/world-engine-history-memory-safety.cjs tests/world-engine-history-memory-editor.cjs tests/world-engine-auto-reprocess.cjs tests/world-engine-reprocess-missing-snapshot-policy.cjs tests/world-engine-causal-offset-editor.cjs tests/world-time-lifecycle.cjs tests/asset-harvest-lifecycle.cjs
          git commit -m "build: sync generated deliveries [task-awareness-built]"
          git push
