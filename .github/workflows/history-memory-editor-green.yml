name: history-memory-editor-green
on:
  push:
    branches: [fix/history-memory-editor]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate editor layer
        run: python tools/patch-history-memory-editor-integration.py
      - name: Build world engine
        run: python tools/build-world-engine.py
      - name: Syntax check
        run: node --check script/世界推进系统.js
      - name: History memory editor regression
        run: node tests/world-engine-history-memory-editor.cjs
      - name: History memory regression
        run: node tests/world-engine-history-memory.cjs
      - name: History memory safety regression
        run: node tests/world-engine-history-memory-safety.cjs
      - name: Causal offset editor regression
        run: node tests/world-engine-causal-offset-editor.cjs
      - name: Module synchronization
        run: node tests/world-engine-modules.cjs
      - name: Commit generated delivery only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/世界推进系统.js tests/world-engine-modules.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync history memory editor [history-editor-built]"
          git push
