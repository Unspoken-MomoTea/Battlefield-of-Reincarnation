name: Apply trial locked values

on:
  push:
    paths:
      - '.github/workflows/apply-trial-locked-values.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python .github/patch-trial-locked-values.py

      - name: Validate trial beautifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('Regular/试炼任务美化.html').read_bytes().decode('utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if len(scripts) != 1:
              raise SystemExit(f'expected one script block, found {len(scripts)}')
          Path('/tmp/trial.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/trial.js
          git -c core.whitespace=cr-at-eol diff --check -- 'Regular/试炼任务美化.html'

      - name: Commit business change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-trial-locked-values.yml .github/patch-trial-locked-values.py
          git add 'Regular/试炼任务美化.html'
          git commit -m 'normalize program-locked trial values before validation'
          git push origin HEAD:main
