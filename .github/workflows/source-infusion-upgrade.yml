name: Source infusion upgrade

on:
  push:
    paths:
      - '.github/workflows/source-infusion-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate patch
        run: |
          python .github/fix-source-infusion-helper.py
          python .github/source-infusion-patch.py

      - name: Commit patch and cleanup
        shell: bash
        run: |
          rm -f .github/source-infusion-patch.py .github/fix-source-infusion-helper.py .github/workflows/source-infusion-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'script/悬浮球状态栏.js' 'Regular/结算任务美化.html' .github/source-infusion-patch.py .github/fix-source-infusion-helper.py .github/workflows/source-infusion-upgrade.yml
          git diff --cached --quiet && exit 0
          git commit -m "add source infusion progression path"
          git push
