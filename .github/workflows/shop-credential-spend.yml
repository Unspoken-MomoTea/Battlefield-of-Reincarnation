name: shop-credential-spend
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: ${{ contains(github.event.head_commit.message, '[apply-shop-credential-spend]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair patcher assumptions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-shop-credential-spend.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)",
               "out, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)"),
              ("if rollback_count != 3:", "if rollback_count != 2:"),
              ("expected 3 matches, got {rollback_count}", "expected 2 matches, got {rollback_count}"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one patcher anchor for {old!r}, got {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply focused patch
        run: python tools/apply-shop-credential-spend.py
      - name: Cover stop-fusion rollback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script/悬浮球状态栏.js')
          raw = p.read_bytes()
          s = raw.decode('utf-8')
          nl = '\r\n' if '\r\n' in s else '\n'
          old = (
              "                    statData.角色.空间币 = safeNum(statData.角色.空间币, 0) + bloodFusionSnap.price;" + nl +
              "                    if (bloodFusionSnap.preBloodLib !== null && statData.商城) {"
          )
          new = (
              "                    statData.角色.空间币 = safeNum(statData.角色.空间币, 0) + bloodFusionSnap.price;" + nl +
              "                    statData.角色.权限凭证 = statData.角色.权限凭证 || {};" + nl +
              "                    shopCredentialRefund(statData.角色.权限凭证, bloodFusionSnap.credentialRequirements || {});" + nl +
              "                    if (bloodFusionSnap.preBloodLib !== null && statData.商城) {"
          )
          if s.count(old) != 1:
              raise SystemExit(f'expected one stop-fusion rollback anchor, got {s.count(old)}')
          p.write_bytes(s.replace(old, new, 1).encode('utf-8'))
          PY
      - name: Validate fusion rollback coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('script/悬浮球状态栏.js').read_bytes().decode('utf-8')
          needle = 'shopCredentialRefund(statData.角色.权限凭证, bloodFusionSnap.credentialRequirements || {})'
          count = s.count(needle)
          if count != 3:
              raise SystemExit(f'expected 3 credential-refund rollback paths, got {count}')
          PY
      - name: Syntax check
        run: node --check script/悬浮球状态栏.js
      - name: Existing shop permission regression
        run: node tests/shop-permission-guard.cjs
      - name: Existing credential ledger regression
        run: node tests/credential-ledger-integration.cjs
      - name: Shop credential spend regression
        run: node tests/shop-credential-spend.cjs
      - name: Diff hygiene
        run: git diff --check -- script/悬浮球状态栏.js 'World Book/⚙️品质效果数值规则.txt' tests/shop-credential-spend.cjs
      - name: Commit verified changes and remove temporary patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply-shop-credential-spend.py .github/workflows/shop-credential-spend.yml
          git add script/悬浮球状态栏.js 'World Book/⚙️品质效果数值规则.txt' tests/shop-credential-spend.cjs
          git diff --cached --quiet && exit 1
          git commit -m "feat: spend credentials on high-grade shop purchases"
          git push
