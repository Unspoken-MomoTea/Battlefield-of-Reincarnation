name: shop-credential-spend
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: ${{ contains(github.event.head_commit.message, '[apply-shop-credential-spend]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused patch
        run: python tools/apply-shop-credential-spend.py
      - name: Syntax check
        run: node --check script/悬浮球状态栏.js
      - name: Existing shop permission regression
        run: node tests/shop-permission-guard.cjs
      - name: Existing credential ledger regression
        run: node tests/credential-ledger-integration.cjs
      - name: Shop credential spend regression
        run: node tests/shop-credential-spend.cjs
      - name: Diff hygiene
        run: git diff --check -- script/悬浮球状态栏.js 'World Book/⚙️品质效果数值规则.txt' tests/shop-credential-spend.cjs
      - name: Commit verified changes and remove temporary patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply-shop-credential-spend.py .github/workflows/shop-credential-spend.yml
          git add script/悬浮球状态栏.js 'World Book/⚙️品质效果数值规则.txt' tests/shop-credential-spend.cjs
          git diff --cached --quiet && exit 1
          git commit -m "feat: spend credentials on high-grade shop purchases"
          git push
