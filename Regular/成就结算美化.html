<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>副本成就结算渲染器</title>
  <!--
    正则配置说明（导入 SillyTavern 酒馆正则时）:
      findRegex:     /<achievement settlement>([\s\S]*?)<\/achievement settlement>/gsi
      replaceString: 本文件“替换模板开始”~“替换模板结束”之间的全部内容
      对应输出格式: World Book/【结算任务】[mvu_plot].txt

    数据格式:
      副本：世界名
      达成：N/6
      序号|难度星级|成就名|说明|奖励|状态

    本渲染器只负责显示，不读取/写入 MVU；奖励由辅助计算脚本在完整世界结算时统一入包。
  -->
  <style>
    * { box-sizing: border-box; }

    :root {
      --ac-bg-1: rgba(31, 22, 15, 0.98);
      --ac-bg-2: rgba(12, 15, 22, 0.98);
      --ac-orange: #fb923c;
      --ac-orange-soft: #fdba74;
      --ac-gold: #f5d76e;
      --ac-green: #86efac;
      --ac-text: #e8dfcf;
      --ac-dim: #98a5b3;
      --ac-line: rgba(251, 146, 60, 0.22);
    }

    body {
      margin: 0;
      padding: 10px 16px;
      background: transparent;
      color: var(--ac-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
      line-height: 1.6;
    }

    .ac-wrap { margin: 2px 0 20px; }

    .ac-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      border: 1px solid rgba(251,146,60,0.52);
      border-radius: 5px;
      background: linear-gradient(135deg, rgba(58,33,15,0.95), rgba(28,19,13,0.95));
      color: var(--ac-orange-soft);
      cursor: pointer;
      user-select: none;
      font-size: 0.88em;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 3px 13px rgba(0,0,0,0.36), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: all 0.22s ease;
      clip-path: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
    }

    .ac-btn:hover,
    .ac-btn.active {
      border-color: var(--ac-orange);
      transform: translateY(-1px);
      box-shadow: 0 5px 18px rgba(0,0,0,0.43), 0 0 14px rgba(251,146,60,0.16);
    }

    .ac-icon {
      color: var(--ac-orange);
      font-size: 1.08em;
      text-shadow: 0 0 8px rgba(251,146,60,0.5);
      transition: transform 0.25s ease;
    }

    .ac-btn.active .ac-icon { transform: rotate(45deg); }

    .ac-panel {
      display: none;
      max-width: 760px;
      margin-top: 9px;
      overflow: hidden;
      border: 1px solid var(--ac-line);
      border-radius: 10px;
      background: linear-gradient(145deg, var(--ac-bg-1), var(--ac-bg-2));
      box-shadow: 0 10px 38px rgba(0,0,0,0.48);
      position: relative;
    }

    .ac-panel.show {
      display: block;
      animation: acIn 0.26s ease;
    }

    .ac-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--ac-orange), transparent);
      pointer-events: none;
    }

    @keyframes acIn {
      from { opacity: 0; transform: translateY(-7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ac-head {
      padding: 15px 17px 12px;
      border-bottom: 1px solid rgba(251,146,60,0.14);
      background:
        radial-gradient(ellipse at 18% 0%, rgba(251,146,60,0.14), transparent 62%),
        linear-gradient(180deg, rgba(251,146,60,0.035), transparent);
    }

    .ac-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .ac-title {
      color: #fed7aa;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(251,146,60,0.32);
    }

    .ac-count {
      color: var(--ac-orange-soft);
      font: 800 0.82em "Cascadia Code", "Consolas", monospace;
      white-space: nowrap;
    }

    .ac-world {
      margin-top: 5px;
      color: var(--ac-dim);
      font-size: 0.77em;
      letter-spacing: 0.6px;
    }

    .ac-progress {
      height: 5px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 3px;
      background: rgba(255,255,255,0.07);
    }

    .ac-progress > i {
      display: block;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #f59e0b, #fb923c, #fdba74);
      box-shadow: 0 0 8px rgba(251,146,60,0.4);
    }

    .ac-list { padding: 9px 12px 5px; }

    .ac-item {
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      gap: 10px;
      align-items: start;
      margin: 6px 0;
      padding: 10px 11px;
      border: 1px solid rgba(255,255,255,0.065);
      border-radius: 7px;
      background: rgba(255,255,255,0.025);
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .ac-item:hover { background: rgba(255,255,255,0.04); }

    .ac-item.done {
      border-color: rgba(134,239,172,0.2);
      background: rgba(134,239,172,0.035);
    }

    .ac-stars {
      min-width: 58px;
      color: var(--ac-orange);
      font-size: 0.72em;
      line-height: 1.75;
      letter-spacing: -1px;
      text-shadow: 0 0 7px rgba(251,146,60,0.35);
    }

    .ac-main { min-width: 0; }

    .ac-name {
      color: #ead9c7;
      font-size: 0.86em;
      font-weight: 800;
      word-break: break-word;
    }

    .ac-desc {
      margin-top: 3px;
      color: var(--ac-dim);
      font-size: 0.75em;
      line-height: 1.55;
      word-break: break-word;
    }

    .ac-reward {
      margin-top: 5px;
      color: #d3b98d;
      font-size: 0.72em;
      word-break: break-word;
    }

    .ac-grade {
      display: inline-block;
      min-width: 30px;
      margin-right: 5px;
      padding: 0 5px;
      text-align: center;
      border: 1px solid rgba(245,215,110,0.4);
      border-radius: 3px;
      color: var(--ac-gold);
      background: rgba(245,215,110,0.055);
      font-weight: 900;
    }

    .ac-state {
      align-self: center;
      padding: 2px 8px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 0.71em;
      font-weight: 900;
      white-space: nowrap;
    }

    .ac-state.ok {
      color: var(--ac-green);
      border-color: rgba(134,239,172,0.42);
      background: rgba(134,239,172,0.07);
    }

    .ac-state.no {
      color: #94a3b8;
      border-color: rgba(148,163,184,0.28);
      background: rgba(148,163,184,0.045);
    }

    .ac-foot {
      margin: 7px 12px 12px;
      padding: 10px 11px 4px;
      text-align: center;
      border-top: 1px dashed rgba(255,255,255,0.1);
      color: #b8c2cc;
      font-size: 0.77em;
      letter-spacing: 0.5px;
    }

    .ac-foot b { color: var(--ac-orange-soft); }

    .ac-empty {
      padding: 18px;
      text-align: center;
      color: #8793a0;
      font-size: 0.82em;
    }

    @media (max-width: 600px) {
      body { padding: 9px 10px; }
      .ac-panel { max-width: 100%; }
      .ac-item { grid-template-columns: minmax(0,1fr) auto; }
      .ac-stars { grid-column: 1 / -1; min-width: 0; }
      .ac-desc { font-size: 0.73em; }
    }
  </style>
</head>
<body>

  <!-- 替换模板开始 -->
  <div class="ac-wrap">
    <div class="ac-btn">
      <span class="ac-icon">✦</span>
      <span class="ac-label">副本成就结算</span>
    </div>
    <div class="ac-panel"></div>
    <div class="ac-raw" style="display:none;">$1</div>

    <script>
      (function() {
        'use strict';

        const currentScript = document.currentScript;
        if (!currentScript) return;
        const wrapper = currentScript.closest('.ac-wrap');
        if (!wrapper) return;

        const btn = wrapper.querySelector('.ac-btn');
        const label = wrapper.querySelector('.ac-label');
        const panel = wrapper.querySelector('.ac-panel');
        const rawDiv = wrapper.querySelector('.ac-raw');
        if (!btn || !label || !panel || !rawDiv) return;

        function escapeHtml(value) {
          return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        const rawText = rawDiv.textContent || '';
        const lines = rawText.replace(/\r/g, '').split('\n').map(function(line) {
          return line.trim();
        }).filter(Boolean);

        let world = '';
        let done = null;
        let total = null;
        const rows = [];

        lines.forEach(function(line) {
          let match = line.match(/^副本[：:]\s*(.*)$/);
          if (match) {
            world = match[1].trim();
            return;
          }

          match = line.match(/^达成[：:]\s*(\d+)\s*\/\s*(\d+)/);
          if (match) {
            done = parseInt(match[1], 10) || 0;
            total = parseInt(match[2], 10) || 0;
            return;
          }

          const parts = line.split('|');
          if (parts.length < 6) return;
          rows.push({
            no: parts[0].trim(),
            difficulty: parts[1].trim(),
            name: parts[2].trim(),
            desc: parts[3].trim(),
            reward: parts[4].trim(),
            status: parts.slice(5).join('|').trim()
          });
        });

        if (total == null || total <= 0) total = rows.length;
        if (done == null) {
          done = rows.filter(function(row) { return row.status === '已达成'; }).length;
        }
        done = Math.max(0, Math.min(done, total || done));

        label.textContent = world ? ('成就结算 · ' + world) : '副本成就结算';
        const percent = total > 0 ? Math.round(done / total * 100) : 0;

        let html = '';
        html += '<div class="ac-head">';
        html += '<div class="ac-title-row"><div class="ac-title">◆ 副本成就结算</div><div class="ac-count">' + done + ' / ' + total + '</div></div>';
        if (world) html += '<div class="ac-world">副本：' + escapeHtml(world) + '</div>';
        html += '<div class="ac-progress"><i style="width:' + percent + '%"></i></div>';
        html += '</div>';

        if (!rows.length) {
          html += '<div class="ac-empty">未检测到副本成就记录。</div>';
        } else {
          html += '<div class="ac-list">';
          rows.forEach(function(row) {
            const reached = row.status === '已达成';
            const starCount = (row.difficulty.match(/★/g) || []).length;
            const starText = starCount > 0 ? '★'.repeat(starCount) : (row.difficulty || '—');
            const gradeMatch = row.reward.toUpperCase().match(/(SSS|SS|S|A|B|C|D|E|F)\s*级盲盒/);

            html += '<div class="ac-item' + (reached ? ' done' : '') + '">';
            html += '<div class="ac-stars">' + escapeHtml(starText) + '</div>';
            html += '<div class="ac-main">';
            html += '<div class="ac-name">' + escapeHtml(row.name || ('成就 ' + row.no)) + '</div>';
            if (row.desc) html += '<div class="ac-desc">' + escapeHtml(row.desc) + '</div>';
            if (row.reward) {
              html += '<div class="ac-reward">🎁 ';
              if (gradeMatch) html += '<span class="ac-grade">' + escapeHtml(gradeMatch[1]) + '</span>';
              html += escapeHtml(row.reward) + '</div>';
            }
            html += '</div>';
            html += '<div class="ac-state ' + (reached ? 'ok' : 'no') + '">' + (reached ? '已达成' : '未达成') + '</div>';
            html += '</div>';
          });
          html += '</div>';

          html += '<div class="ac-foot">';
          if (done > 0) {
            html += '本次达成 <b>' + done + '</b> 项成就，对应盲盒已统一发送至玩家背包。';
          } else {
            html += '本次未达成副本成就，无成就盲盒发放。';
          }
          html += '</div>';
        }

        panel.innerHTML = html;

        btn.addEventListener('click', function() {
          btn.classList.toggle('active');
          panel.classList.toggle('show');
        });
      })();
    </script>
  </div>
  <!-- 替换模板结束 -->

</body>
</html>
